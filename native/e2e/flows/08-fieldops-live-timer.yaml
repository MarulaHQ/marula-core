# Field ops — live timer on the lock screen (Wave 33 lane 2, re-hung on the
# pack's ticket anatomy: the clock link, the board's gold "Timer running" row,
# and the deep-linked dev status screen).
#
# The in-app timer drives the platform mirror from the same server session.
appId: org.marula.app
---
- runFlow: 00-clean-start.yaml
- tapOn: "Board, tab.*"
- tapOn:
    id: "ticket-row-.*"
- extendedWaitUntil:
    visible:
      id: "ticket-action-bar"
    timeout: 15000
- tapOn: "Start the clock"
- tapOn:
    id: "ticket-back"
- extendedWaitUntil:
    visible: ".*Timer running.*"
    timeout: 20000
# The dev status screen: what the lock screen is showing, and why.
- openLink: "marula:///dev/live"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "dev-live-screen"
    timeout: 10000
- assertVisible: "SUPPORTED"
- tapOn:
    id: "dev-live-update"
- tapOn:
    id: "dev-live-end"
# The dev screen is a pushed stack route — back to the tabs first.
- tapOn: ".*Back.*"
# Clean finish: stop the session on the Time tab.
- tapOn: "Today, tab.*"
- tapOn: "Time, tab.*"
- tapOn: "Stop and log"
- extendedWaitUntil:
    visible:
      id: "stop-log-sheet"
    timeout: 10000
- tapOn:
    id: "stop-log-commit"
- extendedWaitUntil:
    notVisible:
      id: "timer-pill"
    timeout: 10000

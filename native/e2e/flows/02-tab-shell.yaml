# Tab shell navigation: Today -> Board -> Scan -> More -> Today.
# Tabs are peers and switch instantly (no slide) per the motion law.
appId: tech.meridian.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 20000
- tapOn: "Board, tab.*"
- extendedWaitUntil:
    visible:
      id: "ticket-list"
    timeout: 10000
- tapOn: "Scan, tab.*"
- assertVisible:
    id: "scan-screen"
- tapOn: "More, tab.*"
- assertVisible:
    id: "more-screen"
- tapOn: "Today, tab.*"
- assertVisible:
    id: "today-screen"

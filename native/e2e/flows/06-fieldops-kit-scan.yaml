# Field ops — toolbox scan → whole-kit checkout → tool return (Wave 33 lane 2,
# re-hung on the rebranded scan sheets).
#
# Deterministic path: the injector types the toolbox stencil (KIT-FIELD-1) and
# the kit resolves through POST /api/v1/scan/resolve; the checkout runs the
# lane-3 transaction; scanning the tool's serial then returns that unit with a
# per-line checkin. Fixtures come from native/e2e/seed-fieldops.mjs.
appId: org.marula.app
---
- runFlow: 00-clean-start.yaml
# Scan the toolbox stencil: one match lands in the found sheet.
- tapOn: "Scan, tab.*"
- tapOn:
    id: "scan-input"
- inputText: "KIT-FIELD-1"
# Return submits the go-keyboard (resolve) and blurs; the guarded tap covers
# the case where the submit did not fire.
- inputText: "\n"
- runFlow:
    when:
      notVisible:
        id: "scan-found-sheet"
    commands:
      - tapOn:
          id: "scan-resolve"
- extendedWaitUntil:
    visible:
      id: "scan-found-sheet"
    timeout: 10000
- assertVisible: "Field network kit"
# The kit screen: availability, then the whole-kit transaction.
- tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "tool-kit-screen"
    timeout: 10000
- assertVisible: "READY"
- tapOn:
    id: "kit-checkout"
- extendedWaitUntil:
    visible: ".*Checked out.*"
    timeout: 15000
# Return the hand tool by scanning its serial.
- tapOn:
    id: "tool-kit-back"
- tapOn: "Today, tab.*"
- tapOn: "Tools"
- extendedWaitUntil:
    visible:
      id: "tools-screen"
    timeout: 10000
- tapOn:
    id: "tools-scan-input"
- inputText: "CT-0001"
- inputText: "\n"
- runFlow:
    when:
      notVisible: ".*back in stock.*"
    commands:
      - tapOn:
          id: "tools-scan-resolve"
- extendedWaitUntil:
    visible: ".*back in stock.*"
    timeout: 15000

# Ticket detail: notes and timer are server-backed entities.
# Opens a ticket from the board and exercises both mutations.
appId: org.marula.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 20000
- tapOn: "Board, tab.*"
- tapOn:
    id: "ticket-row-.*"
- assertVisible:
    id: "ticket-parts"
- tapOn:
    id: "ticket-timer-start"
- extendedWaitUntil:
    visible:
      id: "timer-bar"
    timeout: 15000
- tapOn:
    id: "ticket-timer-stop"
- scrollUntilVisible:
    element:
      id: "note-input"
    direction: DOWN
    visibilityPercentage: 40
    centerElement: true
- tapOn:
    id: "note-input"
- inputText: "Maestro site note"
- hideKeyboard
- tapOn:
    id: "note-submit"
- assertVisible: "Maestro site note"

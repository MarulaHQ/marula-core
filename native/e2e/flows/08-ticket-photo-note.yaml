# Ticket detail: the time section renders, a sampled photo stages, and the
# note carries it — on the pack's composer sheet. The sample injector rides
# the same upload path the system picker feeds (dev builds opt in), so the
# flow stays deterministic.
appId: org.marula.app
---
- runFlow: 00-clean-start.yaml
- tapOn: "Board, tab.*"
- tapOn:
    id: "ticket-row-.*"
- extendedWaitUntil:
    visible:
      id: "ticket-action-bar"
    timeout: 15000
- tapOn:
    id: "ticket-action-note"
- extendedWaitUntil:
    visible:
      id: "note-composer-sheet"
    timeout: 10000
- tapOn:
    id: "composer-kind-note"
- tapOn:
    id: "note-attach-sample"
- extendedWaitUntil:
    visible: "1 photo attached."
    timeout: 20000
- tapOn:
    id: "note-composer-input"
- inputText: "Maestro photo note"
- tapOn:
    id: "note-composer-send"
- scrollUntilVisible:
    element:
      text: ".*Maestro photo note.*"
    direction: DOWN
    visibilityPercentage: 40
    centerElement: true
- assertVisible: ".*Maestro photo note.*"
- extendedWaitUntil:
    visible: "site-panel.png"
    timeout: 30000

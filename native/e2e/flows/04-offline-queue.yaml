# Offline queue: force offline from the dev menu, write a note, watch it
# queue, then toggle back and watch it sync — the DX-standard proof that
# never touches OS-level network settings.
appId: org.marula.app
---
- runFlow: 00-clean-start.yaml
- tapOn: "More, tab.*"
- tapOn:
    id: "more-airplane-toggle"
- assertVisible:
    id: "banner-offline"
- tapOn: "Board, tab.*"
- tapOn:
    id: "ticket-row-.*"
- extendedWaitUntil:
    visible:
      id: "ticket-action-bar"
    timeout: 15000
# The note goes through the composer sheet; offline it queues and the
# optimistic bubble renders immediately.
- tapOn:
    id: "ticket-action-note"
- extendedWaitUntil:
    visible:
      id: "note-composer-sheet"
    timeout: 10000
- tapOn:
    id: "note-composer-input"
- inputText: "Offline Maestro note"
- tapOn:
    id: "note-composer-send"
- assertVisible: ".*Offline Maestro note.*"
- tapOn:
    id: "ticket-back"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "More, tab.*"
- assertVisible:
    id: "banner-offline"
- tapOn:
    id: "more-airplane-toggle"
- extendedWaitUntil:
    notVisible:
      id: "banner-offline"
    timeout: 20000
- tapOn: "Board, tab.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "ticket-row-.*"
- extendedWaitUntil:
    visible:
      id: "ticket-action-bar"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Offline Maestro note.*"
    direction: DOWN
    visibilityPercentage: 40
    centerElement: true
- assertVisible: ".*Offline Maestro note.*"

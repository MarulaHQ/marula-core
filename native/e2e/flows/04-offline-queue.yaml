# Offline queue: force offline from the dev menu, write a note, watch it
# queue, then toggle back and watch it sync — the DX-standard proof that
# never touches OS-level network settings.
appId: org.marula.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 20000
- tapOn: "More, tab.*"
- tapOn:
    id: "more-airplane-toggle"
- assertVisible:
    id: "banner-offline"
- tapOn: "Board, tab.*"
- tapOn:
    id: "ticket-row-.*"
- scrollUntilVisible:
    element:
      id: "note-input"
    direction: DOWN
    visibilityPercentage: 40
    centerElement: true
- tapOn:
    id: "note-input"
- inputText: "Offline Maestro note"
- hideKeyboard
- tapOn:
    id: "note-submit"
- assertVisible: "Offline Maestro note"
- tapOn: "More, tab.*"
- assertVisible:
    id: "banner-offline"
- tapOn:
    id: "more-airplane-toggle"
- extendedWaitUntil:
    notVisible:
      id: "banner-offline"
    timeout: 20000
- tapOn: "Board, tab.*"
- tapOn: "Board, tab.*"
- tapOn:
    id: "ticket-row-.*"
- scrollUntilVisible:
    element:
      text: "Offline Maestro note"
    direction: DOWN
    visibilityPercentage: 40
    centerElement: true
- assertVisible: ".*Offline Maestro note.*"

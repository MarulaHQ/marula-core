<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marula logo pop-in</title>
<style>
@font-face{font-family:"Fraunces";src:url("../07-fonts/Fraunces-variable-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#FBF7EC;--ink:#2B2A33;--leaf:#5E7F3A;--stem:#7C746A}
@media (prefers-color-scheme:dark){:root{--bg:#2B2A33;--ink:#F6EFD9;--leaf:#A9C25D;--stem:#CDB38B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.stage{display:flex;flex-direction:column;align-items:center;gap:32px;padding:24px}
.lk{display:flex;align-items:center;gap:22px}
.mk{position:relative;width:120px;height:120px;flex-shrink:0}
.fr{position:absolute;left:19px;top:30px;width:83px;height:83px;border-radius:50%;background:#E8B83A;transform-origin:50% 100%}
.hl{position:absolute;left:34px;top:51px;width:22px;height:15px;border-radius:50%;background:#F6EFD9;opacity:.75}
.sm{position:absolute;left:58px;top:20px;width:5px;height:13px;border-radius:3px;background:var(--stem);transform-origin:50% 100%}
.lf{position:absolute;left:60px;top:5px;width:45px;height:22px;transform-origin:0 100%}
.wd{width:350px;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:104px;letter-spacing:-.03em;line-height:1.1;display:flex}
.wd span{display:inline-block}
/* Timeline (about 1.9s): drop 0-750ms, stem 500, leaf 600, highlight 850, slide 1100, letters from 1250 staggered 70ms */
.go .lk{animation:slide .8s cubic-bezier(.65,0,.35,1) 1.1s both}
.go .fr{animation:drop .75s cubic-bezier(.34,1.56,.64,1) both}
.go .sm{animation:grow .25s ease-out .5s both}
.go .lf{animation:leaf .55s cubic-bezier(.34,1.8,.64,1) .6s both}
.go .hl{animation:shine .4s ease-out .85s both}
.go .wd span{animation:rise .5s cubic-bezier(.34,1.4,.64,1) both}
.go .wd span:nth-child(1){animation-delay:1.25s}.go .wd span:nth-child(2){animation-delay:1.32s}.go .wd span:nth-child(3){animation-delay:1.39s}.go .wd span:nth-child(4){animation-delay:1.46s}.go .wd span:nth-child(5){animation-delay:1.53s}.go .wd span:nth-child(6){animation-delay:1.6s}
@keyframes slide{from{transform:translateX(186px)}to{transform:translateX(0)}}
@keyframes drop{0%{transform:translateY(-110px) scale(.5);opacity:0}55%{transform:translateY(0) scale(1.14,.86);opacity:1}75%{transform:translateY(0) scale(.94,1.06)}100%{transform:translateY(0) scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes leaf{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes shine{from{opacity:0}to{opacity:.75}}
@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important;animation-delay:0s!important}}
button{height:44px;padding:0 20px;border-radius:12px;border:1px solid #857A66;background:transparent;color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
@media (max-width:640px){.lk{transform:scale(.6)}.stage{gap:0}}
</style>
</head>
<body>
<div class="stage">
 <div id="host"><div class="go" id="anim">
  <div class="lk"><div class="mk" aria-hidden="true"><div class="fr"></div><div class="hl"></div><div class="sm"></div><div class="lf"><svg viewBox="32 3 24 12" width="45" height="22" style="display:block"><path d="M32 12 C37 4 49 3 55 7 C50 14 39 16 32 12 Z" fill="var(--leaf)"/></svg></div></div>
  <div class="wd" role="img" aria-label="marula"><span>m</span><span>a</span><span>r</span><span>u</span><span>l</span><span>a</span></div></div>
 </div></div>
 <button type="button" id="replay">Replay</button>
</div>
<script>
(function(){var host=document.getElementById('host');var tpl=host.firstElementChild.cloneNode(true);
document.getElementById('replay').addEventListener('click',function(){host.replaceChildren(tpl.cloneNode(true));});})();
</script>
</body>
</html>

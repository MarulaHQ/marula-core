# Preprovisioned Grafana datasources for the Marula observability profile.
#
# Purpose: zero-click wiring so `--profile observability up` yields working
# trace/log/metric views: Tempo for traces (trace→logs link), Loki for
# logs (derived-fields deep-link back to Tempo by trace id), and a
# Prometheus datasource pointed at the collector's exposition port for
# marula.* metrics.
apiVersion: 1

datasources:
  - name: Tempo
    uid: marula-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: marula-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true

  - name: Loki
    uid: marula-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      derivedFields:
        # "trace_id=<hex>" in any log line links straight to Tempo.
        - name: TraceID
          matcherRegex: 'trace_id=(\w+)'
          datasourceUid: marula-tempo
          url: '$${__value.raw}'

  - name: MarulaMetrics
    uid: marula-metrics
    type: prometheus
    access: proxy
    url: http://otel-collector:18899
    isDefault: true
    jsonData:
      httpMethod: POST

# Grafana Tempo — local traces backend for Meridian (TASKLIST 2.18).
#
# Purpose: minimal single-binary config that accepts OTLP/HTTP on :4318
# and requires no object storage (local WAL only). Trace-to-metrics and
# service graphs are OFF — dashboards chart meridian.* metrics from the
# collector's Prometheus exporter instead.
#
# Non-purpose: not a production topology (no S3 backend, no quorum).
# Retention: trace blocks are compacted and deleted after 24h so the
# tempodata volume stays bounded (default block_retention is 14 days).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction_window: 1h
  block_retention: 24h

# Locally-run dev stack: accept everything.
overrides:
  defaults:
    max_search_bytes_per_trace: 100_000

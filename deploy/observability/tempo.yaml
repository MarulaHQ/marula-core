# Grafana Tempo — local traces backend for Marula (TASKLIST 2.18).
#
# Purpose: minimal single-binary config that accepts OTLP/HTTP on :4318
# and requires no object storage (local WAL only). Trace-to-metrics and
# service graphs are OFF — dashboards chart marula.* metrics from the
# collector's Prometheus exporter instead.
#
# Non-purpose: not a production topology (no S3 backend, no quorum).
# Retention: trace blocks are compacted and deleted after 24h so the
# tempodata volume stays bounded (default block_retention is 14 days).
#
# Image is PINNED (docker-compose.yml) — tempo has renamed config keys
# across minors (compactor → overrides, extension-key rejections on 3.x);
# a floating latest tag once broke this file at boot.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Retention note: tempo moved block_retention across majors (compactor →
# overrides v2); with no override the 14-day default applies — bounded for
# the dev volume, and the file stays bootable across pinned minor bumps.

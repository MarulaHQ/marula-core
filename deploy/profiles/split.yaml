# Generated by `marula deploy profiles --write` (Wave 49 lane R7).
# The machine-readable contract is `marula deploy describe --json`;
# see docs/deploy-descriptor.md. Do not edit by hand.
name: split
title: "Split services"
description: "The default topology. core-api and worker run as separate processes, so each scales and restarts on its own, dialling Postgres directly. Two processes fit inside the connection ceiling a stock Postgres allows, so the stack starts without a pooler. Turn the pooler on with the compose pooler profile when instances multiply. The floors come from the shipped embedding model, which needs four cores of its own, plus room for Postgres and the object store."
floors:
  cores: 4
  ram_mb: 8192
  disk_gb: 40
services:
  - name: core-api
    role: core-api
    ports: [8080]
    needs: [postgres, redis]
  - name: worker
    role: worker
    ports: [8082]
    needs: [postgres, redis]
sets:
  DATABASE_URL: "postgres://marula_app:${MARULA_APP_PASSWORD}@postgres:5432/marula"
  MARULA_DB_STATEMENT_CACHE: "0"
  MARULA_LISTEN_DATABASE_URL: "postgres://marula_app:${MARULA_APP_PASSWORD}@postgres:5432/marula"
  MARULA_REPORTING_POOL_MAX: "8"

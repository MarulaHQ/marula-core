# Generated by `marula deploy profiles --write` (Wave 49 lane R7).
# The machine-readable contract is `marula deploy describe --json`;
# see docs/deploy-descriptor.md. Do not edit by hand.
name: all-in-one
title: "All-in-one (demo / one-box)"
description: "One core-api process hosts the worker loops and serves the SSE live-push stream, so a small box runs a single application container. It runs unpooled on purpose. One instance's 54 connections fit inside the default 100 a stock Postgres allows, so the demo box does not need a second moving part. The floors are the shipped embedding model's four cores, plus the database and cache it shares the box with. The disk floor is one tier smaller than split's because there is no second image copy."
floors:
  cores: 4
  ram_mb: 8192
  disk_gb: 30
services:
  - name: core-api
    role: core-api
    ports: [8080, 8082]
    needs: [postgres, redis]
sets:
  DELIVERY_POLL_SECS: "300"
  DIGEST_POLL_SECS: "3600"
  EMAIL_POLL_SECS: "60"
  EVAL_INTERVAL_SECS: "300"
  MARULA_ALL_IN_ONE: "1"
  MARULA_ROBUSTNESS: "single_box"
  MARULA_WORKER_DATABASE_URL: "postgres://marula:marula@postgres:5432/marula"
  QUEUE_IDLE_MS: "60000"
  RETENTION_SWEEP_SECS: "86400"
  TIME_AUDIT_POLL_SECS: "300"
  USAGE_REFRESH_SECS: "900"

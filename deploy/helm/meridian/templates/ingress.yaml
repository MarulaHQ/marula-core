{{- if .Values.ingress.enabled -}}
{{- $apiPort := .Values.service.coreApi.port -}}
{{- $webPort := .Values.service.web.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "meridian.fullname" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "meridian.fullname" . }}-core-api
                port:
                  number: {{ $apiPort }}
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: {{ include "meridian.fullname" . }}-core-api
                port:
                  number: {{ $apiPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "meridian.fullname" . }}-web
                port:
                  number: {{ $webPort }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-worker
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "meridian.image" (dict "ctx" . "image" .Values.images.worker "key" "worker") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            # Owner role on purpose: the relay reads outbox rows across ALL
            # orgs and must not be constrained by RLS (compose parity).
            - name: DATABASE_URL
              value: {{ include "meridian.dbUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "meridian.redisUrl" . | quote }}
            - name: BIND_ADDR
              value: "0.0.0.0:8082"
            - name: RELAY_BATCH
              value: {{ .Values.worker.relayBatch | quote }}
            - name: CORE_API_URL
              value: http://{{ include "meridian.fullname" . }}-core-api:{{ .Values.service.coreApi.port }}
            - name: EMAIL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: EMAIL_INTERNAL_TOKEN
            - name: EMAIL_TRANSPORT
              value: {{ .Values.email.transport | quote }}
            - name: SMTP_HOST
              value: {{ .Values.email.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.email.smtpPort | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml (default .Values.worker.resources .Values.resources) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}

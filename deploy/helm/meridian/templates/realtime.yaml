apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-realtime
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime
spec:
  replicas: {{ .Values.realtime.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: realtime
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: realtime
          image: {{ include "meridian.image" (dict "ctx" . "image" .Values.images.realtime "key" "realtime") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: REDIS_URL
              value: {{ include "meridian.redisUrl" . | quote }}
            - name: BIND_ADDR
              value: "0.0.0.0:8081"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: JWT_SECRET
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- with .Values.realtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: ws
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.realtime.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-realtime
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime
spec:
  type: {{ .Values.service.realtime.type }}
  selector:
    app.kubernetes.io/name: {{ include "meridian.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: realtime
  ports:
    - name: ws
      port: {{ .Values.service.realtime.port }}
      targetPort: 8081

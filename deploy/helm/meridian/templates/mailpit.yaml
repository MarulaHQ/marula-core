{{- if .Values.mailpit.enabled -}}
{{/* Dev/demo SMTP sink (compose parity: the stage2 mailpit slot).
Evaluation-profile only — do not use for production mail. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-mailpit
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image | quote }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-mailpit
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  selector:
    app.kubernetes.io/name: {{ include "meridian.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
{{- end }}

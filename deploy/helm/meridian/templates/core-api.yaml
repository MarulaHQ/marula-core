apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-core-api
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  replicas: {{ .Values.coreApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: core-api
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: core-api
          image: {{ include "meridian.image" (dict "ctx" . "image" .Values.images.coreApi "key" "coreApi") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ include "meridian.dbAppUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "meridian.redisUrl" . | quote }}
            - name: BIND_ADDR
              value: {{ .Values.coreApi.bindAddr | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: JWT_SECRET
            - name: MERIDIAN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: MERIDIAN_SECRET_KEY
                  optional: true
            - name: EMAIL_INBOUND_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: EMAIL_INBOUND_HMAC_SECRET
                  optional: true
            - name: EMAIL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: EMAIL_INTERNAL_TOKEN
            - name: EMAIL_TRANSPORT
              value: {{ .Values.email.transport | quote }}
            - name: SMTP_HOST
              value: {{ .Values.email.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.email.smtpPort | quote }}
            - name: OBJECT_STORE
              value: {{ .Values.objectStore.mode | quote }}
            {{- if eq .Values.objectStore.mode "s3" }}
            - name: S3_ENDPOINT
              value: {{ required "objectStore.s3.endpoint required in s3 mode" .Values.objectStore.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.objectStore.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.objectStore.s3.region | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: S3_SECRET_ACCESS_KEY
            {{- else }}
            - name: OBJECT_STORE_LOCAL_DIR
              value: {{ .Values.objectStore.localDir | quote }}
            {{- end }}
            {{- if .Values.coreApi.corsOrigin }}
            - name: CORS_ORIGIN
              value: {{ .Values.coreApi.corsOrigin | quote }}
            {{- end }}
            {{- if .Values.coreApi.publicBaseUrl }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.coreApi.publicBaseUrl | quote }}
            {{- end }}
            - name: MERIDIAN_MAX_UPLOAD_MB
              value: {{ .Values.coreApi.maxUploadMb | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- with .Values.coreApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.coreApi.bindAddr | regexFind ":\\d+$" | trimPrefix ":" }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml (default .Values.coreApi.resources .Values.resources) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-core-api
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  type: {{ .Values.service.coreApi.type }}
  selector:
    app.kubernetes.io/name: {{ include "meridian.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: core-api
  ports:
    - name: http
      port: {{ .Values.service.coreApi.port }}
      targetPort: {{ .Values.coreApi.bindAddr | regexFind ":\\d+$" | trimPrefix ":" }}

{{- if .Values.postgresql.deploy -}}
{{- /* Postgres StatefulSet + headless Service run as EARLY pre-install
hooks (weight -5): the migrate hook needs the DNS name up before it can
apply the chain. Recreated on upgrade; data persists in the PVC. */}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-postgres
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "meridian.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "meridian.fullname" . }}-postgres
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  serviceName: {{ include "meridian.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      # Postgres exemption (see container comment below): the official
      # entrypoint must init as root, so no runAsUser/fsGroup here and
      # runAsNonRoot is intentionally NOT set for this pod.
      containers:
        - name: postgres
          image: {{ include "meridian.pinnedImage" (dict "ctx" . "image" .Values.postgresql.image "digest" .Values.postgresql.imageDigest) | quote }}
          # EXEMPTION: the official postgres entrypoint runs chown/init as
          # root before re-execing as postgres, so this container runs as
          # root deliberately (podSecurityContext's runAsNonRoot: true is
          # satisfied only when postgresql.runAsUserByComponent.postgres
          # is overridden to a nonzero uid together with an init'd volume).
          securityContext:
            {{- include "meridian.containerSecurityContext" (dict "readOnly" false) | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.ownerUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: POSTGRES_OWNER_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            # PG18 images use pg_ctlcluster-style major-version dirs under
            # the volume root — mount the VOLUME ROOT (see
            # docs/site/reference/pg18-upgrade.md).
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.ownerUser | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- if .Values.postgresql.storage.className }}
        storageClassName: {{ .Values.postgresql.storage.className | quote }}
        {{- end }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
---
{{/* The migration 0001 role bootstrap: create meridian_app (RLS role) if
the owner bootstrapped without it. Idempotent DO block. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian.fullname" . }}-pg-bootstrap
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ include "meridian.pinnedImage" (dict "ctx" . "image" .Values.postgresql.image "digest" .Values.postgresql.imageDigest) | quote }}
          securityContext:
            {{- /* psql bootstrap needs only network + /tmp; runs as root so
            it can talk to the not-yet-tuned postgres pod — capabilities
            still dropped, no privilege escalation. */ -}}
            {{- include "meridian.containerSecurityContext" (dict "readOnly" false) | nindent 12 }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: POSTGRES_OWNER_PASSWORD
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "meridian.fullname" .)) .Values.existingSecret }}
                  key: POSTGRES_APP_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h {{ include "meridian.fullname" . }}-postgres -U {{ .Values.postgresql.ownerUser }} -q; do sleep 2; done
              # psql :'var' interpolation does NOT expand inside a DO block
              # (dollar-quoted body) — interpolate via the shell instead.
              psql -h {{ include "meridian.fullname" . }}-postgres -U {{ .Values.postgresql.ownerUser }} -d {{ .Values.postgresql.database }} -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgresql.appUser }}') THEN CREATE ROLE {{ .Values.postgresql.appUser }} LOGIN; END IF; END \$\$;"
              psql -h {{ include "meridian.fullname" . }}-postgres -U {{ .Values.postgresql.ownerUser }} -d {{ .Values.postgresql.database }} -v ON_ERROR_STOP=1 -c "ALTER ROLE {{ .Values.postgresql.appUser }} WITH LOGIN PASSWORD '$APP_PASSWORD'"
{{- end }}

{{/* Migrations: Helm pre-install/pre-upgrade hook applying the chain from
the meridian-cli image (owner role — chain replay, not RLS traffic). */}}
{{- if .Values.migrations.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian.fullname" . }}-migrate
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "meridian.image" (dict "ctx" . "image" .Values.images.cli "key" "cli") }}
          env:
            - name: DATABASE_URL
              value: {{ include "meridian.dbUrl" . | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{/* Application secrets. Prefer existingSecret; else generate from values.
Empty inline values fall back to placeholders that MUST be overridden for
anything beyond an evaluation install. */}}
{{- if not .Values.existingSecret -}}
{{- /* Secrets are the EARLIEST pre-install hook (weight -6): the postgres
hook jobs reference these keys before any other resource exists. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meridian.fullname" . }}-secrets
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "insecure-default-change-me" | quote }}
  MARULA_SECRET_KEY: {{ .Values.secrets.appSecretKey | default "" | quote }}
  EMAIL_INBOUND_HMAC_SECRET: {{ .Values.secrets.emailInboundHmacSecret | default "" | quote }}
  EMAIL_INTERNAL_TOKEN: {{ .Values.secrets.emailInternalToken | default "insecure-internal-default" | quote }}
  # Optional EdDSA access-token signing pair (empty = HS256 posture).
  MARULA_JWT_EDDSA_PRIVATE_KEY: {{ .Values.secrets.jwtEddsaPrivateKey | default "" | quote }}
  MARULA_JWT_EDDSA_PUBLIC_KEY: {{ .Values.secrets.jwtEddsaPublicKey | default "" | quote }}
  MARULA_JWT_KID: {{ .Values.secrets.jwtKid | default "" | quote }}
{{- if eq .Values.objectStore.mode "s3" }}
  S3_ACCESS_KEY_ID: {{ required "objectStore.s3.accessKeyId required in s3 mode" .Values.objectStore.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "objectStore.s3.secretAccessKey required in s3 mode" .Values.objectStore.s3.secretAccessKey | quote }}
{{- if .Values.garage.enabled }}
  GARAGE_RPC_SECRET: {{ required "garage.rpcSecret required in s3 mode (openssl rand -hex 32)" .Values.garage.rpcSecret | quote }}
  GARAGE_ADMIN_TOKEN: {{ required "garage.adminToken required in s3 mode" .Values.garage.adminToken | quote }}
{{- end }}
{{- end }}
{{- if and .Values.postgresql.deploy }}
  POSTGRES_OWNER_PASSWORD: {{ .Values.postgresql.ownerPassword | default "changeme-owner" | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.postgresql.appPassword | default "changeme-app" | quote }}
{{- end }}
{{- end }}

# Default values for the meridian chart.
#
# Image policy (release engineering, TASKLIST U10b): every image reference is
# digest-pinned in production — set `tag` for readability AND `digest` for
# the immutable reference. Digests are published per release with their SBOM
# + provenance attestations (see .github/workflows/release.yml).

# Global release-engineering toggle: when true (default) every image
# reference requires `digest` to be set; the chart renders an invalid
# resource otherwise. Opt out ONLY for local development.
digestPinningEnforced: true

nameOverride: ""
fullnameOverride: ""

# Existing secret providing JWT_SECRET / MERIDIAN_SECRET_KEY / EMAIL_* keys.
# When empty, a Secret is generated from the inline values below.
existingSecret: ""

secrets:
  jwtSecret: ""
  # Envelope encryption key for byok_secrets / webhook secrets (hex).
  appSecretKey: ""
  emailInboundHmacSecret: ""
  emailInternalToken: ""
  # EdDSA (Ed25519) access-token signing (optional, Wave 34 lane 6): PEM
  # contents. Set BOTH to switch core-api to EdDSA signing; realtime then
  # verifies with the public key. Leave empty for the HS256 posture.
  jwtEddsaPrivateKey: ""
  jwtEddsaPublicKey: ""
  # Key id stamped on issued tokens (defaults to m1 when empty).
  jwtKid: ""

imagePullSecrets: []

images:
  registry: ghcr.io/meridian-open
  pullPolicy: IfNotPresent
  coreApi:
    repository: meridian-core-api
    tag: "v0.2.0"
    digest: ""
  realtime:
    repository: meridian-realtime
    tag: "v0.2.0"
    digest: ""
  worker:
    repository: meridian-worker
    tag: "v0.2.0"
    digest: ""
  cli:
    repository: meridian-cli
    tag: "v0.2.0"
    digest: ""
  web:
    repository: meridian-web
    tag: "v0.2.0"
    digest: ""

# ---------------------------------------------------------------- database --
# Either deploy in-chart Postgres (pgvector image, prod parity) or point at
# an external instance. The in-chart deployment is sized for evaluation;
# production installs should bring their own Postgres.
postgresql:
  deploy: true
  image: pgvector/pgvector:pg18
  database: meridian
  ownerUser: meridian
  ownerPassword: ""
  appUser: meridian_app
  appPassword: ""
  storage:
    className: ""
    size: 20Gi

# ------------------------------------------------------------------ redis --
redis:
  deploy: true
  image: redis:7-alpine
  # When deploy: false, set externalUrl (redis://host:6379/0).
  externalUrl: ""

# ------------------------------------------------------------------ core --
coreApi:
  replicaCount: 1
  bindAddr: 0.0.0.0:8080
  corsOrigin: ""
  publicBaseUrl: ""
  maxUploadMb: 25
  resources: {}
  extraEnv: []

realtime:
  replicaCount: 1
  resources: {}
  extraEnv: []

worker:
  replicaCount: 1
  relayBatch: 200
  resources: {}
  extraEnv: []

web:
  enabled: true
  replicaCount: 1
  # Baked into the browser bundle at build time — must be the URL the
  # USER'S BROWSER uses to reach the API.
  nextPublicApiUrl: ""
  resources: {}
  extraEnv: []

# Email: `smtp` with the bundled Mailpit profile for evaluation, `none` or
# your own SMTP settings for production.
email:
  transport: smtp
  smtpHost: ""
  smtpPort: "1025"

mailpit:
  # Dev/demo mail sink: in-chart Mailpit + SMTP port + web UI.
  enabled: false
  image: axllent/mailpit:latest

# Object storage: local-fs (single replica, PVC) or S3/Garage.
objectStore:
  mode: local
  localDir: /data/objects
  s3:
    endpoint: ""
    bucket: meridian
    # empty = follow the in-chart Garage region (garage.s3Region)
    region: ""
    accessKeyId: ""
    secretAccessKey: ""

# ---------------------------------------------------------------- garage --
# Garage (S3-compatible object storage; 2026-09 MinIO replacement). Deployed
# only in objectStore.mode=s3 with garage.enabled — a single-node StatefulSet
# fronted by a headless RPC service, bootstrapped by a layout Job (assign +
# apply + bucket create + key grant). The S3 access key itself is
# operator-provisioned (garage key create) — values carry its ID.
# capacity is bytes (e.g. 200_000_000_000 for a 200GB ceiling).
garage:
  enabled: false
  # createS3Key: the bootstrap Job creates the "meridian" access key and
  # prints its secret to the job logs (shown once) — copy it into
  # objectStore.s3.secretAccessKey. Keep false when you pre-provision keys.
  image: dxflrs/garage:v1.1.0
  rpcSecret: ""
  adminToken: "change-me-garage-admin-token"
  zone: dc1
  capacity: "200000000000"
  s3Region: garage
  storage:
    size: 200Gi
    metaSize: 2Gi

# OpenTelemetry: empty endpoint = none mode.
otel:
  exporterOtlpEndpoint: ""

migrations:
  # Run migrations as a Helm pre-upgrade hook from the CLI image.
  enabled: true

service:
  coreApi:
    type: ClusterIP
    port: 8080
  realtime:
    type: ClusterIP
    port: 8081
  web:
    type: ClusterIP
    port: 3000

ingress:
  enabled: false
  className: ""
  host: ""
  tls: false
  annotations: {}

podSecurityContext:
  runAsNonRoot: true

# Global default resource envelope applied to every workload that doesn't
# set its own `resources` (per-service values win). Keeps a runaway
# component from starving the node; override per service for sizing.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

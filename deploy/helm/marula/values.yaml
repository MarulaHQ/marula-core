# Default values for the marula chart.
#
# Image policy (release engineering, the private build tracker U10b): every image reference is
# digest-pinned in production — set `tag` for readability AND `digest` for
# the immutable reference. Digests are published per release with their SBOM
# + provenance attestations (see .github/workflows/release.yml).

# Global release-engineering toggle: when true (default) every image
# reference requires `digest` to be set; the chart renders an invalid
# resource otherwise. Opt out ONLY for local development.
digestPinningEnforced: true

# Global guard for NON-marula images too (p38): when true, every bare
# string image value (postgresql.image, redis.image, mailpit.image,
# garage.image, garage.bootstrapImage) must carry an @sha256:... digest.
# The companion *Digest values below provide the enforced digests; the
# `tag@digest` form still keeps the readable tag.
nonMarulaDigestPinningEnforced: true

nameOverride: ""
fullnameOverride: ""

# Existing secret providing JWT_SECRET / MARULA_SECRET_KEY / EMAIL_* keys,
# plus POSTGRES_OWNER_PASSWORD and POSTGRES_APP_PASSWORD when
# `postgresql.deploy` is true (the connection URLs read those two keys at
# runtime). When empty, a Secret is generated from the inline values below.
existingSecret: ""

secrets:
  jwtSecret: ""
  # Envelope encryption key for byok_secrets / webhook secrets (hex).
  appSecretKey: ""
  emailInboundHmacSecret: ""
  emailInternalToken: ""
  internalToken: ""
  # EdDSA (Ed25519) access-token signing (optional, Wave 34 lane 6): PEM
  # contents. Set BOTH to switch core-api to EdDSA signing. Leave empty for
  # the HS256 posture.
  jwtEddsaPrivateKey: ""
  jwtEddsaPublicKey: ""
  # Key id stamped on issued tokens (defaults to m1 when empty).
  jwtKid: ""

imagePullSecrets: []

images:
  registry: ghcr.io/marulahq
  pullPolicy: IfNotPresent
  coreApi:
    repository: marula-core-api
    tag: "v0.3.0"
    digest: ""
  worker:
    repository: marula-worker
    tag: "v0.3.0"
    digest: ""
  cli:
    repository: marula-core-cli
    tag: "v0.3.0"
    digest: ""
  web:
    repository: marula-web
    tag: "v0.3.0"
    digest: ""

# ---------------------------------------------------------------- database --
# Either deploy in-chart Postgres (pgvector image, prod parity) or point at
# an external instance. The in-chart deployment is sized for evaluation;
# production installs should bring their own Postgres.
# Image values carry `tag` AND `digest` (same policy as the marula images:
# the digest enforces, the tag is readable). Third-party slots use Docker
# Hardened Images where the DHI catalog covers them (pgvector, valkey,
# grafana stack, curl; garage/mailpit/glitchtip/otel have no DHI).
# The postgresql slot keeps a chown-based root-init entrypoint — its
# podSecurityContext sets runAsUser 0 so the init works; it departs from
# the pod-level runAsNonRoot gate deliberately (exemption documented in
# templates/postgres.yaml).
postgresql:
  deploy: true
  image: dhi.io/pgvector:0.8-pg18
  imageDigest: "sha256:069119d1ad25e1155e165786230ef3b4a570f1857b315166924b895c4d2c6946"
  database: marula
  ownerUser: marula
  # These two passwords feed ONLY the chart-generated Secret. The connection
  # URLs reference the Secret's keys at runtime ($(POSTGRES_OWNER_PASSWORD) /
  # $(POSTGRES_APP_PASSWORD), expanded by the kubelet), so with
  # `existingSecret` set the profiles below carry no credential at all.
  # Keep them URL-safe (no @ : / ? #) — the app parses DATABASE_URL as a URL.
  ownerPassword: ""
  appUser: marula_app
  appPassword: ""
  storage:
    className: ""
    size: 20Gi

# ------------------------------------------------------------------ pooler --
# Optional PgBouncer (or any transaction pooler) in front of the database
# (Wave 52 lane P9). Off by default: the chart does not deploy one, for the
# same reason it does not deploy production Postgres — the operator brings the
# instance that has to survive a failover. The pooler must run
# `deploy/pooler/pgbouncer.ini`'s settings; `docs/reference/connection-pooling.md`
# says why each one is load-bearing.
#
# With it on, `DATABASE_URL` becomes the pooled URL, `MARULA_LISTEN_DATABASE_URL`
# becomes the direct one (a LISTEN cannot ride a transaction-pooled connection),
# and `MARULA_DB_STATEMENT_CACHE` is forced to 0 (a cached statement name cannot
# survive the pooler's reset between transactions).
pooler:
  enabled: false
  # App role through the pooler, e.g. postgres://marula_app:PASS@pgbouncer:6432/marula
  appUrl: ""
  # Owner role through the pooler (the worker's loops), same shape.
  ownerUrl: ""
  # Direct Postgres for the API's ONE LISTEN connection.
  directAppUrl: ""
  # Direct Postgres for the worker's ONE LISTEN connection.
  directOwnerUrl: ""

# ------------------------------------------------------------------ redis --
redis:
  deploy: true
  image: dhi.io/valkey:8.1.10
  imageDigest: "sha256:3caa5e36670b3eb234fd3d958452431c802c6a8de22a8abf747ec72b532582f2"
  # When deploy: false, set externalUrl (redis://host:6379/0).
  externalUrl: ""

# ------------------------------------------------------------------ core --
coreApi:
  replicaCount: 1
  bindAddr: 0.0.0.0:8080
  corsOrigin: ""
  publicBaseUrl: ""
  maxUploadMb: 25
  # Who may speak for someone else. Unset ⇒ the narrow default (loopback +
  # RFC1918 + IPv6 ULA) the resolver falls back to — see
  # docs/site/reference/reverse-proxy-tls.md §"Telling the API which proxy
  # to believe". Behind an internet-reachable edge, list BOTH the edge's
  # published ranges AND the ingress controller's, because the real-client
  # walk skips every trusted hop and the controller is one.
  trustedProxies: ""
  # Pool ceilings (Wave 49 lane R1, resized by Wave 52 lane P9): pass
  # MARULA_DB_POOL_MAX / MARULA_REPORTING_POOL_MAX through extraEnv to move
  # past the defaults (20 / 8). See docs/perf.md §5. Each replica opens 29
  # client connections (20 app + 8 reporting + 1 LISTEN); set `pooler.enabled`
  # and the database sees the pooler's 15-per-role server side instead.
  #
  # Real per-service envelope (Wave 49 lane R2), replacing the chart-wide
  # 50m/64Mi/512Mi default. Anchored to the compose stack's per-service
  # cpus/mem_limit — the one measured per-service ceiling this repo carries —
  # and to the perf anchor (259 rps @ c8, p95 49.2ms with ~3x headroom,
  # docs/perf.md §5). core-api carries the hot read path, so it takes the
  # largest CPU limit. Lane R5 (the journey harness) replaces these with
  # measured numbers.
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 512Mi
  # Horizontal Pod Autoscaler (Wave 49 lane R2). Off by default: one replica
  # is right for an evaluation install, and every added core-api replica
  # multiplies that process's Postgres connections (29 client connections each
  # at the P9 defaults, docs/perf.md §5). With `pooler.enabled` those stop at
  # the pooler instead of reaching Postgres. When enabled the Deployment omits
  # .spec.replicas and the HPA owns the count.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  # Lifecycle (lane R5). The window the process gives in-flight requests after
  # SIGTERM; the chart passes it through as MARULA_SHUTDOWN_GRACE_SECS so the
  # value an operator reads here is the value the binary obeys.
  shutdownGraceSeconds: 20
  # Must exceed preStopSleepSeconds + shutdownGraceSeconds, or the runtime
  # kills the process mid-drain and the window is decorative.
  terminationGracePeriodSeconds: 45
  # Runs BEFORE the process gets SIGTERM: the Service stops routing new
  # connections while requests already pointed at this pod still finish.
  preStopSleepSeconds: 5
  # Which question each probe asks (lane R5):
  #   startup   — /livez, generous: boot runs migrations and opens two pools
  #   liveness  — /livez, process-level only: a drain must not fail it
  #   readiness — /readyz, database answered inside 2s and not draining
  probes:
    startup:
      path: /livez
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      path: /livez
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  extraEnv: []

worker:
  replicaCount: 1
  bindAddr: 0.0.0.0:8082
  relayBatch: 200
  # Pool ceilings (Wave 49 lane R1): pass MARULA_DB_POOL_MAX /
  # DELIVERY_POOL_MAX through extraEnv to move the worker's pools past the
  # defaults (20 / 5). See docs/perf.md §5.
  #
  # Real per-service envelope (Wave 49 lane R2); compose cpus 1.0 / mem 512m.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # HPA (Wave 49 lane R2). Safe to scale: the outbox relay and the job queue
  # both claim with FOR UPDATE SKIP LOCKED (core-db/src/outbox.rs:47,
  # core-db/src/queue.rs:105), so replicas never double-process a row.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  # Lifecycle (lane R5). The worker owns no traffic, so its drain waits for the
  # loops this process runs rather than for requests.
  shutdownGraceSeconds: 20
  terminationGracePeriodSeconds: 35
  preStopSleepSeconds: 5
  # The worker's three probes answer three different questions: liveness reads
  # /healthz, which is 503 when an owned loop has died (a worker serving no
  # traffic has no other restart signal), readiness reads /readyz, and startup
  # reads /livez so a slow database does not trip liveness.
  probes:
    startup:
      path: /livez
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      path: /healthz
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  extraEnv: []

web:
  enabled: true
  replicaCount: 1
  # Baked into the browser bundle at build time — must be the URL the
  # USER'S BROWSER uses to reach the API. Same-origin behind an ingress it
  # is https://<ingress.host>; the app appends /api itself.
  nextPublicApiUrl: ""
  # Real per-service envelope (Wave 49 lane R2); compose cpus 1.0 / mem 512m.
  # Next.js SSR/static — small CPU request, memory for the Node runtime.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # HPA (Wave 49 lane R2). web is stateless, safe to scale.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # Next's own server: a stop closes it; give it the same shape as the API so
  # all three workloads answer a rolling deploy the same way.
  shutdownGraceSeconds: 20
  terminationGracePeriodSeconds: 35
  preStopSleepSeconds: 5
  probes:
    startup:
      path: /
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      path: /
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  extraEnv: []

# Email: `smtp` with the bundled Mailpit profile for evaluation, `none` or
# your own SMTP settings for production.
email:
  transport: smtp
  smtpHost: ""
  smtpPort: "1025"

mailpit:
  # Dev/demo mail sink: in-chart Mailpit + SMTP port + web UI.
  enabled: false
  image: axllent/mailpit:v1.31.3
  imageDigest: "sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d"

# Object storage: local-fs (single replica, PVC) or S3/Garage.
objectStore:
  mode: local
  localDir: /data/objects
  s3:
    endpoint: ""
    bucket: marula
    # empty = follow the in-chart Garage region (garage.s3Region)
    region: ""
    accessKeyId: ""
    secretAccessKey: ""

# ---------------------------------------------------------------- garage --
# Garage (S3-compatible object storage; 2026-09 MinIO replacement). Deployed
# only in objectStore.mode=s3 with garage.enabled — a single-node StatefulSet
# fronted by a headless RPC service, bootstrapped by a layout Job (assign +
# apply + bucket create + key grant). The S3 access key itself is
# operator-provisioned (garage key create) — values carry its ID.
# capacity is bytes (e.g. 200_000_000_000 for a 200GB ceiling).
garage:
  enabled: false
  # createS3Key: the bootstrap Job creates the "marula" access key and
  # prints its secret to the job logs (shown once) — copy it into
  # objectStore.s3.secretAccessKey. Keep false when you pre-provision keys.
  image: dxflrs/garage:v1.1.0
  imageDigest: "sha256:fdb8272fcbe643eef830ee17874d5d4ed623a86501f1acbac8012583113b1c26"
  # Garage itself has no DHI (checked 2026-09-29); the bootstrap curl
  # sidecar does: dhi.io/curl alpine variant (0 CVEs at publish time).
  bootstrapImage: dhi.io/curl:8-alpine
  bootstrapImageDigest: "sha256:d51aebca70c0c0cb9071c909e7ffeb13892634e2cdf43f281589310537e0241a"
  rpcSecret: ""
  adminToken: "change-me-garage-admin-token"
  zone: dc1
  capacity: "200000000000"
  s3Region: garage
  storage:
    size: 200Gi
    metaSize: 2Gi

# OpenTelemetry: empty endpoint = none mode.
otel:
  exporterOtlpEndpoint: ""

migrations:
  # Run migrations as a Helm pre-upgrade hook from the CLI image.
  enabled: true

service:
  coreApi:
    type: ClusterIP
    port: 8080
  web:
    type: ClusterIP
    port: 3000

ingress:
  enabled: false
  className: ""
  host: ""
  # TLS mode, matching the compose lane's three modes:
  #   direct  — the controller (or cert-manager in front of it) obtains and
  #             renews the certificate itself. Add a cert-manager
  #             cluster-issuer through ingress.annotations and let the
  #             ingress's own issuer handle HTTP-01.
  #   edge    — TLS is terminated further out: the operator supplies the
  #             certificate in tlsSecretName (Cloudflare Origin CA with
  #             SSL/TLS Full (strict), or a cert-manager DNS-01 certificate
  #             for Cloudflare). The controller passes the TLS handshake
  #             through without validating against a public CA.
  # The full decision, and the Cloudflare dashboard steps behind the edge
  # mode, are in docs/site/reference/reverse-proxy-tls.md.
  tlsMode: direct
  # Secret holding the TLS key/cert pair. Required in edge mode; in direct
  # mode it is the name the controller's certificate lands in.
  tlsSecretName: marula-tls
  # Proxy tuning for Marula's seams. The defaults below are what the
  # ingress-nginx annotations for body size, streaming and timeouts are set
  # to; they are exposed here so an operator on a different controller has
  # one place to look rather than a wall of annotations to reverse-engineer.
  proxy:
    # Aligned with coreApi.maxUploadMb — the same number core-api enforces
    # per route. A body over either is refused by the ingress.
    bodySizeMb: 25
    # Long-lived stream path. nginx's 60s default read timeout kills an idle
    # SSE response, and core-api only writes its `ping` comment every 15s, so
    # a timeout at or below that interval is a reconnect storm waiting for a
    # quiet minute.
    readTimeoutSeconds: 3600
    sendTimeoutSeconds: 3600
    # Buffering off: a response frame held in a proxy buffer is a frame the
    # board never rendered.
    buffering: "off"
  # Extra controller annotations, merged OVER the tuned defaults above.
  # Annotations set here win.
  annotations: {}

# ------------------------------------------------- disruption / network --
# PodDisruptionBudgets (lane R5). `maxUnavailable: 1`, never `minAvailable`,
# and that is the single-box decision: `minAvailable: 1` on a one-replica
# install blocks every node drain forever — the pod can be ready or evicted,
# not both. `maxUnavailable` lets a one-replica install be evicted (the brief
# interruption a single replica already accepts on a restart) and keeps a
# multi-replica install serving.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Soft topology spread over nodes. `ScheduleAnyway`, not `DoNotSchedule`: a
# single-node cluster must still schedule, and this is about not stacking every
# replica on one node when there is a choice.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# NetworkPolicy is OPT-IN and ingress-only (lane R5). Turning it on makes this
# chart the sole authority for who may reach the app pods, so a scraper, a
# service mesh sidecar or a debug pod in another namespace stops working until
# it is listed in `extraIngress`. Opt-in rather than default-on because that
# failure is silent from the pod's side: requests simply never arrive.
# Egress is left alone on purpose — the apps need DNS, the object store and
# whatever mail relay the operator configured, and a wrong egress rule there
# reads as an app hang, not a policy.
networkPolicy:
  enabled: false
  # Namespace the ingress controller runs in; allowed to reach core-api and web
  # when ingress.enabled.
  ingressControllerNamespace: ingress-nginx
  # Extra ingress rules, merged after the chart's own (same shape as a
  # NetworkPolicy `ingress:` list item).
  extraIngress: []

podSecurityContext:
  runAsNonRoot: true
# Per-deployable uid/gid matching the images (p38-container-hardening):
# marula rust images run as the DHI debian-base `nonroot` user (65532),
# web as 1000, postgres image inits as root (chown-based init — runAsUser 0
# is a documented exemption there), garage distroless as 10004 via
# runAsUser, valkey as the DHI nonroot 65532.
runAsUserByComponent:
  coreApi: 65532
  worker: 65532
  cli: 65532
  web: 1000
  # DHI postgres keeps its chown-based root init (see postgres.yaml).
  postgres: 0
  redis: 65532
  garage: 10004
  mailpit: 1000
  bootstrap: 65532
fsGroup: 65532

# Container-level least privilege applied to every workload in the chart:
# no privilege escalation, all capabilities dropped, seccomp
# RuntimeDefault. ReadOnlyRootFilesystem is set where the component
# tolerates it (exemptions noted in the templates).
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Fallback resource envelope for workloads that do not set their own
# `resources` — the bundled data plane (postgres, redis, garage). The three
# app components (core-api, worker, web) each carry a real
# per-service envelope in their own block (Wave 49 lane R2); the data plane
# keeps this conservative default.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marula.fullname" . }}-realtime
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime
spec:
  replicas: {{ .Values.realtime.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "marula.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "marula.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: realtime
    spec:
      securityContext:
        {{- $ctx := deepCopy .Values.podSecurityContext -}}
        {{- $_ := set $ctx "runAsUser" (index .Values.runAsUserByComponent "realtime" | default 65532) -}}
        {{- $_ := set $ctx "fsGroup" .Values.fsGroup | default 65532 -}}
        {{- toYaml $ctx | nindent 8 }}
      containers:
        - name: realtime
          image: {{ include "marula.image" (dict "ctx" . "image" .Values.images.realtime "key" "realtime") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "marula.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          env:
            - name: REDIS_URL
              value: {{ include "marula.redisUrl" . | quote }}
            - name: BIND_ADDR
              value: "0.0.0.0:8081"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: JWT_SECRET
            # Optional EdDSA verification key (Wave 34 lane 6): present
            # when core-api signs with the asymmetric pair; absent keeps
            # the HS256 posture. Verification prefers EdDSA either way.
            - name: MARULA_JWT_EDDSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: MARULA_JWT_EDDSA_PUBLIC_KEY
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- with .Values.realtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: ws
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml (default .Values.realtime.resources .Values.resources) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marula.fullname" . }}-realtime
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime
spec:
  type: {{ .Values.service.realtime.type }}
  selector:
    app.kubernetes.io/name: {{ include "marula.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: realtime
  ports:
    - name: ws
      port: {{ .Values.service.realtime.port }}
      targetPort: 8081

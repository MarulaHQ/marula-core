{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marula.fullname" . }}-web
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "marula.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "marula.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        {{- $ctx := deepCopy .Values.podSecurityContext -}}
        {{- $_ := set $ctx "runAsUser" (index .Values.runAsUserByComponent "web" | default 1000) -}}
        {{- $_ := set $ctx "fsGroup" .Values.fsGroup | default 65532 -}}
        {{- toYaml $ctx | nindent 8 }}
      containers:
        - name: web
          image: {{ include "marula.image" (dict "ctx" . "image" .Values.images.web "key" "web") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "marula.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          env:
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          {{- with .Values.web.probes.startup }}
          startupProbe:
            {{- include "marula.probe" (dict "spec" . "port" 3000) | nindent 12 }}
          {{- end }}
          {{- with .Values.web.probes.liveness }}
          livenessProbe:
            {{- include "marula.probe" (dict "spec" . "port" 3000) | nindent 12 }}
          {{- end }}
          {{- with .Values.web.probes.readiness }}
          readinessProbe:
            {{- include "marula.probe" (dict "spec" . "port" 3000) | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.web.preStopSleepSeconds | quote }}]
          resources: {{- toYaml (default .Values.resources .Values.web.resources) | nindent 12 }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "marula.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: web
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marula.fullname" . }}-web
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.web.type }}
  selector:
    app.kubernetes.io/name: {{ include "marula.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: 3000
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marula.fullname" . }}-core-api
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  {{- if not .Values.coreApi.autoscaling.enabled }}
  replicas: {{ .Values.coreApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "marula.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "marula.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: core-api
    spec:
      securityContext:
        {{- $ctx := deepCopy .Values.podSecurityContext -}}
        {{- $_ := set $ctx "runAsUser" (index .Values.runAsUserByComponent "coreApi" | default 65532) -}}
        {{- $_ := set $ctx "fsGroup" .Values.fsGroup | default 65532 -}}
        {{- toYaml $ctx | nindent 8 }}
      containers:
        - name: core-api
          image: {{ include "marula.image" (dict "ctx" . "image" .Values.images.coreApi "key" "coreApi") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "marula.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          env:
            - name: DATABASE_URL
              value: {{ include "marula.dbAppUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "marula.redisUrl" . | quote }}
            - name: BIND_ADDR
              value: {{ .Values.coreApi.bindAddr | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: JWT_SECRET
            - name: MARULA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: MARULA_SECRET_KEY
                  optional: true
            # Optional EdDSA signing pair (Wave 34 lane 6): both keys must
            # be present together; empty keys leave the HS256 posture.
            - name: MARULA_JWT_EDDSA_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: MARULA_JWT_EDDSA_PRIVATE_KEY
                  optional: true
            - name: MARULA_JWT_EDDSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: MARULA_JWT_EDDSA_PUBLIC_KEY
                  optional: true
            - name: MARULA_JWT_KID
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: MARULA_JWT_KID
                  optional: true
            - name: EMAIL_INBOUND_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: EMAIL_INBOUND_HMAC_SECRET
                  optional: true
            - name: EMAIL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: EMAIL_INTERNAL_TOKEN
            - name: EMAIL_TRANSPORT
              value: {{ .Values.email.transport | quote }}
            - name: SMTP_HOST
              value: {{ .Values.email.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.email.smtpPort | quote }}
            - name: OBJECT_STORE
              value: {{ .Values.objectStore.mode | quote }}
            {{- if eq .Values.objectStore.mode "s3" }}
            {{- /* endpoint/region default to the in-chart Garage slot when
            unset (an operator-supplied external S3/R2 endpoint wins). */}}
            - name: S3_ENDPOINT
              value: {{ .Values.objectStore.s3.endpoint | default (printf "http://%s-garage:3900" (include "marula.fullname" .)) | quote }}
            - name: S3_BUCKET
              value: {{ .Values.objectStore.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.objectStore.s3.region | default .Values.garage.s3Region | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: S3_SECRET_ACCESS_KEY
            {{- else }}
            - name: OBJECT_STORE_LOCAL_DIR
              value: {{ .Values.objectStore.localDir | quote }}
            {{- end }}
            {{- if .Values.coreApi.corsOrigin }}
            - name: CORS_ORIGIN
              value: {{ .Values.coreApi.corsOrigin | quote }}
            {{- end }}
            {{- if .Values.coreApi.publicBaseUrl }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.coreApi.publicBaseUrl | quote }}
            {{- end }}
            {{- /*
            Real-client-IP posture (Wave 47 lane A10). Set when the ingress
            — or an edge in front of it — speaks for the client; unset
            leaves the narrow default (loopback + RFC1918 + IPv6 ULA), which
            on an internet-reachable deployment collapses every real client
            onto the edge address and logs a warning at boot naming this.
            */}}
            {{- if .Values.coreApi.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.coreApi.trustedProxies | quote }}
            {{- end }}
            - name: MARULA_MAX_UPLOAD_MB
              value: {{ .Values.coreApi.maxUploadMb | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- with .Values.coreApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.coreApi.bindAddr | regexFind ":\\d+$" | trimPrefix ":" }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml (default .Values.resources .Values.coreApi.resources) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marula.fullname" . }}-core-api
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  type: {{ .Values.service.coreApi.type }}
  selector:
    app.kubernetes.io/name: {{ include "marula.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: core-api
  ports:
    - name: http
      port: {{ .Values.service.coreApi.port }}
      targetPort: {{ .Values.coreApi.bindAddr | regexFind ":\\d+$" | trimPrefix ":" }}

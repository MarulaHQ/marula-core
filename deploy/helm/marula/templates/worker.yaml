apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marula.fullname" . }}-worker
  labels:
    {{- include "marula.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "marula.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "marula.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        {{- $ctx := deepCopy .Values.podSecurityContext -}}
        {{- $_ := set $ctx "runAsUser" (index .Values.runAsUserByComponent "worker" | default 65532) -}}
        {{- $_ := set $ctx "fsGroup" .Values.fsGroup | default 65532 -}}
        {{- toYaml $ctx | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "marula.image" (dict "ctx" . "image" .Values.images.worker "key" "worker") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "marula.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          env:
            # Owner role on purpose: the relay reads outbox rows across ALL
            # orgs and must not be constrained by RLS (compose parity).
            - name: DATABASE_URL
              value: {{ include "marula.dbUrl" . | quote }}
            {{- if .Values.pooler.enabled }}
            # Lane P9: the relay's wakeup subscription and the statement cache
            # take the same answer core-api does — direct LISTEN, no cache.
            - name: MARULA_LISTEN_DATABASE_URL
              value: {{ include "marula.directOwnerUrl" . | quote }}
            - name: MARULA_DB_STATEMENT_CACHE
              value: "0"
            {{- end }}
            - name: REDIS_URL
              value: {{ include "marula.redisUrl" . | quote }}
            - name: BIND_ADDR
              value: {{ .Values.worker.bindAddr | quote }}
            - name: RELAY_BATCH
              value: {{ .Values.worker.relayBatch | quote }}
            # Bounded drain window (lane R5): the loops get this long to finish
            # what they are holding; the line it logs names what it cut.
            - name: MARULA_SHUTDOWN_GRACE_SECS
              value: {{ .Values.worker.shutdownGraceSeconds | quote }}
            - name: CORE_API_URL
              value: http://{{ include "marula.fullname" . }}-core-api:{{ .Values.service.coreApi.port }}
            - name: EMAIL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "marula.fullname" .)) .Values.existingSecret }}
                  key: EMAIL_INTERNAL_TOKEN
            - name: EMAIL_TRANSPORT
              value: {{ .Values.email.transport | quote }}
            - name: SMTP_HOST
              value: {{ .Values.email.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.email.smtpPort | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ include "marula.portFromBind" .Values.worker.bindAddr }}
          # Liveness on /healthz (a dead loop must restart this process — it
          # owns no traffic, so readiness alone would leave it running dead),
          # readiness on /readyz (drain-aware), startup on /livez.
          {{- with .Values.worker.probes.startup }}
          startupProbe:
            {{- include "marula.probe" (dict "spec" . "port" (include "marula.portFromBind" $.Values.worker.bindAddr)) | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.probes.liveness }}
          livenessProbe:
            {{- include "marula.probe" (dict "spec" . "port" (include "marula.portFromBind" $.Values.worker.bindAddr)) | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.probes.readiness }}
          readinessProbe:
            {{- include "marula.probe" (dict "spec" . "port" (include "marula.portFromBind" $.Values.worker.bindAddr)) | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.worker.preStopSleepSeconds | quote }}]
          resources: {{- toYaml (default .Values.resources .Values.worker.resources) | nindent 12 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "marula.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: worker
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}

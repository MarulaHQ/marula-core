; Marula's shipped PgBouncer config (Wave 52 lane P9).
;
; Purpose: put a fixed, small number of Postgres server connections in front
; of a fleet of application pools. One instance opens 54 client connections at
; the default ceilings, and a second instance took the fleet past Postgres's
; default `max_connections = 100` (docs/capacity-model.md). PgBouncer holds the
; server side at `default_pool_size` per (database, user) pair however many
; instances are added.
;
; Non-purpose: no statement caching, no session state, no subscription. Those
; are session-pooling features, and this stack runs transaction pooling for a
; measured reason — a session pooler with long-lived client pools reduces
; nothing, because every client connection would still hold a server
; connection for its whole life.
;
; Every value here is load-bearing. docs/reference/connection-pooling.md gives
; the measurement behind each one; the short version:
;
;   pool_mode = transaction          The only mode that multiplexes long-lived
;                                    client pools.
;   server_reset_query = DISCARD ALL  Runs after EVERY transaction
;   server_reset_query_always = 1     because that is the only point where
;                                    Postgres allows it. Without it a leaked
;                                    session GUC was measured handing tenant A's
;                                    rows to tenant B (REVIEW.md, probe 2).
;   max_prepared_statements = 0      With the reset query on, a named statement
;                                    cannot outlive its transaction, so sqlx
;                                    must not cache names either: this is the
;                                    matching server-side answer to
;                                    MARULA_DB_STATEMENT_CACHE=0.
;   max_db_connections = 40          The hard ceiling on what this pooler gives
;                                    Postgres, whatever the instance count.

[databases]
; The app and the worker use different roles (marula_app under RLS, marula as
; owner), so PgBouncer keeps one server pool per (database, user) pair and each
; gets its own `default_pool_size`.
marula = host=postgres port=5432 dbname=marula

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM, not trust: the pooler sits between the app and the database, and an
; unauthenticated hop there would be a wider hole than the one it closes. The
; password file is generated from the same two secrets the containers use
; (see deploy/pooler/README.md).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
server_reset_query = DISCARD ALL
server_reset_query_always = 1
max_prepared_statements = 0

; Server side. `default_pool_size` is per (database, user) pair, so the app
; role and the owner role get one pool each: 15 + 15 = 30 server connections.
; The hot path saturates at concurrency 8 (docs/perf.md §5), so 15 leaves the
; measured knee room to breathe while staying inside a default Postgres.
default_pool_size = 15
min_pool_size = 0
reserve_pool_size = 5
max_db_connections = 40

; Client side. One core-api opens 20 (app) + 8 (reporting) + 1 (LISTEN — which
; does not come through here) and one worker opens 20 + 5. Two instances are
; 106 pooled client connections; 400 leaves room for a third and for psql.
max_client_conn = 400

; Clients may set these on connect without upsetting the transaction state.
ignore_startup_parameters = extra_float_digits,options

; The admin console (`SHOW POOLS`, `SHOW STATS`, `SHOW CONFIG`) answers for the
; owner role. It is reachable only on the private network (compose publishes
; loopback, the Kubernetes manifest publishes nothing), and an operator who
; cannot read the pool's state cannot size it.
admin_users = marula
stats_users = marula

; One line per pool every minute in `SHOW STATS`; enough to see the server-side
; count move without a scrape per second.
stats_period = 60

; No TLS inside the compose network: the hop stays on the private bridge and
; the database has no public listener. A deployment that spans hosts turns
; this on and points `server_tls_sslmode` at it.
log_connections = 0
log_disconnections = 0

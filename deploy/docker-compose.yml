# Meridian local stack.
#
# Purpose: one command brings up the full Stage-1 system — Postgres (pg17 +
# pgvector), Redis, schema migration, core-api, realtime WS hub, worker.
#
# Role split matters: migrations and the worker run as the TABLE OWNER
# (`meridian`, RLS-bypassing — the relay must read every org's outbox),
# while core-api connects as `meridian_app` (RLS-constrained; the role and
# its grants are provisioned by migration 0001 itself).
#
# Non-purpose: no TLS, no secrets management, no volume backup jobs — this
# file targets local development and demo stacks, not production.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up --build
#
# Ports: 15432 pg · 16379 redis · 8080 api · 8081 ws · 8082 worker-health
#        · 3000 web · (stage2 profile) 9000/9001 minio · 1025/8025 mailpit
#        · (observability profile) 4317/4318 otel-collector · 3200 tempo
#        · 3100 loki · 3001 grafana · 18899 metrics exposition
#
# Stage-2 slots (object storage + email sink) are declared but NOT started by
# default — launch them explicitly with:
#   docker compose -f deploy/docker-compose.yml --profile stage2 up
#
# Observability (TASKLIST 2.18): telemetry export is DISABLED BY DEFAULT —
# `docker compose up` behaves exactly as before. To observe the stack, set
# OTEL_EXPORTER_OTLP_ENDPOINT for the containers and start the profile:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 \
#     docker compose -f deploy/docker-compose.yml --profile observability up
# Grafana (http://localhost:3001) ships preprovisioned Tempo/Loki/
# MeridianMetrics datasources plus the "Meridian Starter" dashboard.
# GlitchTip slot is stub-documented below (not yet wired to any error
# pipeline); Uptime-Kuma was deliberately left out of this baseline.

name: meridian

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: meridian-cli }
    entrypoint: ["/usr/local/bin/meridian-cli"]
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/meridian
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: core-api }
    # Entrypoint is pinned to core-api in the Dockerfile; see deploy note.
    environment:
      DATABASE_URL: postgres://meridian_app:meridian_app@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
      BIND_ADDR: 0.0.0.0:8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGIN: http://localhost:3000
      # Email v1 defaults (see crates/core-mail/README.md none modes):
      # webhook DISABLED until EMAIL_INBOUND_HMAC_SECRET is set; transport
      # `smtp` requires the stage2-profile mailpit slot (--profile stage2).
      EMAIL_INTERNAL_TOKEN: ${EMAIL_INTERNAL_TOKEN:-dev-email-internal}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Object storage (TASKLIST 2.14). Default stays the local-fs none
      # mode so `up` without the stage2 profile needs no MinIO; flipping
      # OBJECT_STORE=s3 (stage2 profile) points at the minio slot below.
      OBJECT_STORE: ${OBJECT_STORE:-local}
      OBJECT_STORE_LOCAL_DIR: ${OBJECT_STORE_LOCAL_DIR:-/data/objects}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-meridian}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-meridian}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-meridian-dev-minio}
      MERIDIAN_MAX_UPLOAD_MB: ${MERIDIAN_MAX_UPLOAD_MB:-25}
      # OpenTelemetry (TASKLIST 2.18): empty ⇒ none mode (no OTel SDK, no
      # exporters). Set to http://otel-collector:4318 together with the
      # observability profile (see header comment).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: realtime }
    entrypoint: ["/usr/local/bin/realtime"]
    environment:
      REDIS_URL: redis://redis:6379/0
      BIND_ADDR: 0.0.0.0:8081
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # OpenTelemetry (TASKLIST 2.18): empty ⇒ none mode; see header.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: worker }
    entrypoint: ["/usr/local/bin/worker"]
    # Owner role on purpose: the relay reads outbox rows across ALL orgs
    # and must not be constrained by RLS (see crates/worker config notes).
    environment:
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
      BIND_ADDR: 0.0.0.0:8082
      RELAY_BATCH: "200"
      CORE_API_URL: http://core-api:8080
      EMAIL_INTERNAL_TOKEN: ${EMAIL_INTERNAL_TOKEN:-dev-email-internal}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # OpenTelemetry (TASKLIST 2.18): empty ⇒ none mode; see header.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      # Baked into the client bundle at build time — must be reachable from
      # the user's browser, hence a localhost URL, not the service name.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      core-api:
        condition: service_started

  # ---- Stage-2 slots (not started by default; see --profile stage2) ----

  # Object storage for attachments when OBJECT_STORE=s3 (see core-api env).
  # Buckets are NOT auto-created; once after first start:
  #   docker run --rm --network meridian_default --entrypoint /bin/sh minio/mc \
  #     -c "mc alias set m http://minio:9000 meridian meridian-dev-minio && mc mb --ignore-existing m/meridian"
  minio:
    image: minio/minio:latest
    profiles: ["stage2"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: meridian
      MINIO_ROOT_PASSWORD: meridian-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["stage2"]
    ports:
      - "1025:1025"   # SMTP sink
      - "8025:8025"   # Web UI

  # ---- Observability slots (TASKLIST 2.18; --profile observability) ----
  #
  # Wiring: core-api/realtime/worker export OTLP/HTTP (protobuf) to the
  # collector when OTEL_EXPORTER_OTLP_ENDPOINT is set (see header); the
  # collector fans out traces → Tempo, metrics → its own Prometheus
  # exposition (:18899, scraped by Grafana's MeridianMetrics datasource),
  # logs → Loki's native OTLP endpoint. Grafana ships preprovisioned
  # datasources + the "Meridian Starter" dashboard from
  # deploy/observability/. Config files: deploy/observability/*.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    command: ["--config", "/etc/otel-collector/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "18899:18899" # Prometheus exposition (scrape target)

  tempo:
    image: grafana/tempo:latest
    profiles: ["observability"]
    command: ["-config.file", "/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # HTTP API / query

  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    command: ["-config.file", "/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - otel-collector
      - tempo
      - loki

  # GlitchTip slot — STUB ONLY (deliberately not wired): error tracking
  # needs an upstream decision on DSN distribution (which surfaces get a
  # DSN, self-host vs SaaS) before the error pipeline is designed. When
  # wired: run glitchtip/glitchtip here and add a Sentry-compatible
  # exporter/init in the services; until then no Meridian code references it.
  # glitchtip:
  #   image: glitchtip/glitchtip:latest
  #   profiles: ["observability"]
  #   environment:
  #     DATABASE_URL: ...
  #     SECRET_KEY: ...
  #   ports:
  #     - "8010:8000"

volumes:
  pgdata:
  miniodata:
  tempodata:
  lokidata:

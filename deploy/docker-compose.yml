# Marula local stack.
#
# Purpose: one command brings up the full Stage-1 system — Postgres (pg18 +
# pgvector), Valkey (Redis-compatible), schema migration, core-api, worker.
#
# Role split matters: migrations and the worker run as the TABLE OWNER
# (`marula`, RLS-bypassing — the relay must read every org's outbox),
# while core-api connects as `marula_app` (RLS-constrained; the role and
# its grants are provisioned by migration 0001 itself).
#
# Non-purpose: no TLS, no secrets management, no volume backup jobs — this
# file targets local development and demo stacks, not production. The
# production front door is an overlay, not a fork: deploy/edge/ adds the
# Caddy proxy that terminates TLS (Direct mode, or Cloudflare Edge mode with
# an Origin CA certificate or a DNS-01 token) and pulls the raw ports back
# off the network. See deploy/edge/README.md.
#
# Usage — a laptop stack, which is what the dev marker is for:
#   docker compose -f deploy/docker-compose.yml \
#                  --env-file deploy/dev.env up --build
#
# Usage — any other stack, where the operator generates the secrets:
#   export JWT_SECRET=$(openssl rand -hex 32)              # signs access/refresh tokens
#   export MARULA_SECRET_KEY=$(openssl rand -hex 32)       # AES-256 at-rest key
#   export MARULA_INTERNAL_TOKEN=$(openssl rand -hex 32)   # worker machine seam
#   export EMAIL_INTERNAL_TOKEN=$(openssl rand -hex 32)    # email seam
#   export POSTGRES_PASSWORD=$(openssl rand -hex 32)       # marula owner role (set at first boot)
#   export MARULA_APP_PASSWORD=$(openssl rand -hex 32)     # marula_app role (applied on every up)
#   export GARAGE_RPC_SECRET=$(openssl rand -hex 32)       # stage2 Garage RPC secret
#   export GLITCHTIP_SECRET_KEY=$(openssl rand -hex 32)    # observability GlitchTip
#   docker compose -f deploy/docker-compose.yml up --build
#
# Ports: 15432 pg · 16379 valkey · 8080 api · 8082 worker-health
#        · 3000 web · (stage2 profile) 3900-3903 garage · 1025/8025 mailpit
#        · (observability profile) 4317/4318 otel-collector · 3200 tempo
#        · 3100 loki · 9090 prometheus · 3001 grafana · 8010 glitchtip
#        · 3002 uptime-kuma · 18899 metrics exposition
#        · (ai profile) ollama — local model runtime, unpublished
#
# Secrets posture (Wave 56 p56-deploy-posture, extended by Wave 58
# p58-deploy): this file ships NO secret value for anything that can reach a
# deployed instance. Eight variables are required — JWT_SECRET,
# MARULA_SECRET_KEY, MARULA_INTERNAL_TOKEN, EMAIL_INTERNAL_TOKEN,
# POSTGRES_PASSWORD, MARULA_APP_PASSWORD, GARAGE_RPC_SECRET and
# GLITCHTIP_SECRET_KEY — and compose refuses to render the file without them
# (`:?` guards, the shape the preview overlay already used). The defaults that
# used to sit here were the reason an install that never set a key signed
# tokens with one published in this repository: anyone who had read the source
# could mint an owner token, connect to Postgres, or drive the object store.
#
# Two of the eight need a sentence each because they are not simply generated:
#
#   * POSTGRES_PASSWORD is applied by initdb on the FIRST boot of the pgdata
#     volume. A fresh install can use `openssl rand -hex 32`; an install whose
#     volume already exists keeps the password it was initialised with, so set
#     this to that value (it used to be `marula`). To rotate it, ALTER ROLE on
#     the live server and change this value together. Keep it hex: the value is
#     interpolated into connection URLs, so `@`, `:` or `/` would need
#     percent-encoding.
#   * MARULA_APP_PASSWORD names the `marula_app` role's password. The
#     `app-role-password` one-shot below applies it to the role as the owner on
#     every bring-up (F65): after migrations have created the role and before
#     core-api starts. A fresh volume therefore ends with this value rather
#     than the literal migration 0114 mints, and a generated value is correct
#     here — unlike POSTGRES_PASSWORD, no volume state has to agree with it.
#
# Compose interpolates the whole file, so the profile-only credentials
# (GARAGE_RPC_SECRET, GLITCHTIP_SECRET_KEY) must be set even when the stage2
# and observability profiles stay off. Generated values are fine there: they
# are not read until the profile starts.
#
# The dev marker is MARULA_DEV_TOOLS=1 and it is carried by a file, not by
# a fallback value: deploy/dev.env holds the repository's published dev
# values and `--env-file deploy/dev.env` is the act of choosing them. The
# `dev-posture` service below prints a warning whenever those published
# values are in play (or when the marker is on), so a stack that is only
# safe on a laptop says so in its own boot logs — exactly what the desktop
# debug build does at launch.
#
# PgBouncer's auth file is generated, not shipped (F65). The `pooler-auth`
# one-shot renders it from POSTGRES_PASSWORD and MARULA_APP_PASSWORD into a
# volume the pooler mounts read-only, because the pooler cannot read the
# environment itself. Nothing in this repository holds a copy of either
# password for it to authenticate with.
#
# Teardown note: `down` interpolates this file too, so a stack whose
# variables are no longer exported needs the same `--env-file` (or exports)
# before it can be stopped. The host's env file is the copy that matters.
#
# Demo instance (Wave 47 lane V1 `p47-demo-deploy-profile`): use the overlay
# `deploy/docker-compose.demo.yml`. It turns the dev surface on deliberately,
# binds core-api to 127.0.0.1, seeds once through a one-shot `demo-seed`
# service, and leaves the reset path on loopback. See the overlay header and
# docs/reference/demo-instance.md. The base file alone never enables dev tools.
#
# Security posture (Wave 38 p38-container-hardening): every third-party
# image is pinned to an exact tag AND a registry digest (the digest is the
# enforcement, the tag the human reference; both must move together on a
# version bump). Every service runs least-privilege: cap_drop ALL,
# no-new-privileges, and read_only rootfs + tmpfs where the image tolerates
# it. Per-service `user:` values match the images' built-in non-root
# identities; services that legitimately need more carry an evidenced
# exemption comment in their block (postgres chowns its data dir at
# first-boot init; clamav needs inbound-capable freshclam signature runs;
# grafana owns its provisioned state dirs).
#
# Stage-2 slots (object storage + email sink) are declared but NOT started by
# default — launch them explicitly with:
#   docker compose -f deploy/docker-compose.yml --profile stage2 up
#
# Local models (Wave 34 claims close-out, claim 9): the `ai` profile adds an
# Ollama model runtime for transcription + embeddings, so "run these models
# locally" is a command rather than a paragraph of prose. No model weights
# ship inside any Marula image; `ollama pull` fetches them into the
# ollamadata volume. The profile is off by default, and Marula's own images
# never carry weights — see docs/site/reference/self-host-local-ai.md for the
# decision and the reasoning.
#   docker compose -f deploy/docker-compose.yml --profile ai up -d ollama
#
# Observability (the private build tracker 2.18): telemetry export is DISABLED BY DEFAULT —
# `docker compose up` behaves exactly as before. To observe the stack, set
# OTEL_EXPORTER_OTLP_ENDPOINT for the containers and start the profile:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 \
#     docker compose -f deploy/docker-compose.yml --profile observability up
# Grafana (http://localhost:3001) ships preprovisioned Tempo/Loki/
# MarulaMetrics datasources plus the "Marula Starter" dashboard.
# GlitchTip slot is live; its per-service DSN env is declared on each
# service block and presence (never the value) is reported by the
# Settings → Self-host services pane. The Uptime-Kuma status-page slot
# joined the profile with Wave 34's claims close-out (verdict-sweep
# claim 7) on the same footing: profile-gated, digest-pinned, no
# dependency on the core-api/worker bring-up order, admin setup done
# once at http://localhost:3002.

name: marula

# Container stdout logs are the classic silent disk filler — every service
# rotates through at most 3 x 10MB json-file logs. Local containers get
# conservative memory ceilings so a runaway process dies instead of eating
# the host (compose v2 applies mem_limit/cpus without swarm).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Least-privilege baseline for every service (p38): drop all capabilities,
# forbid privilege escalation via setuid binaries. Applied per service via
# YAML anchors; services that must deviate override the specific key and
# carry an exemption comment (never silent).
x-cap-common: &cap-common
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges"]

services:
  postgres:
    # PG18 (2026-09 decision): async I/O (io_method), skip scans, uuidv7(),
    # RETURNING OLD/NEW, temporal constraints. Bumping an existing volume:
    # dump/restore (`pg_dump marula`) or pg_upgrade-in-place; 18's pg_upgrade
    # retains optimizer statistics so no slow-plans grind after cutover.
    image: dhi.io/pgvector:0.8-pg18@sha256:069119d1ad25e1155e165786230ef3b4a570f1857b315166924b895c4d2c6946
    mem_limit: 1g
    cpus: 2.0
    logging: *default-logging
    <<: *cap-common
    # DHI pgvector (0.8.x on PG18, debian-13; postgres uid 70). Its
    # entrypoint keeps the chown-based boot: EXEMPTION (read_only)! The
    # official entrypoint chowns/initializes PGDATA and writes unix
    # sockets + postmaster.pid on the rootfs at first boot; a read-only
    # rootfs breaks cluster init rather than being an honest hardening win
    # here. Data-at-rest isolation is the pgdata volume; capabilities stay
    # dropped. Runs as the image default (root init → postgres 70);
    # forcing `user:` would break the chown-based init against a fresh
    # named volume.
    read_only: false
    environment:
      POSTGRES_USER: marula
      # Required, never defaulted: this is applied by initdb on first boot and
      # is the owner credential every other service's URL interpolates.
      # Existing pgdata volumes keep their original password — see the header.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - the marula owner role's password. Fresh volume: openssl rand -hex 32. Existing volume: the value it was initialised with (marula before Wave 58). Laptop stack: --env-file deploy/dev.env}"
      POSTGRES_DB: marula
    # Instrumentation, not tuning. `pg_stat_statements` records the query mix
    # the perf harness never sees (it measures one endpoint at a time), and
    # `auto_explain` logs the plan of anything slower than 200ms — the tail
    # §7 of docs/perf.md shows is where dataset cost lands. Both need the
    # library preloaded; the SQL objects are created by migration 0145 and
    # are skipped on a server that forbids them.
    #
    # 200ms is above the 150ms page budget on purpose: only a statement that
    # has already broken the budget writes a plan. Raise it on a slower box,
    # or lower it to 50ms when investigating a regression.
    #
    # `io_method` is pinned even though `worker` is the PG18 default: it can
    # only be set at server start, so a future default change would otherwise
    # alter behaviour silently. `io_workers` (3) and the 16-value
    # effective/maintenance_io_concurrency defaults are left alone — raising
    # them is a sizing decision, documented in
    # docs/site/reference/db-observability.md.
    # NOTE the command list starts at `-c`, not at `postgres`: the DHI
    # entrypoint ends with `exec postgres "$@"`, so a leading `postgres` here
    # becomes `postgres postgres -c ...` and the server refuses with
    # `invalid argument: "postgres"` (found by the Wave 56 boot check — the
    # base stack could not start its database at all). The entrypoint owns
    # the binary name; this list owns the flags.
    command:
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.max=10000
      - -c
      - auto_explain.log_min_duration=200ms
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
      - -c
      - auto_explain.log_format=json
      - -c
      - io_method=worker
    ports:
      - "15432:5432"
    volumes:
      # PG18 images (docker-library 2026+) use pg_ctlcluster-style
      # major-version subdir layout — mount the VOLUME ROOT, not /data, so
      # pg_upgrade can move between version dirs later (see its note about
      # mount-point boundary issues).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marula -d marula"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Valkey (Redis 7 wire-compatible fork; drop-in for REDIS_URL). Service
    # keeps the `redis` name so REDIS_URL / depends_on references are
    # unaffected.
    image: dhi.io/valkey:8.1.10@sha256:3caa5e36670b3eb234fd3d958452431c802c6a8de22a8abf747ec72b532582f2
    logging: *default-logging
    <<: *cap-common
    # Valkey (Redis 7 wire-compatible; DHI 8.1.10). Valkey writes only its
    # RDB/AOF under /data (a volume); the rootfs itself is untouched, so it
    # tolerates a read-only rootfs. Runs as the image's own nonroot user
    # (65532, passwd-verified); /data/tmp is provided by tmpfs for its
    # socket/PID needs.
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp
    # Fail writes loudly (noeviction) rather than silently evicting queue
    # state; 192mb keeps the process inside its 384m ceiling. protected-mode
    # is OFF because the dev stack reaches Valkey through the published port
    # (Docker's proxy arrives from the gateway IP, which protected mode
    # denies — the DHI image enables it by default); the loopback bind keeps
    # that reachable only from this host.
    command: ["valkey-server", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction", "--protected-mode", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # PgBouncer's auth file, rendered from the environment (F65). It used to be
  # a checked-in file holding both database passwords; a credential in git is
  # a credential anyone who has read the repository can use, and the file
  # could not follow a changed password without a hand edit. PgBouncer's own
  # image cannot do this itself (DHI ships the binary and no shell), so one
  # short-lived container writes the file the pooler mounts.
  #
  # EXEMPTION (root): a fresh named volume arrives root-owned, and the file
  # has to be created in it — a non-root uid cannot write at that path. The
  # file is mode 644 because chown needs CAP_CHOWN, which the baseline
  # deliberately drops; it is readable by the pooler's uid and by nothing
  # outside these two containers. The rootfs is read-only and the only write
  # anywhere is that one file.
  pooler-auth:
    image: dhi.io/pgvector:0.8-pg18@sha256:069119d1ad25e1155e165786230ef3b4a570f1857b315166924b895c4d2c6946
    mem_limit: 32m
    cpus: 0.5
    restart: "no"
    logging: *default-logging
    <<: *cap-common
    read_only: true
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      # Both roles the pooler serves, from the same variables every other
      # service reads. Required here for the same reason they are required in
      # core-api's URL: a pooler with a missing password is a pooler that
      # refuses every client.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - the marula owner role's password}"
      MARULA_APP_PASSWORD: "${MARULA_APP_PASSWORD:?MARULA_APP_PASSWORD is required - the marula_app role's password}"
    command:
      - |
        sh /pooler/render-userlist.sh /auth/userlist.txt
    volumes:
      # The renderer is the same script an operator runs for a pooler that
      # compose does not start (deploy/pooler/README.md).
      - ./pooler/render-userlist.sh:/pooler/render-userlist.sh:ro
      - poolerauth:/auth

  # Transaction pooler (Wave 52 lane P9). Every application pool dials this,
  # not Postgres: one instance opens 54 client connections and two instances
  # took the fleet past Postgres's default `max_connections = 100`
  # (docs/capacity-model.md). The pooler holds the server side at 15 per
  # (database, user) pair however many instances appear.
  #
  # The three settings that make transaction pooling safe are in
  # deploy/pooler/pgbouncer.ini, not here: `pool_mode = transaction`,
  # `server_reset_query = DISCARD ALL` with `server_reset_query_always = 1`,
  # and `max_prepared_statements = 0` to match this stack's
  # MARULA_DB_STATEMENT_CACHE=0. docs/reference/connection-pooling.md carries
  # the measurement behind each one.
  #
  # Two things deliberately do NOT come through it:
  #   * the `migrate` job (DDL and the migration advisory lock want a direct,
  #     long-lived session, and it runs before the pooler is useful);
  #   * each process's ONE LISTEN connection (`MARULA_LISTEN_DATABASE_URL`) —
  #     a subscription cannot survive a connection that changes hands after
  #     every transaction.
  #
  # No healthcheck: DHI's hardened image carries the pooler binary and no
  # shell or client, so there is nothing for compose to exec — same reason
  # core-api has none. The dependants below wait for `service_started` and
  # their `restart: unless-stopped` closes the sub-second gap.
  pgbouncer:
    mem_limit: 128m
    cpus: 1.0
    logging: *default-logging
    image: dhi.io/pgbouncer:1.26@sha256:17157120154cd111541281b39e9ad846e567e7fc1ea2e964abdc8c4bf4547fff
    <<: *cap-common
    # DHI nonroot 65532. Config and password file are read-only bind mounts;
    # the pidfile and unix socket are the only writes, and both are tmpfs.
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp
      - /run/pgbouncer
    volumes:
      - ./pooler/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Written by `pooler-auth` above and read here; the pooler has no
      # credential of its own anywhere else.
      - poolerauth:/auth:ro
    # Reachable from the host for SHOW POOLS / SHOW STATS during triage, and
    # only on loopback. Postgres keeps the published 15432.
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
      pooler-auth:
        condition: service_completed_successfully

  # The dev marker's megaphone (Wave 56 p56-deploy-posture). The desktop
  # debug build warns at launch that it trusts the repository's published
  # dev secret; this stack has the same exposure and no shell in its own
  # runtime images to say so, so one short-lived container says it instead.
  #
  # It keys off the VALUES, not the switch: a hand-exported published key
  # warns exactly like a `--env-file deploy/dev.env` boot, and a stack with
  # real generated keys stays quiet. `migrate` depends on it, so the warning
  # lands above the API's first log line rather than after it. Nothing here
  # can fail a boot — it prints and exits 0.
  #
  # Image: the Postgres pin the stack already pulls (the `postgres` service
  # above, same digest). It is the one image in this file guaranteed to
  # carry a shell, and reusing it adds no pin to keep in step. Overriding
  # the entrypoint means no cluster is initialised and nothing is written.
  dev-posture:
    image: dhi.io/pgvector:0.8-pg18@sha256:069119d1ad25e1155e165786230ef3b4a570f1857b315166924b895c4d2c6946
    mem_limit: 32m
    restart: "no"
    logging: *default-logging
    <<: *cap-common
    read_only: true
    user: "65534:65534"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - 64 hex chars (openssl rand -hex 32). Laptop stack: --env-file deploy/dev.env}"
      MARULA_SECRET_KEY: "${MARULA_SECRET_KEY:?MARULA_SECRET_KEY is required - 64 hex chars, the at-rest key (openssl rand -hex 32)}"
      MARULA_INTERNAL_TOKEN: "${MARULA_INTERNAL_TOKEN:?MARULA_INTERNAL_TOKEN is required - the worker seam bearer (openssl rand -hex 32)}"
      EMAIL_INTERNAL_TOKEN: "${EMAIL_INTERNAL_TOKEN:?EMAIL_INTERNAL_TOKEN is required - the email seam token (openssl rand -hex 32)}"
      # The remaining required credentials are guarded where they are used
      # (postgres, core-api's URL, garage, glitchtip); this service reads them
      # only to say out loud when the published dev values are in play.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MARULA_APP_PASSWORD: ${MARULA_APP_PASSWORD:-}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GLITCHTIP_SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      MARULA_DEV_TOOLS: ${MARULA_DEV_TOOLS:-}
      MARULA_DEMO_MODE: ${MARULA_DEMO_MODE:-}
    command:
      - |
        published=0
        devcreds=0
        case "$$JWT_SECRET" in
          5d1a2f0b3c4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e) published=1 ;;
        esac
        case "$$MARULA_SECRET_KEY" in
          6e6808490009ad97fe176b954f03a7eeeca54af4e10c384c7beb7ce43e0e7b21) published=1 ;;
        esac
        case "$$MARULA_INTERNAL_TOKEN" in
          dev-internal) published=1 ;;
        esac
        case "$$EMAIL_INTERNAL_TOKEN" in
          dev-email-internal) published=1 ;;
        esac
        case "$$POSTGRES_PASSWORD" in
          marula) devcreds=1 ;;
        esac
        case "$$MARULA_APP_PASSWORD" in
          marula_app) devcreds=1 ;;
        esac
        case "$$GARAGE_RPC_SECRET" in
          5ee1876f31b4a9ce1d2f6087c4e91ba9f0d8c3a25764b1e6892c40ada37f3102) devcreds=1 ;;
        esac
        case "$$GLITCHTIP_SECRET_KEY" in
          glitchtip-dev-secret-change-me) devcreds=1 ;;
        esac
        if [ "$$published" = 1 ]; then
          echo "DEV POSTURE: this stack signs with the repository's published dev JWT secret," >&2
          echo "decrypts sealed rows with its published at-rest key, and accepts its published" >&2
          echo "machine-seam tokens. Any process that has read the repository can mint an owner" >&2
          echo "token here. Generate real values (openssl rand -hex 32) before this stack reaches" >&2
          echo "a network you do not own." >&2
        fi
        if [ "$$devcreds" = 1 ]; then
          echo "DEV POSTURE: this stack runs on the repository's published Postgres, Garage or" >&2
          echo "GlitchTip credentials. The database password is the one anyone who read the" >&2
          echo "source already has. Generate real values before this stack reaches a network" >&2
          echo "you do not own; an existing pgdata volume keeps its original password." >&2
        fi
        if [ "$$MARULA_DEV_TOOLS" = 1 ]; then
          echo "DEV POSTURE: MARULA_DEV_TOOLS=1 mounts /api/dev/* (demo reset and dev routes)." >&2
          echo "Leave it off for an instance anyone else can reach." >&2
        fi
        if [ "$$MARULA_DEMO_MODE" = 1 ]; then
          echo "DEMO POSTURE: deploy/docker-compose.demo.yml is active. core-api is bound to" >&2
          echo "127.0.0.1:8080 and the public edge answers 404 for /api/dev/*; reset the demo" >&2
          echo "over loopback (SSH tunnel on a VPS), never through the public hostname." >&2
        fi
        exit 0

  migrate:
    mem_limit: 256m
    cpus: 1.0
    logging: *default-logging
    <<: *cap-common
    # Ephemeral one-shot job; writes nothing to disk. Rootfs can stay
    # read-only; the rust image already runs as nonroot 65532.
    read_only: true
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: marula-core-cli }
    entrypoint: ["/usr/local/bin/marula"]
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://marula:${POSTGRES_PASSWORD}@postgres:5432/marula
    depends_on:
      dev-posture:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # The app role's password, applied from the environment on every bring-up
  # (F65). Migration 0114 creates `marula_app` with the literal `marula_app`,
  # and a migration cannot read the environment — so before this one-shot the
  # only password the role ever had was one published in this repository.
  #
  # It runs as the OWNER, after migrations (the role does not exist until
  # 0114 has run) and before core-api, which is what makes a fresh volume end
  # with MARULA_APP_PASSWORD instead of the literal. The ALTER is
  # unconditional, so a changed value reaches the role on the next `up` too;
  # it is also why no password has to match what the volume already holds.
  #
  # Nothing here generates a value: the environment is the only source. A
  # generated password would be pointless (it has to reach core-api as well)
  # and a fallback would be the defect this service exists to remove.
  app-role-password:
    image: dhi.io/pgvector:0.8-pg18@sha256:069119d1ad25e1155e165786230ef3b4a570f1857b315166924b895c4d2c6946
    mem_limit: 64m
    cpus: 0.5
    restart: "no"
    logging: *default-logging
    <<: *cap-common
    # A psql client and /tmp: no writes to disk, no capabilities, and the
    # same nobody uid the dev-posture one-shot uses with this image.
    read_only: true
    user: "65534:65534"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      PGHOST: postgres
      PGUSER: marula
      PGDATABASE: marula
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - the marula owner role's password; this one-shot connects as the owner to set the app role's password}"
      MARULA_APP_PASSWORD: "${MARULA_APP_PASSWORD:?MARULA_APP_PASSWORD is required - the marula_app role's password, applied to the role on every bring-up}"
    command:
      - |
        until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
        if [ "$$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'marula_app'")" != 1 ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE marula_app LOGIN"
        fi
        # psql quotes the value itself (:'pw'), so a password with a quote or
        # a backslash in it cannot end the SQL literal early.
        printf '%s\n' "ALTER ROLE marula_app WITH LOGIN PASSWORD :'pw';" \
          | psql -v ON_ERROR_STOP=1 -v pw="$$MARULA_APP_PASSWORD"
        # The retrieval probe reads shared_preload_libraries at boot to decide
        # whether the selected mode can run, and that setting is superuser-only.
        # Without the grant core-api refuses to start with "permission denied to
        # examine shared_preload_libraries", which reads as a broken install
        # rather than a missing privilege. The demo overlay granted this; the
        # base stack never did.
        psql -v ON_ERROR_STOP=1 -c "GRANT pg_read_all_settings TO marula_app"
        echo "applied MARULA_APP_PASSWORD to the marula_app role" >&2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  core-api:
    # The embedding floor is the floor here, not a preference. R13 made
    # EmbeddingGemma 2 the default model and it needs four cores and 768 MB
    # resident (measured: 508 MB plus one batch), so a 512m/2-cpu container
    # refuses to boot with the shipped tier; core-api fails the same check the
    # installer runs, and the install looks broken rather than refused. One
    # gigabyte leaves the process its own room above the model.
    mem_limit: 1g
    cpus: 4.0
    logging: *default-logging
    <<: *cap-common
    # Supervisor policy (lane R5). `unless-stopped` restarts a crashed process
    # but leaves a container an operator stopped alone across a daemon restart;
    # a stop is drained, not cut — SIGTERM starts the binary's own window
    # (MARULA_SHUTDOWN_GRACE_SECS) and stop_grace_period leaves room for it.
    # No healthcheck here on purpose: the runtime image carries no shell and no
    # curl, so a compose HEALTHCHECK could not exec one; the Helm chart probes
    # /livez and /readyz over the network instead.
    restart: unless-stopped
    stop_grace_period: 30s
    # DHI debian-base nonroot 65532; the only writable path is the local
    # object-store dir (a volume), so the rootfs can stay read-only.
    read_only: true
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: core-api }
    # Entrypoint is pinned to core-api in the Dockerfile; see deploy note.
    environment:
      # Pooled by default (Wave 52 lane P9): the API's two pools dial the
      # transaction pooler, not Postgres. Override with
      # MARULA_APP_DATABASE_URL to go direct — and then raise
      # MARULA_DB_STATEMENT_CACHE and accept the connection ceiling back.
      DATABASE_URL: "${MARULA_APP_DATABASE_URL:-postgres://marula_app:${MARULA_APP_PASSWORD:?MARULA_APP_PASSWORD is required - the marula_app role's password, applied to the role by the app-role-password one-shot (openssl rand -hex 32). Laptop stack: --env-file deploy/dev.env}@pgbouncer:6432/marula}"
      # The ONE LISTEN connection goes straight to Postgres: a subscription
      # cannot ride a connection the pooler hands to the next client.
      MARULA_LISTEN_DATABASE_URL: ${MARULA_LISTEN_DATABASE_URL:-postgres://marula_app:${MARULA_APP_PASSWORD}@postgres:5432/marula}
      REDIS_URL: redis://redis:6379/0
      BIND_ADDR: 0.0.0.0:8080
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - 64 hex chars (openssl rand -hex 32). Laptop stack: --env-file deploy/dev.env}"
      # The at-rest seal key. from_env hard-fails without an explicit
      # MARULA_SECRET_KEY, and it is required here for the same reason the
      # signing key is: a value that ships in this repository is a value
      # anyone who read it can decrypt sealed rows with.
      MARULA_SECRET_KEY: "${MARULA_SECRET_KEY:?MARULA_SECRET_KEY is required - 64 hex chars, the at-rest key (openssl rand -hex 32)}"
      # The dev marker. Off unless the operator or dev.env sets it; core-api
      # mounts /api/dev/* and allows seed-demo only when it equals 1.
      MARULA_DEV_TOOLS: ${MARULA_DEV_TOOLS:-}
      # Optional EdDSA (Ed25519) access-token signing (Wave 34 lane 6):
      # set BOTH PEMs to switch signing to EdDSA (kid: MARULA_JWT_KID,
      # default m1); leave unset for the HS256 posture. A malformed or
      # half-configured pair refuses boot.
      MARULA_JWT_EDDSA_PRIVATE_KEY: ${MARULA_JWT_EDDSA_PRIVATE_KEY:-}
      MARULA_JWT_EDDSA_PUBLIC_KEY: ${MARULA_JWT_EDDSA_PUBLIC_KEY:-}
      MARULA_JWT_KID: ${MARULA_JWT_KID:-}
      CORS_ORIGIN: http://localhost:3000
      # Email v1 defaults (see crates/core-mail/README.md none modes):
      # webhook DISABLED until EMAIL_INBOUND_HMAC_SECRET is set; transport
      # `smtp` requires the stage2-profile mailpit slot (--profile stage2).
      EMAIL_INTERNAL_TOKEN: "${EMAIL_INTERNAL_TOKEN:?EMAIL_INTERNAL_TOKEN is required - the email seam token (openssl rand -hex 32)}"
      # The bearer half of the same seam (SLA, automation, webhook, dedupe,
      # workflow-node calls). core-api refuses boot without it outside the dev
      # profile, so it is required here exactly like EMAIL_INTERNAL_TOKEN.
      MARULA_INTERNAL_TOKEN: "${MARULA_INTERNAL_TOKEN:?MARULA_INTERNAL_TOKEN is required - the worker seam bearer (openssl rand -hex 32)}"
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Object storage (the private build tracker 2.14). Default stays the local-fs none
      # mode so `up` without the stage2 profile needs no garage; flipping
      # OBJECT_STORE=s3 (stage2 profile) points at the garage slot below.
      OBJECT_STORE: ${OBJECT_STORE:-local}
      OBJECT_STORE_LOCAL_DIR: ${OBJECT_STORE_LOCAL_DIR:-/data/objects}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-marula}
      S3_REGION: ${S3_REGION:-garage}
      # No default credential: the pair is minted by `garage key create` and
      # pasted here. Empty is correct while OBJECT_STORE is local — core-store
      # drops empty values, so the S3 branch never sees them.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MARULA_MAX_UPLOAD_MB: ${MARULA_MAX_UPLOAD_MB:-25}
      # Pool ceilings (Wave 49 lane R1, resized by Wave 52 lane P9). See
      # docs/perf.md §5 for the per-process table: 20 app + 8 reporting +
      # 1 LISTEN = 29 client connections for this process. The pooler holds
      # the server side at 15 per role, so the ceiling no longer decides
      # what Postgres sees.
      MARULA_DB_POOL_MAX: ${MARULA_DB_POOL_MAX:-20}
      MARULA_REPORTING_POOL_MAX: ${MARULA_REPORTING_POOL_MAX:-8}
      # Prepared-statement cache capacity. 0 = off, which transaction
      # pooling requires: a cached name cannot survive the pooler's
      # DISCARD ALL between transactions. See
      # docs/reference/connection-pooling.md before raising it.
      MARULA_DB_STATEMENT_CACHE: ${MARULA_DB_STATEMENT_CACHE:-0}
      # Bounded drain window (lane R5): how long in-flight requests may take
      # after SIGTERM. Keep it under stop_grace_period above.
      MARULA_SHUTDOWN_GRACE_SECS: ${MARULA_SHUTDOWN_GRACE_SECS:-20}
      # OpenTelemetry (the private build tracker 2.18): empty ⇒ none mode (no OTel SDK, no
      # exporters). Set to http://otel-collector:4318 together with the
      # observability profile (see header comment).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Self-host visibility (Wave 36 lane 3): the Settings → Self-host
      # services pane probes each loop's /healthz and renders external-UI
      # links. Internal URLs default to the compose service names; the
      # MARULA_*_URL vars are PUBLIC browser URLs — leave them empty on a
      # laptop (localhost defaults are pointless across hosts) and set them
      # when the stack runs on a server.
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://worker:8082}
      MARULA_GLITCHTIP_URL: ${MARULA_GLITCHTIP_URL:-}
      MARULA_GRAFANA_URL: ${MARULA_GRAFANA_URL:-}
      MARULA_TEMPO_URL: ${MARULA_TEMPO_URL:-}
      MARULA_LOKI_URL: ${MARULA_LOKI_URL:-}
      MARULA_OTEL_METRICS_URL: ${MARULA_OTEL_METRICS_URL:-}
      # GlitchTip DSNs (per-service; lane 2 decision): ingest-only
      # credentials. The pane reports presence only; the SDK wiring that
      # consumes them is a follow-up lane.
      GLITCHTIP_DSN_CORE_API: ${GLITCHTIP_DSN_CORE_API:-}
      # Inbound malware scanning (stage2 profile): EMAIL_SCAN=clamd turns
      # the scan gate on, CLAMD_ADDR names the clamav slot. Unset =
      # standalone-first default, messages record scan_status=skipped.
      EMAIL_SCAN: ${EMAIL_SCAN:-}
      CLAMD_ADDR: ${CLAMD_ADDR:-clamav:3310}
    ports:
      - "8080:8080"
    # The local object store is a VOLUME, not a directory in the container.
    # The rootfs is read-only (see the header); before this volume existed the
    # documented `OBJECT_STORE=local` mode could not persist a single upload, and
    # every restart turned every attachment row into a reference to missing
    # bytes. The worker mounts the same volume so the integrity pass
    # (MARULA_OBJECT_GC) walks the bytes this process writes.
    volumes:
      - objectdata:/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      # The role's password is set from the environment by this one-shot; the
      # API connecting before it completes would authenticate with the
      # migration's literal (or with nothing, on a fresh volume).
      app-role-password:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    <<: *cap-common
    # Supervisor policy (lane R5); same contract as core-api above. The worker
    # owns no traffic, so its window waits for the loops it runs.
    restart: unless-stopped
    stop_grace_period: 30s
    # Rust image nonroot uid 65532; queue relay with no local disk state —
    # read-only rootfs.
    read_only: true
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args: { BIN: worker }
    # Owner role on purpose: the relay reads outbox rows across ALL orgs
    # and must not be constrained by RLS (see crates/worker config notes).
    environment:
      # Pooled by default (Wave 52 lane P9); the relay's LISTEN connection
      # goes direct so the wakeup it subscribes to actually arrives.
      DATABASE_URL: ${MARULA_WORKER_APP_DATABASE_URL:-postgres://marula:${POSTGRES_PASSWORD}@pgbouncer:6432/marula}
      MARULA_LISTEN_DATABASE_URL: ${MARULA_LISTEN_DATABASE_URL:-postgres://marula:${POSTGRES_PASSWORD}@postgres:5432/marula}
      REDIS_URL: redis://redis:6379/0
      BIND_ADDR: 0.0.0.0:8082
      # Must match core-api's MARULA_SECRET_KEY or sealed webhook secrets
      # are undecryptable by the delivery worker. Required, not defaulted:
      # the same guard core-api carries, so the two cannot disagree by
      # accident.
      MARULA_SECRET_KEY: "${MARULA_SECRET_KEY:?MARULA_SECRET_KEY is required - 64 hex chars, the at-rest key (openssl rand -hex 32)}"
      RELAY_BATCH: "200"
      # Pool ceilings (Wave 49 lane R1); see docs/perf.md §5.
      MARULA_DB_POOL_MAX: ${MARULA_DB_POOL_MAX:-20}
      DELIVERY_POOL_MAX: ${DELIVERY_POOL_MAX:-5}
      # Same answer as core-api: no cached statement names behind the pooler.
      MARULA_DB_STATEMENT_CACHE: ${MARULA_DB_STATEMENT_CACHE:-0}
      # Bounded drain window (lane R5): how long the loops get to finish what
      # they hold after SIGTERM. Keep it under stop_grace_period above.
      MARULA_SHUTDOWN_GRACE_SECS: ${MARULA_SHUTDOWN_GRACE_SECS:-20}
      CORE_API_URL: http://core-api:8080
      EMAIL_INTERNAL_TOKEN: "${EMAIL_INTERNAL_TOKEN:?EMAIL_INTERNAL_TOKEN is required - the email seam token (openssl rand -hex 32)}"
      # The bearer half of the same seam (SLA, automation, webhook, dedupe,
      # workflow-node calls). core-api refuses boot without it outside the dev
      # profile, so it is set here exactly like EMAIL_INTERNAL_TOKEN.
      MARULA_INTERNAL_TOKEN: "${MARULA_INTERNAL_TOKEN:?MARULA_INTERNAL_TOKEN is required - the worker seam bearer (openssl rand -hex 32)}"
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # OpenTelemetry (the private build tracker 2.18): empty ⇒ none mode; see header.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # GlitchTip DSN presence for the self-host pane (Wave 36 lane 3);
      # the value itself is never printed by any surface.
      GLITCHTIP_DSN_WORKER: ${GLITCHTIP_DSN_WORKER:-}
      # Backup age (lane R7a): the runner writes one epoch-second stamp after a
      # pass with no failed layer, and this is the path it reads. It is mounted
      # below; unset would mean the gauge is simply not emitted, which is why the
      # stock profile now sets it instead of leaving the metric absent.
      MARULA_BACKUP_STAMP_PATH: ${MARULA_BACKUP_STAMP_PATH:-/pgdumps/.last_success_epoch}
      # Object-store integrity pass (lane R6): off unless set. `on` deletes
      # orphaned bytes and marks rows whose bytes are gone; `dry_run` only
      # reports. Enable it only where this container sees the same store
      # core-api writes (the objectdata volume below, or the same S3 bucket).
      MARULA_OBJECT_GC: ${MARULA_OBJECT_GC:-off}
      MARULA_OBJECT_GC_GRACE_HOURS: ${MARULA_OBJECT_GC_GRACE_HOURS:-24}
      OBJECT_STORE: ${OBJECT_STORE:-local}
      OBJECT_STORE_LOCAL_DIR: ${OBJECT_STORE_LOCAL_DIR:-/data/objects}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-marula}
      S3_REGION: ${S3_REGION:-garage}
      # No default credential: the pair is minted by `garage key create` and
      # pasted here. Empty is correct while OBJECT_STORE is local — core-store
      # drops empty values, so the S3 branch never sees them.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Retention matrix (lane R6): `standard` ships; `compact` and `extended`
      # move all nine windows at once. Per-table overrides exist
      # (MARULA_RETENTION_<TABLE>_DAYS) and are clamped by a floor.
      MARULA_RETENTION_PROFILE: ${MARULA_RETENTION_PROFILE:-standard}
    volumes:
      # Same objects core-api writes, so the integrity pass sees them. Read-write
      # because reclaiming an orphan is a delete.
      - objectdata:/data/objects
      # The backup runner's stamp directory, read-only: the worker reads the
      # file and never writes it.
      - backupdumps:/pgdumps:ro
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  web:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    <<: *cap-common
    # Supervisor policy (lane R5): a crashed Next server restarts; a stop gets
    # the same grace window as the API rather than Docker's 10s default.
    restart: unless-stopped
    stop_grace_period: 30s
    # Node standalone server as uid 1000 (matches the image USER); no
    # writes at runtime in production-mode Next standalone (no ISR/cache
    # dirs in use) — read-only rootfs with a tmpfs for /tmp.
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      # Baked into the client bundle at build time — must be reachable from
      # the user's browser, hence a localhost URL, not the service name.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      core-api:
        condition: service_started

  # ---- Stage-2 slots (not started by default; see --profile stage2) ----

  # Object storage for attachments when OBJECT_STORE=s3 (see core-api env).
  # Garage (OSS S3-compat, Rust single binary) — replaces the MinIO sample
  # (2026-09 decision; MinIO's community edition has degraded post-2025).
  # Layout+bucket are NOT auto-created; once after first start:
  #   docker compose --profile stage2 up -d garage
  #   docker compose --profile stage2 exec garage /garage status    # note NODE_ID (16 hex)
  #   docker compose --profile stage2 exec garage /garage layout assign -z dc1 -c 1G <NODE_ID>
  #   docker compose --profile stage2 exec garage /garage layout apply --version 1
  #   docker compose --profile stage2 exec garage /garage bucket create marula
  #   docker compose --profile stage2 exec garage /garage key create marula
  #   docker compose --profile stage2 exec garage /garage bucket allow --read --write marula --key marula
  # Put the key from `key create` into S3_ACCESS_KEY/S3_SECRET_ACCESS_KEY.
  garage:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    image: dxflrs/garage:v1.1.0@sha256:fdb8272fcbe643eef830ee17874d5d4ed623a86501f1acbac8012583113b1c26
    profiles: ["stage2"]
    <<: *cap-common
    # Distroless single binary, no bundled user — runs as the explicit
    # dedicated uid 10004. Data/meta live on their own volumes; config is
    # a read-only bind mount, so the rootfs can stay read-only.
    read_only: true
    user: "10004:10004"
    tmpfs:
      - /tmp
    environment:
      GARAGE_DOMAIN_NAME: .localhost
      # Required: 32-byte HEX per Garage's rpc_secret requirement (any other
      # value is fatal at first boot). The value that used to sit here was
      # published in this repository and also lives in garage.toml, which is
      # why that file no longer carries one — this variable is the only source.
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required - 32-byte hex for Garage RPC (openssl rand -hex 32). Laptop stack: --env-file deploy/dev.env}"
      GARAGE_RPC_PUBLIC_ADDR: garage:3901
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # inter-node RPC
      - "3903:3903"   # admin API
    volumes:
      - garagedata:/var/lib/garage/data
      - garagemeta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml
    healthcheck:
      # dxflrs/garage is distroless — no sh/curl; use the binary itself.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    profiles: ["stage2"]
    <<: *cap-common
    # Why no :latest (p38): the previous floating tag silently swapped the
    # binary under this slot; v1.31.3 is the audited pin (2026-09-28).
    # Mailpit persists mail in memory by default; a read-only rootfs plus
    # tmpfs is enough.
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "1025:1025"   # SMTP sink
      - "8025:8025"   # Web UI

  # ---- Observability slots (the private build tracker 2.18; --profile observability) ----
  #
  # Wiring: core-api and worker export OTLP/HTTP (protobuf) to the
  # collector when OTEL_EXPORTER_OTLP_ENDPOINT is set (see header); the
  # collector fans out traces → Tempo, metrics → its own Prometheus
  # exposition (:18899, scraped by Grafana's MarulaMetrics datasource),
  # logs → Loki's native OTLP endpoint. Grafana ships preprovisioned
  # datasources + the "Marula Starter" dashboard from
  # deploy/observability/. Config files: deploy/observability/*.yaml.
  otel-collector:
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    image: otel/opentelemetry-collector-contrib:0.118.0@sha256:3f6274fe609da4f9964fbc2ef36b83d08d47964fbb11629251393590d3924072
    profiles: ["observability"]
    <<: *cap-common
    # DHI nonroot (65532); config is a read-only bind mount, and the
    # memory limiter extension only needs its ballast in memory —
    # read-only rootfs works with a /tmp scratch.
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    command: ["--config", "/etc/otel-collector/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "18899:18899" # Prometheus exposition (scrape target)

  # The rule evaluator. It scrapes the collector's exposition and evaluates
  # deploy/observability/prometheus/rules/ — see that directory's README for the
  # alert pack, the SLOs and the runbooks behind each alert. Without this
  # container the rules are files that nothing reads: the collector exports
  # series, and exporting is not evaluating.
  prometheus:
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    # Upstream image (not a DHI build), pinned by digest like every other
    # third-party image here. It declares the nobody uid as its own user and
    # creates /prometheus owned by that uid, which is what makes the named
    # volume writable without a root step.
    image: prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    profiles: ["observability"]
    <<: *cap-common
    # Writes only its TSDB under /prometheus (a volume) and needs /tmp for its
    # own scratch, so the rootfs itself stays read-only.
    read_only: true
    user: "65534:65534"
    tmpfs:
      - /tmp
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./observability/prometheus/rules-optin:/etc/prometheus/rules-optin:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  tempo:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    image: dhi.io/tempo:2.7@sha256:a374e7d31fed1bd6140fe9bd2e71b70af19b1034ca057e32c6f37ea543ab82fb
    profiles: ["observability"]
    <<: *cap-common
    # DHI nonroot (65532); the wal dir lives on the tempodata volume,
    # so the rootfs stays read-only.
    read_only: true
    user: "65532:65532"
    command: ["-config.file", "/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # HTTP API / query

  loki:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    image: dhi.io/loki:3.6@sha256:6465cec55310a20319da23852655dff975e6b233ae073aab4135a469740b0a94
    profiles: ["observability"]
    <<: *cap-common
    # DHI nonroot (65532); chunk/index live under /loki (a volume) and
    # /tmp + /workspace tmpfs cover its runtime scratch.
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp
      - /workspace
    command: ["-config.file", "/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  grafana:
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    image: dhi.io/grafana:11@sha256:cfa9d61225bd4a574993e0a74226de3a031b4e55f0ea50a081b2cc5f319c4e79
    profiles: ["observability"]
    <<: *cap-common
    # DHI runs grafana as uid 65532. EXEMPTION (read_only): Grafana writes
    # its sqlite DB and plugin/annotation state under /var/lib/grafana and
    # needs its log dir — covered by the grafanadata volume — but it ALSO
    # touches /etc/grafana provisioning copy state and /var/log at boot;
    # running read-only requires the full fs-layout audit of its
    # entrypoint, which is not this slot's job (local demo observations).
    # Capabilities stay dropped; run as the image's own uid 65532.
    read_only: false
    user: "65532:65532"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - otel-collector
      - tempo
      - loki
      - prometheus

  # GlitchTip error tracking (2026-09 decision: activate). Needs its own DB —
  # once: `docker compose exec postgres createdb -U marula glitchtip`.
  # DSNs surface at http://localhost:8010. Code-side wiring (Sentry-compatible
  # exporter/init in the services) remains a follow-up lane.
  glitchtip:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    profiles: ["observability"]
    <<: *cap-common
    # GlitchTip 6.2.6 is the audited pin replacing :latest (2026-09-28).
    # Image's app user is uid/gid 5000 (read from /etc/passwd of the pin);
    # align `user:` with it, rootfs read-only with /tmp scratch.
    user: "5000:5000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgres://marula:${POSTGRES_PASSWORD}@postgres:5432/glitchtip}
      REDIS_URL: ${GLITCHTIP_REDIS_URL:-redis://redis:6379/1}
      # Required: Django's SECRET_KEY signs sessions and password-reset tokens.
      # The value that used to sit here was published in this repository.
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY is required - GlitchTip's Django signing key (openssl rand -hex 32). Laptop stack: --env-file deploy/dev.env}"
      GLITCHTIP_DOMAIN: http://localhost:8010
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    ports:
      - "8010:8000"

  # Uptime Kuma — the public status page + synthetic monitor for the
  # self-host observability profile (Wave 34 verdict-sweep claim 7: the one
  # §2 observability row that had not shipped). Synthetic probes hit the
  # same endpoints the operator's customers hit, and the status page it
  # serves is the artifact an operator hands a client during an incident.
  #
  # Remapped off 3001 (Grafana already owns that port in this stack).
  # Standalone by design: it keeps its own embedded store under /app/data
  # and has no Marula-side dependency, so it never becomes a hard link in
  # the core-api/worker bring-up order. First boot is a one-time admin
  # setup at http://localhost:3002 (see deploy/README.md).
  uptime-kuma:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    profiles: ["observability"]
    <<: *cap-common
    # 2.5.5 is the audited pin (2026-09-30, registry digest resolved on the
    # arm64 + amd64 linux manifests; the index digest is what the reference
    # pins, so one value serves both platforms). The image ships linux/arm64
    # natively — the same reason the clamav slot has no Rosetta pin.
    #
    # The image sets no `User:`; its documented runtime identity is the
    # in-image `node` user (uid/gid 1000), which is what `user:` below pins
    # — the same read-the-image-uid discipline the other slots use.
    user: "1000:1000"
    # EXEMPTION (read_only): the image ships its own HEALTHCHECK
    # (`extra/healthcheck`) and keeps its store under /app/data, but it also
    # writes engine scratch and TLS material at first boot outside that
    # volume. Pinning read_only needs a boot-verified tmpfs inventory, and
    # this lane ran no stack boot (gate pause) — so the exemption is recorded
    # rather than claimed. Capabilities stay dropped, no-new-privileges stays
    # on, and the data-at-rest surface is the uptimedata volume. The operator
    # verification step lives in deploy/README.md.
    read_only: false
    volumes:
      - uptimedata:/app/data
    ports:
      - "3002:3001"

  # ---- Local model runtime (--profile ai) ----
  #
  # Wave 34 claims close-out, verdict-sweep claim 9: the bundled-models leg
  # of the §2 AI-hooks row. DECISION: operator-side, and the deployment
  # layer is shipped here rather than promised in prose. The reasoning is
  # recorded in docs/site/reference/self-host-local-ai.md — the short
  # version is that model weights do not belong in the core-api image, and
  # the honest version of "bundled local whisper" is a one-command local
  # runtime that Marula already knows how to talk to.
  #
  # It is its own profile rather than a member of stage2 or observability:
  # those two answer "store things" and "watch things", this one is "run
  # models", and an operator who wants attachments and metrics should not
  # inherit several gigabytes of model weights by association.
  #
  # Marula never ships model weights in any image. `ollama pull` fetches
  # them into the ollamadata volume, so the operator can see and delete
  # exactly what is on disk.
  ollama:
    mem_limit: 4g
    # Four cores, not two. The bundled embedder is the default path now, and a
    # backfill batch is 128 inputs: measured on the 4-core reference profile it
    # takes single-digit seconds, and on two cores it takes roughly twice that,
    # which turns a 50k-chunk first index into an all-night job. The resident
    # set for the text-only model measured under a gigabyte, so the memory
    # ceiling is unchanged.
    cpus: 4.0
    logging: *default-logging
    # 0.40.7 serves EmbeddingGemma 2; the previous 0.35.0 pin refuses the model
    # with a version notice, so the bundled default could not run on it at all.
    # Digest is the multi-arch manifest list (linux/amd64 + linux/arm64), one
    # value for both.
    image: ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    profiles: ["ai"]
    <<: *cap-common
    # The image sets no `User:` and its documented model path is under
    # /root, which a non-root uid cannot write. So the identity is pinned
    # explicitly AND the model directory is moved to a mounted volume, which
    # is the arrangement Ollama documents for a rootless container.
    user: "1000:1000"
    # EXEMPTION (read_only): capabilities stay dropped and
    # no-new-privileges stays on, but the rootfs is writable. Ollama keeps
    # state outside $OLLAMA_MODELS (its own key material under the
    # container user's home), and pinning read_only would need a
    # boot-verified inventory of exactly what and where — which this lane
    # could not produce, having run no stack boot. Recorded as a known gap
    # rather than claimed as hardening; the data-at-rest surface is the
    # ollamadata volume and nothing else is persisted.
    #
    # Also worth knowing: this is an INFERENCE SERVER, and inference servers
    # execute downloaded model weights. It is on its own profile, off by
    # default, and it is the operator's call — which is exactly the posture
    # the BYOK design chose.
    read_only: false
    environment:
      # Unpublished on the host, like Postgres and Valkey in the preview
      # overlay: core-api reaches it by service name inside the compose
      # network, which is its only client. Publishing an unauthenticated
      # inference port on a network is a remote-code-execution offer, since
      # model loading parses a native format.
      OLLAMA_MODELS: /models
      # Refuses to pull a model on first use, so a mistyped model name fails
      # as a typed error instead of a multi-gigabyte surprise download.
      OLLAMA_NO_CLOUD: "1"
      # How long a model stays resident after its last request. Core asks for
      # this per request as well; the server default is set here so an operator
      # reading the compose file sees the idle behaviour without reading code.
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollamadata:/models
    # Deliberately NOT published. To reach it from the host, use the
    # network the operator already trusts:
    #   docker compose -f deploy/docker-compose.yml --profile ai up -d ollama
    #   docker compose -f deploy/docker-compose.yml exec ollama ollama pull embeddinggemma-2:270m-q8_0-text

  # One-shot model fetch for the AI profile: the bundled embedder is the
  # default path, so a fresh `--profile ai up` should end with a working vector
  # leg rather than a dark one plus a command to run. It runs `ollama pull`,
  # then exits; `OLLAMA_NO_CLOUD=1` above only refuses pulls the *server*
  # would start behind an inference request.
  ollama-model:
    image: ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    profiles: ["ai"]
    logging: *default-logging
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "waiting for ollama"; sleep 2;
        done
        ollama pull "$${MARULA_EMBEDDING_MODEL:-embeddinggemma-2:270m-q8_0-text}"
    restart: "no"

  # ClamAV daemon (2026-09 decision; --profile stage2): attachment/file
  # scanning boundary (secrets file records, staged imports). Code-side
  # wire-in on core-api's effect/step seams is a follow-up lane; the service
  # is the deployment target. Port 3310 is the clamd TCP interface
  # (PING→PONG). The image ships a built-in clamd healthcheck; expect a slow
  # first boot while the signature DB loads.
  clamav:
    mem_limit: 2g
    cpus: 1.0
    logging: *default-logging
    image: dhi.io/clamav:1.5.4@sha256:d02fd8be62db0cecad42586c976e7c8f831aafa353c7ab9dcb1938ced04bb61d
    profiles: ["stage2"]
    <<: *cap-common
    # DHI ships linux/arm64 natively (upstream clamav/clamav never did), so
    # the Rosetta platform pin of the old upstream slot is gone.
    # EXEMPTION (read_only): clamd/freshclam write signature DBs + tmp
    # state at boot (clamavdata volume covers /var/lib/clamav, but the
    # entrypoint also touches /var/log and needs to run its init as root
    # before dropping privileges); read-only was not survivable here
    # without forking the upstream entrypoint. Capabilities stay dropped.
    read_only: false
    ports:
      - "13310:3310"
    volumes:
      - clamavdata:/var/lib/clamav

  # ---- Backup slot (--profile backup): WAL-G (PG PITR) + restic snapshots ----
  # Nightly runner: copy deploy/backup/{wal-g,restic}.env.example to the same
  # names WITHOUT .example, fill in (point WALG_S3_PREFIX / RESTIC_REPOSITORY
  # at Garage or any S3), then `docker compose --profile backup up -d --build backup`.
  # restore.sh is the rehearsal leg — a backup that has never restored is not a backup.
  backup:
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    <<: *cap-common
    # Image (Dockerfile.backup) runs as dedicated uid/gid 10003; pg_dump
    # and restic need no capabilities. Writes go to /pgdumps (volume) and
    # restic's cache — give the cache a tmpfs so the rootfs stays
    # read-only.
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp
      - /root/.cache/restic
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile.backup
      args: [INSTALL_WAL_G]
    profiles: ["backup"]
    depends_on:
      - postgres
    # env_file:            # <-- uncomment after copying the .example files
    #   - ./backup/wal-g.env
    #   - ./backup/restic.env
    environment:
      PGHOST: postgres
      # libpq names, matched by backupd.sh, restore.sh and wal-g alike. The
      # password is NOT here: PGPASSWORD/PGPASSFILE arrive from wal-g.env,
      # which the runner must be able to read or the pass fails by name.
      PGUSER: marula
      PGDATABASE: marula
      PGDUMPS_DIR: /pgdumps
      BACKUP_SCRIPTS_DIR: /opt/backup
      # Restore drill (lane R6): every seventh pass, restore the dump just
      # written into a scratch database and assert it carries data. 0 turns it
      # off; the ledger row it writes is the record either way.
      DRILL_EVERY_DAYS: ${DRILL_EVERY_DAYS:-7}
      # The local object store is part of the backup: rows without their bytes
      # restore into a database whose attachments all 404. Mounted below.
      BACKUP_SOURCES: ${BACKUP_SOURCES:-/data/objects /pgdumps}
      # When OBJECT_STORE is the local none-mode, snapshot that dir too:
      # extra hosts: core-api shares /data/objects — mount the named coreapi volume
      # when it exists, else leave BACKUP_SOURCES unset for PG-only backups.
    env_file:
      - path: ./backup/wal-g.env
        required: false
      - path: ./backup/restic.env
        required: false
    volumes:
      - backupdumps:/pgdumps
      # Read-only: the runner snapshots the object store, it never writes it.
      - objectdata:/data/objects:ro
    command: ["/bin/sh", "/opt/backup/backupd.sh"]

volumes:
  pgdata:
  # The local object store (OBJECT_STORE=local). Named so it survives a
  # `down`, is snapshotted by the backup runner, and is visible to the worker's
  # integrity pass — three things a directory inside the container cannot be.
  objectdata:
  # PgBouncer's rendered auth file (F65): written by the `pooler-auth`
  # one-shot and read by the pooler. A volume, not a bind mount, so the file
  # is never a checked-in credential and a password change lands on the next
  # `up`.
  poolerauth:
  garagedata:
  garagemeta:
  clamavdata:
  backupdumps:
  tempodata:
  lokidata:
  promdata:
  uptimedata:
  ollamadata:

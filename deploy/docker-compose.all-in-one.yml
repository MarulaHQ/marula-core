# All-in-one demo / tiny-install override (Wave 49 lane R4).
#
# core-api runs the worker loops INSIDE its own process, so a small box boots
# three services instead of four. Layer it over the base file and start ONLY
# the listed services — the split `worker` service would fight core-api for
# port 8082:
#
#   docker compose \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.all-in-one.yml \
#     up -d postgres redis migrate core-api web
#
# See docs/all-in-one.md for the env contract and the trade-offs.
services:
  core-api:
    environment:
      MARULA_ALL_IN_ONE: "1"
      # Unpooled on purpose (Wave 52 lane P9): the command above starts three
      # application services and no pooler, and one instance's 54 connections
      # fit inside Postgres's default 100. Overriding the base file's pooled
      # URLs keeps the documented all-in-one boot working without it.
      DATABASE_URL: postgres://marula_app:${MARULA_APP_PASSWORD}@postgres:5432/marula
      MARULA_LISTEN_DATABASE_URL: postgres://marula_app:${MARULA_APP_PASSWORD}@postgres:5432/marula
      # OWNER role on purpose: the worker loops read across orgs and must
      # bypass row-level security. The API's own DATABASE_URL stays the
      # RLS-scoped app role.
      MARULA_WORKER_DATABASE_URL: postgres://marula:${POSTGRES_PASSWORD}@postgres:5432/marula
      # The Settings -> Self-host pane probes the embedded worker on
      # loopback; the compose service name (worker:8082) does not exist in
      # this topology.
      WORKER_INTERNAL_URL: http://127.0.0.1:8082
      # Small-install cadence profile (Wave 49 lane R6). This box has few
      # orgs and little job volume, so the fast worker idles mostly wake up
      # to find nothing. The cadence map and what each value trades are in
      # docs/worker-cadence.md. The live-push relay stays fast — it is not
      # in this set.
      EMAIL_POLL_SECS: "60"
      QUEUE_IDLE_MS: "60000"
      EVAL_INTERVAL_SECS: "300"
      TIME_AUDIT_POLL_SECS: "300"
      DELIVERY_POLL_SECS: "300"
      USAGE_REFRESH_SECS: "900"
      DIGEST_POLL_SECS: "3600"
      RETENTION_SWEEP_SECS: "86400"
      # The embedded loops include the backup-age sample (lane R7a), so the stamp
      # directory the `backup` profile writes has to be visible HERE, not only to
      # the split worker service.
      MARULA_BACKUP_STAMP_PATH: ${MARULA_BACKUP_STAMP_PATH:-/pgdumps/.last_success_epoch}
    # A sequence in a compose override REPLACES the base list instead of adding
    # to it — the same trap the ports list below documents — so the base object
    # volume is repeated, and the stamp directory is added beside it.
    volumes:
      - objectdata:/data/objects
      - backupdumps:/pgdumps:ro
    # The worker health endpoint binds 8082 inside this container alongside
    # the API on 8080, so publish both. A sequence in an override replaces
    # the base list, hence the repeat of 8080.
    ports:
      - "8080:8080"
      - "8082:8082"

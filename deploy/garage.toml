# Garage (S3-compat object storage) config for the marula stage2 compose slot.
# Single-node layout: create the cluster once after first start (commands in
# deploy/docker-compose.yml above the garage service).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
# No rpc_secret here on purpose. Garage reads GARAGE_RPC_SECRET from the
# environment, and compose requires that variable (32-byte hex, no default):
# a secret in this file is a secret in every deployment's container, because
# the file is bind-mounted read-only into it. See deploy/README.md.

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"

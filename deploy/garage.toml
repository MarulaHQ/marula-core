# Garage (S3-compat object storage) config for the meridian stage2 compose slot.
# Single-node layout: create the cluster once after first start (commands in
# deploy/docker-compose.yml above the garage service).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
# Dev secret must be 32-byte hex or Garage refuses to boot.
rpc_secret = "5ee1876f31b4a9ce1d2f6087c4e91ba9f0d8c3a25764b1e6892c40ada37f3102"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"

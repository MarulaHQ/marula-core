[package]
name = "unifi"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "First-party UniFi connector for Project Marula — site/controller inventory (network equipment → ConfigItems, ports → CiInterfaces) over the UniFi Network Integrations API v1, feeding the public feed-upsert seam, plus signed UniFi-alert forwarding (Apache-2.0)"

[dependencies]
adapters-core = { path = "../adapters-core" }
async-trait = { workspace = true }
ci-feeders = { path = "../ci-feeders" }
hmac = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }

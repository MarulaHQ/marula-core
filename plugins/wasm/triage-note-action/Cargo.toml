[package]
name = "triage-note-action"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

# Detached from the Marula workspace: plugin artifacts target
# wasm32-unknown-unknown and must never pollute the shared build cache.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
marula-pdk = { path = "../../../packages/plugin-kit/pdk/rust" }

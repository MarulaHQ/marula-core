[package]
name = "marula-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Double-clickable local Marula test app: embedded Postgres + core-api in a Tauri shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon (menu-bar tray quick actions) + image-png (bundled icon) for
# Wave 38 lane 2 multi-window/OS-integration work.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
postgresql_embedded = { version = "0.22", features = ["tokio"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http.workspace = true
hex.workspace = true
# The per-install loopback secret (Wave 54 lane S5a) comes from the OS CSPRNG.
rand.workspace = true
libc = "0.2"
core-api = { path = "../crates/core-api" }
core-db = { path = "../crates/core-db" }
core-store = { path = "../crates/core-store" }

[dev-dependencies]
# Scratch app-data dirs for the secret and printer-config tests.
tempfile = "3"

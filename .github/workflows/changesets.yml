# Changesets versioning for packages/* (the private build tracker U10b).
#
# On every push to main: consume pending changesets (`.changeset/*.md`) and
# open/refresh a "version packages" PR. Maintainers merge it to bump the
# TS packages ahead of the next tag. Publishing to a public registry is
# deliberately disabled (privatePackages.version only) — packages are
# consumed from the workspace today.
#
# Wave 52 lane `p52-ci-gates-restore` enabled this file. It is not a per-PR
# gate: its whole job is to act on main, where the pending changesets are
# consumed and the version PR is opened. It is cheap (an install plus one
# changesets invocation), so it needs no schedule of its own.

name: Changesets

on:
  push:
    branches: [main]

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is read-only in this repository's posture; the
# action has to push a branch and open the version PR, so the capability is
# declared here rather than inherited.
permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose: package.json's `packageManager`
      # (pnpm@12.16.1) is the single source of truth, and naming a version in
      # both places makes this action fail with "Multiple versions of pnpm
      # specified" before the first step of the job.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          # @changesets/cli is invoked via npx: not a root devDependency on
          # purpose (the workspace itself is not a publishable package).
          # v2 validates the CLI version and refuses to run against v2 of the
          # CLI, so the pin moves with the action — @changesets/cli@3 still
          # exports `./changelog`, which is what .changeset/config.json names.
          version-script: npx --yes @changesets/cli@3 version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # v2 reads the token from this input rather than the environment, and
          # its default is the workflow token; stated here so the capability the
          # `permissions:` block grants is visible at the step that uses it.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # v2 creates git tags (and releases) by default whenever a publish
          # happens. Nothing here publishes — publishing is deliberately off, per
          # the header — so both are pinned off rather than inherited from a
          # default whose meaning changed between major versions.
          push-git-tags: false
          create-github-releases: false

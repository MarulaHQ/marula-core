name: CodeQL

# Scheduled static analysis, deliberately not a per-push gate.
#
# Fourteen merge-blocking checks already run on every pull request. A
# code-scanning job there would put a second, slower queue in front of every
# change for findings that are not merge decisions. This workflow analyses the
# default branch on a weekly schedule and on demand, and reports to the
# repository's Security tab.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Test fixtures are not runtime key paths. `**/tests/**` covers the
          # integration crates (crates/*/tests, which run as their own
          # binaries) and `**/tests.rs` covers the sibling test modules
          # (plugins/connectors/*/src/tests.rs). Inline `#[cfg(test)] mod tests`
          # blocks inside a shipped file cannot be excluded by path, so CodeQL
          # keeps reporting those; they are dismissed with a reason instead of
          # being allowed to bury the real findings.
          config: |
            paths-ignore:
              - "**/tests/**"
              - "**/tests.rs"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

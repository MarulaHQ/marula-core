name: Nightly

# The slow half of the split (Wave 52 lane `p52-ci-gates-restore`): a schedule,
# not a merge. Everything here needs one of four things a per-push job cannot
# afford — a long clock (a saturated load loop, a 50k-row seed), a simulator or
# macOS minutes, a Docker daemon inside the job, or a signature database that
# has to download before it can answer.
#
# A red nightly is investigated in the next session, never shrugged off. It does
# not block a merge, which is exactly why the per-push set stays the place where
# correctness is decided.

on:
  schedule:
    - cron: "30 5 * * *" # ~05:30 UTC, before the workday pile-up
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Performance — the SQL path budget, the HTTP capacity budget, the 100k scale
  # measurement.
  # ---------------------------------------------------------------------------

  perf-smoke:
    name: Perf smoke — ticket-list p95 budget @50k tickets/org
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg18 — prod parity; the smoke measures the real
        # RLS-scoped ticket-list query path against this service DB.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_perf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # scripts/perf-smoke.sh sets MARULA_PERF_SMOKE=1 (the test is env-gated so
      # the plain `cargo test --workspace` sweep skips it). Budgets: 150ms p95
      # on the primary mixes; deep-page (OFFSET 40k) rides a 400ms regression
      # tripwire — see docs/perf.md.
      - run: ./scripts/perf-smoke.sh

  # HTTP capacity budget + scale measurement (Wave 15 lane 3; docs/perf.md §6).
  #
  # Gates ONE thing: perf-harness load --budget-ms at the budget scale
  # (50k tickets/org, saturated closed-loop, keyset mix p95 ≤ 150ms — the same
  # product budget the smoke enforces on the SQL path). The 100k scale leg is
  # measured and surfaced, not gated: at 100k the saturated closed loop is a
  # capacity observation, not a product budget (docs/perf.md §7).
  perf-load-budget:
    name: HTTP load budget — ticket list p95 @50k (saturated, keyset mix)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg18 — prod parity with the perf fixtures.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      # Privileged role for migrations + deterministic seeding.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_perf
      REDIS_URL: redis://localhost:6379
      # Dev-only CI constants: core-api refuses to boot without explicit values
      # since Wave 19 (fail-closed). They never leave this ephemeral runner.
      JWT_SECRET: 5d1a2f0b3c4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e
      MARULA_SECRET_KEY: 6e6808490009ad97fe176b954f03a7eeeca54af4e10c384c7beb7ce43e0e7b21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release build — a debug server would measure the build, not the stack.
      - run: cargo build --release -p core-api -p perf-harness
      - name: Seed the 50k budget dataset
        run: |
          ./target/release/perf-harness seed --tickets 50000
      - name: Boot core-api
        run: |
          # RLS-scoped app role (production parity): the superuser in the job env
          # would bypass every RLS policy and flatter the numbers.
          DATABASE_URL=postgres://marula_app:marula_app@localhost:5432/marula_perf \
            BIND_ADDR=127.0.0.1:18080 ./target/release/core-api &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health
      # The gate: saturated closed-loop (8 workers) with the keyset deep-page
      # mix. Measured 49.2ms p95 locally on the shipped schema (docs/perf.md §7);
      # budget = the product budget (150ms), shared with the smoke above.
      - name: Load run (concurrency 8, budget 150ms)
        run: |
          ./target/release/perf-harness load \
            --base-url http://127.0.0.1:18080 \
            --duration 30s --concurrency 8 --seed 42 --budget-ms 150 \
            --out load-report.json
      - name: Surface result
        if: always()
        run: |
          {
            echo "## Nightly HTTP load — ticket list @50k tickets/org"
            echo
            echo '| concurrency | throughput | p50 | p95 | p99 | max | within 150ms |'
            echo '|---|---|---|---|---|---|---|'
            python3 - <<'PY'
          import json
          d = json.load(open("load-report.json"))
          print(f"| {d['concurrency']} | {d['throughput_rps']:.0f} rps | {d['p50_ms']:.1f}ms | "
                f"{d['p95_ms']:.1f}ms | {d['p99_ms']:.1f}ms | {d['max_ms']:.1f}ms | "
                f"{'yes' if d['within_budget'] else 'NO'} |")
          print(f"\nrequests {d['requests']}, errors {d['errors']}, duration {d['duration_s']}s")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-load-report
          path: load-report.json
          retention-days: 30

  perf-scale-100k:
    name: Scale leg — 100k tickets/org measurement (non-gated)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      # Privileged role for migrations + deterministic seeding (100k).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_perf
      REDIS_URL: redis://localhost:6379
      # Dev-only CI constants (see perf-load-budget above).
      JWT_SECRET: 5d1a2f0b3c4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e
      MARULA_SECRET_KEY: 6e6808490009ad97fe176b954f03a7eeeca54af4e10c384c7beb7ce43e0e7b21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p core-api -p perf-harness
      - name: Seed the 100k load dataset
        run: |
          ./target/release/perf-harness seed --tickets 100000 --clients 1000 --users 25
      - name: Boot core-api
        run: |
          # RLS-scoped app role, same reason as the budget job.
          DATABASE_URL=postgres://marula_app:marula_app@localhost:5432/marula_perf \
            BIND_ADDR=127.0.0.1:18080 ./target/release/core-api &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health
      # Measurement-only: past 1× budget the saturated loop's own cost
      # (TCP/serializers/event delivery) is the dominant term, so the tripwire
      # is an order-of-magnitude guard, not the product budget.
      - name: Load measurement (concurrency 8, 600ms tripwire)
        run: |
          ./target/release/perf-harness load \
            --base-url http://127.0.0.1:18080 \
            --duration 30s --concurrency 8 --seed 42 --budget-ms 600 \
            --out scale-report.json
      - name: Surface the scale numbers
        if: always()
        run: |
          {
            echo "## Scale leg — 100k tickets/org (saturated, non-gated tripwire)"
            echo
            echo '| concurrency | throughput | p50 | p95 | p99 | max |'
            echo '|---|---|---|---|---|---|'
            python3 - <<'PY'
          import json
          d = json.load(open("scale-report.json"))
          print(f"| {d['concurrency']} | {d['throughput_rps']:.0f} rps | {d['p50_ms']:.1f}ms | "
                f"{d['p95_ms']:.1f}ms | {d['p99_ms']:.1f}ms | {d['max_ms']:.1f}ms |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-scale-report
          path: scale-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # End to end — the flows, both themes, and the axe baseline with them.
  # ---------------------------------------------------------------------------

  e2e:
    name: E2E — Playwright flows in light + dark + shipped presets, axe baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The flake budget (e2e/helpers/budget.ts) only retries in CI, and the
      # flake gate fails the run when more tests than the budget needed a retry.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS deps + Playwright browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # Boots its own per-run database and Valkey on random high ports and
      # writes e2e/.e2e-stack.env. No `services:` block: a service container on
      # the runner would be a second, unused stack. Nothing here hand-sets a
      # port or an API URL — Playwright's config reads the env file, and the
      # build script below inlines the same values.
      - name: Boot the seeded demo stack (migrate → seed-demo → core-api)
        run: ./scripts/e2e-stack.sh up
      # scripts/e2e-build-web.sh, not a bare `pnpm --filter build`: it sources
      # the stack env so NEXT_PUBLIC_API_URL cannot drift, and it copies
      # .next/static + public into the standalone root, without which every
      # chunk 400s.
      - name: Build the web app for the suite
        run: pnpm e2e:build-web
      - name: Lint the web app (design-system enforcement, @shadcn/lint)
        run: pnpm turbo run lint --filter @marula-core/web
      # Includes flows/axe-audit.spec.ts: known criticals live in
      # e2e/axe-baseline.json and a NEW one fails the run.
      - name: Run the flows in both themes
        run: pnpm exec playwright test --config=e2e/playwright.config.ts
      - name: Flake-gate verdict (budget from e2e/helpers/budget.ts)
        if: always()
        run: node e2e/flake-gate.ts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results/
            playwright-report/
          retention-days: 7
      - name: Tear the stack down
        if: always()
        run: |
          run_id="$(grep -m1 '^RUN_ID=' e2e/.e2e-stack.env | cut -d= -f2)"
          [ -n "$run_id" ] && ./scripts/e2e-stack.sh down "$run_id" || true

  # The third golden layer: the spec a RUNNING server serves equals the pin.
  # Layers 1 and 2 (derived handlers, SDK snapshot) run per push in
  # `ci.yml`; this one needs a migrated database, a booted api and a readiness
  # loop, which is why it is here.
  api-live-conformance:
    name: Live API conformance — served spec vs pinned golden
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
      REDIS_URL: redis://localhost:6379
      # Dev-only CI constants; core-api refuses to boot without them.
      JWT_SECRET: 5d1a2f0b3c4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e
      MARULA_SECRET_KEY: 6e6808490009ad97fe176b954f03a7eeeca54af4e10c384c7beb7ce43e0e7b21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Migrate schema
        run: cargo run -q -p marula-core-cli -- migrate
      - name: Boot core-api
        run: |
          BIND_ADDR=127.0.0.1:18080 cargo run -q -p core-api &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
      - name: Live spec must equal the pinned golden
        run: MARULA_API_BASE_URL=http://127.0.0.1:18080 cargo test -q -p marula-core-cli --test golden_openapi

  # ---------------------------------------------------------------------------
  # Upgrade path and coverage — long, and a merge rarely changes the answer.
  # ---------------------------------------------------------------------------

  upgrade-matrix:
    name: N−2 upgrade matrix — restore fixture → migrate to HEAD
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg18 — prod parity with the fixture capture.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_upgrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_upgrade
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One leg per captured fixture (v0.2.0 onward). Restoring replays the
      # full schema + data + migration state of the tagged release; migrating to
      # HEAD proves the forward path on production-like data.
      - name: Restore v0.2.0 fixture
        run: |
          gunzip -c fixtures/upgrades/v0.2.0.seed.sql.gz \
            | psql postgres://postgres:postgres@localhost:5432/marula_upgrade -v ON_ERROR_STOP=1 -q
      - name: Migrate fixture to HEAD
        run: cargo run -q -p marula-core-cli -- migrate
      - name: Fixture org survives the migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM custom_field_defs WHERE org_id = '00000000-0000-4000-8000-000000000001'" \
            | grep -q '^7$'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT 1 FROM board_statuses WHERE org_id = '00000000-0000-4000-8000-000000000001' AND category = 'closed'"
      - name: Upgrade preflight consumes the captured manifest
        run: |
          cargo build -q -p marula-core-cli
          ./target/debug/marula upgrade --check \
            --manifest fixtures/upgrades/v0.2.0.manifest.json

  domain-coverage:
    name: Domain-layer coverage ≥80% (crates/core-domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # SHA-pinned, carried from the retired `ga-gates.yml`.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      # Instrumentation rebuilds every crate it covers; that is the whole reason
      # this gate is nightly. An 80% floor on the domain layer barely moves on a
      # single pull request, and a red here is a trend to look at, not a merge to
      # stop.
      - name: Measure domain-layer coverage
        run: cargo llvm-cov -p core-domain --summary-only --fail-under-lines 80

  # ---------------------------------------------------------------------------
  # Scanners that need a daemon, a signature DB or a policy bundle.
  # ---------------------------------------------------------------------------

  container-security:
    name: Container security — trivy config scan over deploy/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose least-privilege lint (p38). The Dockerfiles themselves are
      # linted per push in `ci.yml` (`container-lint`): hadolint is a file lint
      # that takes seconds, while this one downloads a policy bundle.
      # SHA-pinned, carried from the retired `ga-gates.yml`.
      - name: Trivy config scan (deploy/ — compose least-privilege lint)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/
          severity: HIGH,CRITICAL
          exit-code: "1"

  # The opt-in clamd leg from Wave 52 lane `p6f-scan-gate`, on the schedule
  # rather than per push: it boots a container, waits for a signature database to
  # download (minutes, not seconds), and a scanner regression is not a merge
  # blocker. What it asserts is a REAL detection: the EICAR test file wrapped in
  # a ZIP, which is both an allowlisted attachment and something the daemon
  # actually finds. A PDF with the EICAR string appended is reported CLEAN by
  # ClamAV (the signature is a whole-file match), so it is not used as a fixture
  # anywhere in the leg.
  clamd-live:
    name: ClamAV — real clamd behind the scan doors (opt-in leg)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--doors` runs both legs: the adapter against the daemon (clean, EICAR,
      # the StreamMaxLength reply, an empty stream, the version) and the ticket,
      # document and vault doors through the real router, plus the stopped-daemon
      # 503. The script boots clamd by name (`marula-clamd-<run>`), waits for
      # zPING — which only answers once the signature DB is loaded — and removes
      # its own container on exit.
      - name: Daemon + door legs
        run: ./scripts/p6f-clamd-live.sh --doors

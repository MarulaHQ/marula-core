name: CI

# Per push and pull request — the set that decides whether a change may merge.
#
# Wave 52 lane `p52-ci-gates-restore` split the disabled workflow set in two.
# This file is the merge-blocking half: the checks that are fast, deterministic
# and machine-independent, so a red one is a defect in the change and not in the
# runner. Everything that needs a long clock, a simulator, or a saturated load
# loop moved to `nightly.yml`; the reasons per job live in `.github/workflows/README.md`.
#
# The rule for a job here: it runs in minutes, it fails the same way on a
# developer's machine, and a person can act on the red without asking what the
# machine was doing.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Keyed on the pull request number, then `github.ref` for pushes. Not
  # `github.ref` alone: on a pull_request that ref is `refs/pull/<n>/merge`,
  # which changes whenever the base branch moves, so a rebase started a SECOND
  # full matrix while the superseded one ran to the end. Not `head_ref` either:
  # that is only the branch name, so two forks with a `patch-1` branch would
  # cancel each other's runs.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The boundary rules this repository is published under. If this job is red,
  # the open core is not open.
  boundary:
    name: Boundary — no proprietary code, no entitlement checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the open/closed boundary
        run: ./scripts/check-boundary.sh

  rust:
    name: Rust — fmt · clippy · sqlx offline cache
    # `ubuntu-24.04`, not `ubuntu-latest`. `latest` moved to Ubuntu 26.04 on
    # 2026-10-19 (actions/runner-images#14748) and is still serving several
    # builds of it. On run 43773681904 this job landed on
    # `ubuntu26/20261111.82`, which came up with no Ubuntu archive sources at
    # all: `apt-get update` fetched only the Microsoft repository, and every
    # package it wanted failed as "Unable to locate". The identical step passed
    # eighty minutes earlier on `ubuntu26/20261111.196`, which had the archive
    # and `universe`.
    #
    # This job no longer installs distro packages: the GTK/WebKit header step
    # went with `installer`, which is now excluded (see the clippy step). The
    # pin stays because the Rust legs share cache keys now, and a shared cache
    # is only worth sharing between legs built on the same image build.
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg18 — the same major the compose files and
        # scripts/e2e-stack.sh run (PostgreSQL 18, pgvector 0.8). core-db
        # integration tests attach to THIS container through DATABASE_URL, so
        # no Docker-in-Docker is needed on the runner.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        # valkey/valkey:8-alpine — the tag scripts/e2e-stack.sh uses, so the
        # service container and a local stack are the same image.
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
      REDIS_URL: redis://localhost:6379
      # A 2-core runner is below the `standard` embedding tier's floor (4 cores),
      # and `Config::from_env_allow_dev_fallback` refuses to start rather than
      # silently under-provision the model — its own message names this lever.
      # Without it every test that builds a config panics before it asserts
      # anything (api_versioning: 5 tests at line 69).
      MARULA_EMBEDDING_TIER: minimal
    steps:
      - uses: actions/checkout@v7
      # Headroom is reported, not reclaimed. Measured over the last eight runs:
      # `Reclaim runner disk` cost 110-121s in each of its three jobs, and the
      # runner logged `145G total, 88G avail` before it ran. The largest target
      # dir recorded for a test job is 37 GB *after that job's own reclaim*, and
      # this job links nothing, so its own set is smaller still. The 22 GB the
      # reclaim freed was sized for the old 14 GB runner image.
      - name: Disk headroom
        run: df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Shared keys, in two families rather than one. `Swatinem/rust-cache`
      # puts the job id in its default key (`v0-rust-rust-tests-rest-…`), so
      # every Rust job wrote a cache of its own into a 10 GB per-repository
      # Actions budget and they evicted each other. The key also has to respect
      # the profile: `cargo test` compiles dependencies for `[profile.test]`
      # and clippy/check compile them for `[profile.dev]`, and one key can only
      # ever hold what its last writer built. Hence `rust-check` here and on the
      # job that only checks, and `rust-test` on the jobs that build test
      # binaries. `save-if` keeps the write to `main`, because a pull request's
      # key dies the moment it merges and writing it evicts the entry `main`
      # needs — so a PR only restores.
      #
      # Every job in a family writes the same key on `main`, and Actions caches
      # are immutable per key, so exactly one job's target dir lands and the
      # rest restore a partial match. That partial match is where most of the
      # benefit comes from; a per-job key would be warmer but would not fit the
      # 10 GB budget.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No sccache in this job. Wrapping clippy puts `clippy-driver` behind the
      # wrapper, which turns every lint invocation into a cache lookup whose
      # first hit is always a miss, on top of the incremental artifacts clippy
      # already reuses. Worth revisiting only if clippy becomes the long pole;
      # the three test jobs below carry it.
      - run: cargo fmt --all -- --check
      # Compile against the committed .sqlx metadata, not the service
      # container. The container's schema is empty until a step migrates it,
      # and the tests migrate at runtime through `sqlx::migrate!`, so a
      # compile that dials DATABASE_URL sees no tables: every `query!` macro
      # expanded to an error and the crate reported 1804 of them ("relation
      # mcp_capability_grants does not exist") — a missing schema wearing the
      # costume of a broken crate. The last step of this job is what keeps the
      # metadata honest: `cargo sqlx prepare --check` regenerates it from the
      # migrated schema and fails when it has drifted.
      # `marula-desktop` is a Tauri shell: on Linux it needs GTK headers the
      # runner does not carry (`glib-sys` dies in its build script), and it
      # ships as a macOS app built by `scripts/build-desktop.sh` (ADR 0005), so
      # it is not a Linux build target. Excluded by name rather than left to
      # fail the workspace, and still covered by `cargo fmt --all`.
      # `installer` is the other Tauri shell and is excluded for the same
      # reason, plus a measured one: the `apt-get install` that only it needed
      # took 42s once and then 589s, 809s and 1135s on network-bound runs, to
      # cover one test. Its clippy and that test live in `installer-lint.yml`,
      # which runs on the paths that actually touch the crate.
      - run: cargo clippy --workspace --exclude marula-desktop --exclude marula-installer --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      # The sweep lives in the three `rust-tests-*` jobs below, not here.
      # Trap this step closes: a `query!` edit without `cargo sqlx prepare`
      # passes a DB-online test run and then breaks every offline consumer
      # (developer builds, the Docker image build). `prepare --check` compares
      # the committed `.sqlx` metadata against what the macros generate from
      # the real schema, and exits 1 when it is stale.
      # SHA-pinned, the pin the retired `ga-gates.yml` already carried for this
      # action. If the release has no prebuilt binary for the runner, the action
      # falls back to `cargo install`; the step is slower, not different.
      - name: Install sqlx-cli (for the offline-metadata check)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: sqlx-cli@0.8.6
      - name: sqlx offline metadata is current
        run: |
          cargo sqlx migrate run --source crates/core-db/migrations
          # The args after `--` go straight to `cargo check`, so the exclusions
          # have to be repeated there — and `--exclude` is only legal beside
          # `--workspace` at that level, which is why the flag appears twice.
          cargo sqlx prepare --check --workspace -- --workspace --all-targets --exclude marula-desktop --exclude marula-installer

  frontend:
    name: Web — lint · types · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose: package.json's `packageManager`
      # (pnpm@12.16.1) is the single source of truth, and naming a version in
      # both places makes this action fail with "Multiple versions of pnpm
      # specified" before the first step of the job.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test

  # The sweep, split across runners. `core-api` alone declares 115 integration
  # targets, the rest of the workspace 84, and every binary statically links the
  # whole graph (wasmtime, cranelift, OpenSSL, webauthn, sqlx). One job's target
  # dir passed 37 GB — after the reclaim step above had already freed 22 GB —
  # and the linker died mid-write: GitHub logged "Free space left: 0 MB", rustc
  # reported "IO failure on output stream", and the linker aborted with a Bus
  # error that reads like a compiler crash (runs 40533170070, 40548490372).
  #
  # Two shards for the heavy crate and one job for the rest keeps each runner
  # well inside its disk, and runs the suite in parallel rather than serially.
  # Shard membership is computed from the test files present, so a new
  # integration test lands in a shard without anyone editing this file.
  rust-tests-core-api:
    name: Rust tests — core-api shard ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        # pgvector/pgvector:pg18 — the same major the compose files and
        # scripts/e2e-stack.sh run (PostgreSQL 18, pgvector 0.8). core-db
        # integration tests attach to THIS container through DATABASE_URL, so
        # no Docker-in-Docker is needed on the runner.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        # valkey/valkey:8-alpine — the tag scripts/e2e-stack.sh uses, so the
        # service container and a local stack are the same image.
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
      REDIS_URL: redis://localhost:6379
      # A 2-core runner is below the `standard` embedding tier's floor (4 cores),
      # and `Config::from_env_allow_dev_fallback` refuses to start rather than
      # silently under-provision the model — its own message names this lever.
      # Without it every test that builds a config panics before it asserts
      # anything (api_versioning: 5 tests at line 69).
      MARULA_EMBEDDING_TIER: minimal
      # sccache on R2, not the Actions cache. The Actions backend shares the
      # 10 GB per-repository budget with rust-cache and would evict the
      # target-dir entry it exists to complement; R2 has no such ceiling and no
      # egress charge. sccache objects are immutable and never rewritten, so the
      # bucket's lifecycle rule is the only GC — sccache evicts nothing on a
      # remote backend.
      #
      # The wrapper is guarded on a secret rather than set unconditionally: fork
      # pull requests (and Dependabot) never receive repository secrets, and
      # sccache with an endpoint but no credentials fails every compile. With
      # the guard those runs build unwrapped and stay green.
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: marula-ci-sccache
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      # A revoked key or an R2 outage must not brick the build. Without the
      # skip, the startup storage read aborts the server (`check()` bails on a
      # read error), and without the ignore, a failed read mid-compile is fatal
      # to that compile. With both, the build goes local and prints a warning;
      # the stats step is where a miss rate shows it.
      SCCACHE_SKIP_CACHE_CHECK: "1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # Static, not `${{ runner.os }}`: the `runner` context is not available in
      # a job-level `env:` block. Every Rust job builds x86_64 Linux here.
      SCCACHE_S3_KEY_PREFIX: sccache/linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Reported, not reclaimed: the runner logs 88G avail of 145G before the
      # reclaim this replaces ran, and the largest recorded test-job target dir
      # is 37 GB after its own reclaim. See the `rust` job.
      - name: Disk headroom
        run: df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `RUSTC_WRAPPER` sits under the default `RUST` env prefix, so it
          # would key this cache apart from `rls-coverage`, which runs no
          # sccache under the same `rust-test` key. A wrapper does not change
          # compiler output, so it does not belong in the key; the other
          # prefixes (CARGO, CC, CFLAGS, CXX, CMAKE) stay.
          env-vars: "CARGO CC CFLAGS CXX CMAKE"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # The action has no default version: without this it downloads
          # whatever sccache released most recently, so the caching path
          # would float independently of the pinned action.
          version: "v0.19.0"
      # Not nextest, and this is the measured reason: nextest runs one PROCESS
      # per test, while `tests/support/mod.rs` boots its schema once per process
      # from a `OnceCell` that drops and re-migrates `public`/`ops`. Under
      # nextest every test would drop the schema its siblings are querying.
      # The serial suites and the per-process env reads make the same point, so
      # the swap waits for a harness refactor.
      - name: core-api tests (shard ${{ matrix.shard }} of 2)
        env:
          SQLX_OFFLINE: "true"
        run: |
          # The target set has ONE owner: scripts/check-test-targets.mjs. A
          # hand-rolled `ls *.rs` here once dropped `tests/<dir>/main.rs` targets
          # from both shards, so a grouped suite would have been built by
          # nothing and run by nobody. The verify line below fails the build on
          # an unreachable or ambiguous target before the split happens.
          node scripts/check-test-targets.mjs
          mapfile -t targets < <(node scripts/check-test-targets.mjs --shard "${{ matrix.shard }}" --shards 2)
          args=()
          for target in "${targets[@]}"; do
            args+=(--test "$target")
          done
          echo "shard ${{ matrix.shard }}/2: ${#targets[@]} integration targets"
          if [ "${{ matrix.shard }}" = "1" ]; then
            cargo test -p core-api --lib "${args[@]}"
          else
            cargo test -p core-api "${args[@]}"
          fi
      - name: sccache stats
        if: always()
        # Diagnostic only: a missing or unhappy sccache must not turn a green
        # test run red after the fact.
        continue-on-error: true
        # `${SCCACHE_PATH}` is what the action exports; a bare `sccache` is not
        # guaranteed to be on PATH. The fallback keeps the step readable when
        # the action did not install anything.
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats

  rust-tests-rest:
    name: Rust tests — workspace except core-api
    # Pinned for the reason recorded on the `rust` job: the mixed 26.04 builds,
    # and one image build behind the shared cache key. The GTK/WebKit install
    # that used to be the second reason went with `installer` excluded.
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg18 — the same major the compose files and
        # scripts/e2e-stack.sh run (PostgreSQL 18, pgvector 0.8). core-db
        # integration tests attach to THIS container through DATABASE_URL, so
        # no Docker-in-Docker is needed on the runner.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        # valkey/valkey:8-alpine — the tag scripts/e2e-stack.sh uses, so the
        # service container and a local stack are the same image.
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
      REDIS_URL: redis://localhost:6379
      # A 2-core runner is below the `standard` embedding tier's floor (4 cores),
      # and `Config::from_env_allow_dev_fallback` refuses to start rather than
      # silently under-provision the model — its own message names this lever.
      # Without it every test that builds a config panics before it asserts
      # anything (api_versioning: 5 tests at line 69).
      MARULA_EMBEDDING_TIER: minimal
      # The same R2 configuration as `rust-tests-core-api`, recorded in full
      # there. The guard on `RUSTC_WRAPPER` is what keeps fork pull requests,
      # which receive no secrets, building unwrapped instead of failing.
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: marula-ci-sccache
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      # A revoked key or an R2 outage must not brick the build. Without the
      # skip, the startup storage read aborts the server (`check()` bails on a
      # read error), and without the ignore, a failed read mid-compile is fatal
      # to that compile. With both, the build goes local and prints a warning;
      # the stats step is where a miss rate shows it.
      SCCACHE_SKIP_CACHE_CHECK: "1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # Static, not `${{ runner.os }}`: the `runner` context is not available in
      # a job-level `env:` block. Every Rust job builds x86_64 Linux here.
      SCCACHE_S3_KEY_PREFIX: sccache/linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Reported, not reclaimed: the runner logs 88G avail of 145G before the
      # reclaim this replaces ran, and the largest recorded test-job target dir
      # is 37 GB after its own reclaim. See the `rust` job.
      - name: Disk headroom
        run: df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `RUSTC_WRAPPER` sits under the default `RUST` env prefix, so it
          # would key this cache apart from `rls-coverage`, which runs no
          # sccache under the same `rust-test` key. A wrapper does not change
          # compiler output, so it does not belong in the key; the other
          # prefixes (CARGO, CC, CFLAGS, CXX, CMAKE) stay.
          env-vars: "CARGO CC CFLAGS CXX CMAKE"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # The action has no default version: without this it downloads
          # whatever sccache released most recently, so the caching path
          # would float independently of the pinned action.
          version: "v0.19.0"
      # Not nextest: same blocker as `rust-tests-core-api` — nextest is
      # process-per-test and this job's harnesses boot their schema once per
      # process. core-db's per-test process model has not been verified either,
      # and core-db is 56 of the 133 targets.
      - run: cargo test --workspace --exclude marula-desktop --exclude core-api --exclude marula-installer --tests
        env:
          SQLX_OFFLINE: "true"
      # Doc tests compile and run one snippet at a time, so they never pile up
      # binaries the way the integration targets do.
      - run: cargo test --workspace --exclude marula-desktop --exclude marula-installer --doc
        env:
          SQLX_OFFLINE: "true"
      - name: sccache stats
        if: always()
        # Diagnostic only: a missing or unhappy sccache must not turn a green
        # test run red after the fact.
        continue-on-error: true
        # `${SCCACHE_PATH}` is what the action exports; a bare `sccache` is not
        # guaranteed to be on PATH. The fallback keeps the step readable when
        # the action did not install anything.
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats

  ui-gates:
    name: UI ratchets — shared chrome · theme packs · evidence writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `pnpm install`: all three checkers are stdlib-only. The theme-pack
      # checker imports `packages/ui/src/theme-tokens.ts` by path, which needs a
      # Node that strips types — 24 here, while the build jobs stay on 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Feature CSS injected into the shared stylesheet layer, and pages that
      # hand-roll their own <h1> block. Both ledgers may only SHRINK — a ratchet,
      # not a one-off cleanup (Wave 41 lane `p41-ui-chrome`).
      - name: Shared chrome boundary
        run: node scripts/check-shared-chrome.mjs
      # Every shipped theme preset's hexes against the docs/theme.md contrast
      # floors, and the fixed-axis rule: a preset may move neutrals, chrome and
      # the accent tint, never the brand semantics.
      - name: Theme-pack drift
        run: node scripts/check-theme-packs.mjs
      # A capture must write its own lane's evidence directory. The incident
      # behind it: a full Playwright sweep rewrote seven tracked files owned by
      # three other lanes (Wave 47 lane `p47-lane-env-hygiene`).
      - name: Evidence writes stay lane-local
        run: node scripts/check-evidence-writes.mjs
      # The desktop updater's trust anchor: a placeholder key, a key that is not
      # a minisign document, or a plaintext endpoint. Each one fails on the
      # user's machine after the release is out, which is too late to catch.
      - name: Desktop updater trust anchor
        run: |
          node scripts/check-desktop-trust.mjs --self-test
          node scripts/check-desktop-trust.mjs

  token-conformance:
    name: Token conformance — no colours outside the Marula token set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The one-brand doctrine (design spec §4.5): Core's theme is derived from
      # Marula's brand, so no component may define a colour — it imports the
      # token. This is a shrink-only ratchet: the ledger inside the script
      # records where raw hexes remain from before the token migration, any file
      # outside it is a violation outright. Pure grep, nothing to install.
      - run: ./scripts/check-token-conformance.sh

  migrations:
    name: Migration safety + customization cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No destructive change without --breaking, and no checksum drift.
      - run: ./scripts/check-migrations.sh
      # Policy §4.5 (folded in from the retired `ga-gates.yml`): a migration
      # that modifies a construct referenced by customization rows must carry
      # the in-transaction transform, declared with `-- customization-transform:`.
      - name: Customization-aware migration cross-check (U9)
        run: ./scripts/check-customization-crosscheck.sh

  # The two gates above read FILES. This pair replays production-shaped DATA:
  # a captured v0.2.0 fixture is restored, migrated to HEAD, and asserted to
  # survive with its customization rows intact, then the upgrade preflight runs
  # against the captured manifest. That is the forward path an operator walks,
  # and it is the one thing a migration PR can break without any file lint
  # noticing.
  #
  # Scoped rather than unconditional: a UI or docs change cannot move the
  # answer, and the job pays for a database restore, a migration run and a
  # `marula-core-cli` build. On a push to main there is no base branch to
  # compare against, so the matrix always runs — a merge is exactly where the
  # forward path from a shipped release can break.
  upgrade-scope:
    name: Upgrade matrix — is this change in scope?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      # No `fetch-depth: 0`: the remote base branch is fetched at depth 1 and
      # compared as a tree, which is all a two-dot diff needs. Cloning the full
      # history of this repository to answer one grep would cost more than the
      # job it gates.
      - id: scope
        name: Changed paths that can move the forward path
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "not a pull request — running the matrix"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF" HEAD)"
          echo "$changed"
          # Migrations and the runner that applies them; the CLI crate, where
          # both `migrate` and `upgrade --check` live (in `main.rs`, so the
          # crate is the narrowest honest unit); the captured fixtures.
          if echo "$changed" | grep -Eq '^(crates/core-db/(migrations|src)/|crates/marula-core-cli/src/|fixtures/upgrades/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "not in scope — no migration, runner or fixture changed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  upgrade-matrix:
    name: N−2 upgrade matrix — restore fixture → migrate to HEAD
    needs: upgrade-scope
    if: needs.upgrade-scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg18 — prod parity with the fixture capture.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_upgrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_upgrade
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Restoring replays the full schema + data + migration state of the
      # tagged release; migrating to HEAD proves the forward path on
      # production-like data.
      - name: Restore v0.2.0 fixture
        run: |
          gunzip -c fixtures/upgrades/v0.2.0.seed.sql.gz \
            | psql postgres://postgres:postgres@localhost:5432/marula_upgrade -v ON_ERROR_STOP=1 -q
      # `pg_dump` carries a database, not the cluster: the `meridian_app` role
      # that migration 0001 created on the captured installation is not in the
      # fixture, and migrations 0046-0113 grant to it by name. A real v0.2.0
      # host has the role (0001 made it there); this container starts with only
      # `postgres`, so the job puts it back before the forward path runs. 0114
      # creates `marula_app` itself, exactly as it does on every install.
      - name: Create the pre-rebrand app role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'meridian_app') THEN
              CREATE ROLE meridian_app LOGIN PASSWORD 'meridian_app';
            END IF;
          END
          $$;
          SQL
      - name: Migrate fixture to HEAD
        # `SQLX_OFFLINE` is load-bearing here, not an optimisation. The restore
        # above leaves a v0.2.0 schema in the database, and a compile that dials
        # `DATABASE_URL` validates every `query!` macro against it — so a HEAD
        # query naming a table or column added after v0.2.0 fails to compile,
        # and the gate dies before it migrates for a reason that has nothing to
        # do with the migration. Offline metadata is already proven current by
        # the `rust` job's `cargo sqlx prepare --check`.
        env:
          SQLX_OFFLINE: "true"
        run: cargo run -q -p marula-core-cli -- migrate
      - name: Fixture org survives the migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM custom_field_defs WHERE org_id = '00000000-0000-4000-8000-000000000001'" \
            | grep -q '^7$'
          # `EXISTS` rather than `SELECT 1 ...`: zero rows is not an error to
          # psql, so the plain form exits 0 on the data loss this step exists to
          # catch. `-tA` prints `t`/`f` and grep's exit code is the assertion.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT EXISTS (SELECT 1 FROM board_statuses WHERE org_id = '00000000-0000-4000-8000-000000000001' AND category = 'closed')" \
            | grep -qx 't'
      # Fails when the captured release's manifest and HEAD disagree about
      # where the upgrade stands — the operator's preflight, run before they
      # run it.
      - name: Upgrade preflight consumes the captured manifest
        env:
          SQLX_OFFLINE: "true"
        run: |
          cargo build -q -p marula-core-cli
          ./target/debug/marula upgrade --check \
            --manifest fixtures/upgrades/v0.2.0.manifest.json

  openapi-pins:
    name: OpenAPI pin format (compact minified snapshots, byte-identical pair — DX12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-openapi-pins.sh

  # Folded in from the retired `ga-gates.yml`. hadolint is a file lint: seconds,
  # no network policy bundle, and a Dockerfile edited in a PR is exactly the
  # thing that should fail in that PR. The trivy config scan over deploy/ used
  # to stay nightly; it is `container-security` below now, because the bundle it
  # downloads costs about a minute and a compose file edited in a PR is the same
  # argument as a Dockerfile.
  container-lint:
    name: Dockerfiles — hadolint (p38 supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No job builds these images, so a workspace member the Rust Dockerfile
      # never COPYs (the `installer` gap), or a path the narrowed web COPY set
      # no longer covers, stayed invisible until a clean-context build. The
      # script checks both Dockerfiles against the tree in milliseconds with no
      # Docker; `npm run docker:check` runs the same thing by hand (npm is
      # enough: the script has no dependencies, so no install step).
      - name: Image build contexts still cover what the builds read
        run: npm run --silent docker:check
      # `failure-threshold: error` matches what `release.yml` enforces on the
      # same files, and keeps this job honest on day one: Dockerfile.backup
      # carries three warnings (DL3018 twice, DL4006 once, apk pins and a pipe
      # without `SHELL -o pipefail`), which print in the log and do not block.
      # An error fails, as it does at release.
      - name: Hadolint the Rust image
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.rust
          failure-threshold: error
      - name: Hadolint the web image
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.web
          failure-threshold: error
      - name: Hadolint the backup image
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/backup/Dockerfile.backup
          failure-threshold: error

  # The chart is a published artifact: a hosted control plane renders its
  # values and Argo applies them, so a chart that only renders with the
  # in-repo defaults is a chart that fails at a customer install. The hosted
  # fixture is one values document in the shape that control plane emits; the
  # values schema catches a misspelled block. `helm lint` alone does not: it
  # prints the digest-pinning failure and still exits zero.
  chart:
    name: Helm chart — lint and the hosted values document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package the chart
        run: helm package deploy/helm/marula --destination dist
      - name: Render a hosted tenant
        run: helm template tenant-acme deploy/helm/marula -f deploy/helm/test/hosted-values.yaml > /dev/null
      - name: Render a suspended tenant
        run: |
          helm template tenant-acme deploy/helm/marula \
            -f deploy/helm/test/hosted-values.yaml \
            --set coreApi.replicaCount=0 \
            --set worker.replicaCount=0 \
            --set web.replicaCount=0 > /dev/null
      - name: The digest gate still refuses an unpinned image
        run: |
          if helm template tenant-acme deploy/helm/marula \
            -f deploy/helm/test/hosted-values.yaml \
            --set images.web.digest="" > /dev/null 2>&1; then
            echo "the chart rendered an unpinned image; digestPinningEnforced is not working" >&2
            exit 1
          fi

  # Two linters, because they read different files and the split is not obvious.
  #
  # hadolint (above) is a file lint: seconds, no policy bundle, and a Dockerfile
  # edited in a PR is exactly the thing that should fail in that PR.
  #
  # Trivy's config scan reads the Dockerfiles under deploy/ and adds what
  # hadolint does not check — a runtime stage that never drops root (DS-0002).
  # Two images start as root on purpose: the edge proxy binds 80/443 under a
  # NET_BIND_SERVICE exemption, and the postgres image inherits an entrypoint
  # that chowns the data directory before dropping to the `postgres` user.
  # `.trivyignore.yaml` exempts those two by path with the reason and an expiry,
  # so the rest of the tree stays honest.
  #
  # Trivy does NOT read compose files. Pointed at one it reports "Detected
  # config files num=0", so `privileged: true` in a compose file would pass it
  # untouched. `scripts/check-compose-hardening.mjs` is what covers those files,
  # and its `--self-test` is what keeps it from being a check that cannot fail.
  #
  # That checker is the one step in this file that needs an install: it reads
  # compose with the `yaml` parser rather than a regex, because the regex
  # version missed a trailing comment, flow style and a quoted key, then
  # reported a command string as configuration. The script header records both
  # rounds. The install costs about fifteen seconds against a warm pnpm store.
  container-security:
    name: Container security — trivy config scan over deploy/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compose hardening (trivy does not read compose files)
        run: |
          node scripts/check-compose-hardening.mjs --self-test
          node scripts/check-compose-hardening.mjs
      # SHA-pinned, carried from the retired `ga-gates.yml` as it stood.
      - name: Trivy config scan (deploy/ — Dockerfile misconfiguration)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  rls-pool-reads:
    name: RLS pool-read gate (no new unscoped &state.pool reads in routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every tenant read must ride an org-bound tx (set_org_and_user);
      # allowlisted pre-auth SECURITY DEFINER bridges and dev-tools surfaces are
      # the only raw-pool reads. A new pool-read fails review here.
      - run: ./scripts/check-rls-pool-reads.sh

  rls-coverage:
    name: RLS coverage (every user-data table has a policy)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg18 — prod parity. The gate runs the same
        # assert_rls_coverage check core-api performs at boot, as a standalone
        # test target: a migration that adds an org_id table without a policy
        # fails here, independent of server start. The test also creates a
        # policy-less probe table and expects the gate to flag it, so the
        # assertion cannot pass by being vacuous.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compile-time schema comes from .sqlx; this test migrates the container
      # itself before asserting, so runtime is unaffected.
      - run: cargo test -p core-db --test rls_coverage
        env:
          SQLX_OFFLINE: "true"

  rust-contract:
    # This display name is a required status check in the "Main" ruleset, which
    # matches contexts by exact string. Renaming it does not rename the
    # requirement: the required check simply never reports, and the pull request
    # waits on it forever. The live leg lives in the steps below, not in the
    # name.
    name: Rust contract — deprecation clock · API conformance · golden OpenAPI
    runs-on: ubuntu-24.04
    services:
      postgres:
        # api_versioning builds the real router and needs a database; the
        # live leg boots core-api on this one. The pinned-fixture suites need
        # none, but share the job because they answer one question: does the
        # pinned surface still match the code?
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marula_test
      REDIS_URL: redis://localhost:6379
      # A 2-core runner is below the `standard` embedding tier's floor (4 cores),
      # and `Config::from_env_allow_dev_fallback` refuses to start rather than
      # silently under-provision the model — its own message names this lever.
      # Without it every test that builds a config panics before it asserts
      # anything (api_versioning: 5 tests at line 69).
      MARULA_EMBEDDING_TIER: minimal
      # The same R2 configuration as `rust-tests-core-api`, recorded in full
      # there. This job recompiles core-api and the CLI that other jobs already
      # built, which is exactly the work a compiler cache can hand back.
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: marula-ci-sccache
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      # A revoked key or an R2 outage must not brick the build. Without the
      # skip, the startup storage read aborts the server (`check()` bails on a
      # read error), and without the ignore, a failed read mid-compile is fatal
      # to that compile. With both, the build goes local and prints a warning;
      # the stats step is where a miss rate shows it.
      SCCACHE_SKIP_CACHE_CHECK: "1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # Static, not `${{ runner.os }}`: the `runner` context is not available in
      # a job-level `env:` block. Every Rust job builds x86_64 Linux here.
      SCCACHE_S3_KEY_PREFIX: sccache/linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `RUSTC_WRAPPER` sits under the default `RUST` env prefix, so it
          # would key this cache apart from `rls-coverage`, which runs no
          # sccache under the same `rust-test` key. A wrapper does not change
          # compiler output, so it does not belong in the key; the other
          # prefixes (CARGO, CC, CFLAGS, CXX, CMAKE) stay.
          env-vars: "CARGO CC CFLAGS CXX CMAKE"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # The action has no default version: without this it downloads
          # whatever sccache released most recently, so the caching path
          # would float independently of the pinned action.
          version: "v0.19.0"
      # Fails when deprecations.json carries a construct past its
      # removal_target, or when a construct is gone before it (policy §8/U4).
      # Gate plus self-tests, no database.
      - name: Deprecation clock
        run: cargo test -p core-events --test deprecation_clock
        env:
          SQLX_OFFLINE: "true"
      # Contract probes generated from the COMMITTED pin: every path+method in
      # fixtures/openapi/v1/openapi.json is probed against the real router
      # (auth posture, versioning parity, existence sentinels). Drift in either
      # direction fails.
      - name: API contract probes from the pinned OpenAPI
        run: cargo test -q -p core-api --test documents_kb api_versioning
        env:
          SQLX_OFFLINE: "true"
      # Two of the three golden layers: the spec derived from the compiled
      # handlers equals the pin, and packages/sdk/openapi.json equals the pin.
      # The third layer — the spec a RUNNING server serves — is the last two
      # steps of this job.
      - name: Golden OpenAPI conformance (derived + SDK snapshot vs pin)
        run: cargo test -q -p marula-core-cli --test golden_openapi
        env:
          SQLX_OFFLINE: "true"
      # The third layer, and the one the other two cannot reach: a route can be
      # served without being in the derived document, and a document can be
      # derived that no handler answers on. It lives in this job rather than in
      # one of its own because the test binary is already built and the database
      # is already up — a second job would rebuild both to ask the same
      # question.
      - name: Boot core-api for the live contract check
        run: |
          cargo run -q -p marula-core-cli -- migrate
          # Build before booting. `cargo run` would compile inside the
          # background job, and a first build of the server outlasts the
          # readiness loop below — which would then report a healthy compile as
          # a dead server.
          cargo build -q -p core-api
          cargo run -q -p core-api > "$RUNNER_TEMP/core-api.log" 2>&1 &
          # `/readyz` is the readiness probe: it checks the database with a
          # bounded SELECT 1. `/livez` only says the process is answering, and
          # core-api does not serve `/healthz` — that is the worker's route.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/readyz || {
            echo "core-api never became ready — its log follows" >&2
            tail -n 40 "$RUNNER_TEMP/core-api.log" >&2
            exit 1
          }
        env:
          BIND_ADDR: 127.0.0.1:18080
          # Compile from the committed `.sqlx` metadata, not from the service
          # container. This step compiles `marula-core-cli` (which pulls in
          # `core-db`'s query macros) before it migrates anything, so a live
          # compile would validate every macro against an empty database and
          # die on the first missing relation. It has been passing on artifacts
          # left by the steps above, which is luck: a cold cache would have
          # failed it. The runtime connection still uses `DATABASE_URL`.
          SQLX_OFFLINE: "true"
          # core-api refuses to boot without explicit values for these four
          # (fail-closed since Wave 19; the machine-seam pair since Wave 55).
          # The first two are the secrets the server signs with; the second two
          # are the bearer and the send token of the worker↔api seam. A missing
          # one is a panic at boot, not a degraded server, which is why the
          # failure above this step is short and loud instead of a 60-second
          # timeout. Dev-only constants on an ephemeral runner, never a secret.
          JWT_SECRET: 5d1a2f0b3c4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e
          MARULA_SECRET_KEY: 6e6808490009ad97fe176b954f03a7eeeca54af4e10c384c7beb7ce43e0e7b21
          MARULA_INTERNAL_TOKEN: 4b1f8e2c9a7d6350f4e8b2a6c9d1357e0a4c8f2b6d9e1357a0c4e8f2b6d9357a
          EMAIL_INTERNAL_TOKEN: 8c3d7a1f5e9b2460d8c4a0f6e2b9d571c3f7a9e1d5b8c2f6a4e0d8b1c5f9a726
      # The same test target, with the live leg switched on: it is env-gated
      # (`MARULA_API_BASE_URL`) so an offline run skips it and prints why.
      - name: Live spec vs pin (the server that actually runs)
        run: MARULA_API_BASE_URL=http://127.0.0.1:18080 cargo test -q -p marula-core-cli --test golden_openapi
        env:
          SQLX_OFFLINE: "true"
      # `always()`: the numbers are the point of the cache, and a run that failed
      # in the live leg is the one whose hit rate someone will want to read.
      - name: sccache stats
        if: always()
        # Diagnostic only: a missing or unhappy sccache must not turn a green
        # test run red after the fact.
        continue-on-error: true
        # `${SCCACHE_PATH}` is what the action exports; a bare `sccache` is not
        # guaranteed to be on PATH. The fallback keeps the step readable when
        # the action did not install anything.
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats

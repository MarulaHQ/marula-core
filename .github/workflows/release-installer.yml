# Release installer — the per-platform release artifacts.
#
# One leg per supported platform builds the two things a release ships (the
# `marula` CLI and the installer app), assembles one directory per platform with
# `scripts/release/assemble.mjs`, and uploads it. A final job writes the
# manifest, checksums everything, and signs the checksums with the release key.
#
# Supported platforms are macOS arm64, Linux x64, Linux arm64 and Windows x64.
# Intel macOS is not built: a cold-cache leg took 53 minutes for the CLI and 35
# more for the installer app, past this job's limit, and a warm cache is not
# guaranteed on a new branch. The tracking issue records how to restore it.
#
# What this file does and does not do: the legs build every supported platform,
# the `publish` job writes the manifest and signs the checksums, and the `attach`
# job puts the files on the release page. Notes are not written here: a release
# page that does not exist yet is created as a DRAFT, because the changelog
# section and the signing posture are a person's words.
#
# Every secret this file reads lives OUTSIDE this repository, in the
# repository's Actions secrets. No key, password or certificate is committed,
# and none is inlined here. The names are the ones the Tauri ecosystem uses,
# so an operator moving from a Tauri-only pipeline recognises them:
#
#   macOS code signing + notarisation
#     APPLE_CERTIFICATE              base64 of the Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD     the .p12 password
#     APPLE_SIGNING_IDENTITY         "Developer ID Application: <Org> (<TEAMID>)"
#     APPLE_ID                       the Apple account that submits the notarisation
#     APPLE_PASSWORD                 that account's app-specific password
#     APPLE_TEAM_ID                  the Apple Developer team id
#
#   Windows Authenticode
#     WINDOWS_CERTIFICATE            base64 of the .pfx
#     WINDOWS_CERTIFICATE_PASSWORD   the .pfx password
#     WINDOWS_TIMESTAMP_URL          the RFC 3161 timestamp endpoint your CA
#                                    publishes (left empty means no timestamp)
#
#   Checksum signing (all platforms)
#     MARULA_CHECKSUM_SIGNING_KEY    the private half of the release SSH key
#                                    whose public half is in
#                                    release-keys/allowed_signers
#
#   Tauri's updater channel key, used only when the bundle is configured to
#   emit updater artifacts. This release config does not enable them (the
#   installer ships no updater endpoint, and inventing one would be a promise
#   nothing keeps), so the key is not required here:
#     TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# The signing gate states a posture instead of refusing to run: on a `v*.*.*`
# tag a leg signs when its platform's certificate is present, and otherwise
# bundles unsigned with a warning the release note repeats. A pull request or a
# branch push never reads the secrets. `sign=true` on a manual dispatch is the
# strict rehearsal: it fails and names what is missing.

name: Release installer

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "installer/**"
      - "crates/marula-core-cli/**"
      - "apps/installer/**"
      - "deploy/**"
      - "scripts/release/**"
      - ".github/workflows/release-installer.yml"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:
    inputs:
      offline:
        description: "Build the air-gapped bundle too (slow: builds every image)"
        type: boolean
        default: false
      sign:
        description: "Fail when a platform's signing secrets are missing (strict rehearsal)"
        type: boolean
        default: false
      images:
        description: "Build and publish the container images too (slow: about an hour)"
        type: boolean
        default: false

# Least privilege at the top, per job below (the p38 rule this repository
# already follows).
permissions: {}

# A release run must never be cancelled half way through a signing step.
concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The version every later job names its files with. On a tag it is the tag;
  # anywhere else it is the workspace version, which is what a PR build is
  # really testing.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGGED=true
          else
            VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n 1)
            TAGGED=false
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve a semver version (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"
          echo "release version $VERSION (tagged=$TAGGED)"

  # The scripts are cheap to check and are the part a PR can get wrong, so
  # they are checked on every run, before any runner spends minutes building.
  scripts:
    name: Release scripts — syntax, lint, and self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax and shellcheck
        run: |
          bash -n scripts/release/*.sh
          shellcheck -S warning scripts/release/*.sh
          # The bootstrap runs under whatever /bin/sh is: the docs have people
          # download it and run it with `sh`, and bash is not everywhere. POSIX
          # is the contract, so it is checked as POSIX.
          dash -n scripts/release/bootstrap-install.sh
          shellcheck -s sh -S warning scripts/release/bootstrap-install.sh
      # The release key is pinned in three places: the trust anchor, and the two
      # one-line bootstraps. A drift would leave one platform trusting a key the
      # others refuse, so the three are compared here rather than in review.
      - name: The pinned release key agrees everywhere
        run: |
          set -euo pipefail
          ANCHOR=$(grep -E '^releases@getmarula\.com ssh-' release-keys/allowed_signers | tail -n 1)
          SH=$(awk -F'"' '/^KEY_LINE=/{print $2}' scripts/release/bootstrap-install.sh)
          PS=$(awk -F"'" '/KeyLine = /{print $2}' scripts/release/bootstrap-install.ps1)
          if [ -z "$ANCHOR" ] || [ -z "$SH" ] || [ -z "$PS" ]; then
            echo "::error::could not read the pinned release key from the anchor, one bootstrap, or both"
            exit 1
          fi
          if [ "$SH" != "$ANCHOR" ] || [ "$PS" != "$ANCHOR" ]; then
            echo "::error::a bootstrap pins a different release key than release-keys/allowed_signers"
            exit 1
          fi
          echo "the pinned release key agrees with release-keys/allowed_signers"
      # The PowerShell bootstrap is parsed by PowerShell itself; there is no
      # shellcheck for it that runs here. pwsh ships on the ubuntu-24.04 image,
      # and a runner without it fails this step rather than skipping the check:
      # a syntax error in install.ps1 is otherwise found by a Windows user.
      - name: PowerShell syntax
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::pwsh is not on this runner, so scripts/release/bootstrap-install.ps1 cannot be parsed. Add PowerShell to the runner image or move this check to a job that has it."
            exit 1
          fi
          # shellcheck disable=SC2016 # single quotes are the point: $_ and
          # $errors belong to PowerShell, not to this shell.
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/release/bootstrap-install.ps1").Path, [ref]$null, [ref]$errors) | Out-Null; if ($errors -and $errors.Count -gt 0) { $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }; Write-Host "bootstrap-install.ps1 parses"'
      - name: Assembler and image scripts — syntax and self-test
        run: |
          node --check scripts/release/assemble.mjs
          node scripts/release/assemble.mjs --self-test
          node --check scripts/release/images.mjs
          node scripts/release/images.mjs --self-test

  # Workflow YAML is code, and the only place a typo in it is caught is the run
  # that needed it. actionlint reads the syntax, the expression contexts, the
  # job graph and (through shellcheck) the shell inside every `run:` block. The
  # image is pinned: a linter that changes under a release is its own hazard.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Lint every workflow
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  # The four application images, built in the same run as the bundle. This is
  # the wiring `docs/release-images.md` asks for: the digest map the images job
  # writes is an artifact of THIS run, which is what lets `publish` merge it into
  # the manifest. A separate dispatch leaves the digests in another run's
  # artifacts, where the manifest step cannot see them.
  #
  # Tags only, plus a manual run that asks for them. A pull-request or rehearsal
  # run has no release to publish. `-f images=true` rehearses this exact job
  # without a tag.
  images:
    name: Images
    needs: [version]
    if: ${{ needs.version.outputs.tagged == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.images == 'true') }}
    permissions:
      # The called workflow pushes to GHCR, and a called workflow can never hold
      # more than its caller grants.
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.version.outputs.version }}
    # A called workflow sees no secrets unless they are passed. Without these
    # the DHI login inside is skipped, silently.
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PAT_TOKEN: ${{ secrets.DOCKER_PAT_TOKEN }}

  build:
    name: Build — ${{ matrix.os }} ${{ matrix.arch }}
    # The images first: each platform archive carries the published digests in
    # its own `release.json`, because a user can download and install that
    # archive without the release set. A skipped images job (any run that is not
    # a tag and did not ask for them) does not hold the build back.
    needs: [version, images]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-15 # arm64
          - os: linux
            arch: x64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runner: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAGGED: ${{ needs.version.outputs.tagged }}
      # Compilation cache. The Actions cache above cannot carry this workflow
      # across pull requests: an entry is scoped to the branch that wrote it,
      # and `main` never runs this workflow (it triggers on tags and on pull
      # requests), so a fresh pull-request branch starts at "No cache found" and
      # rebuilds all ~840 crates in release with thin LTO — that is the measured
      # 1252s macOS CLI leg. R2 is not branch-scoped, so a unit one branch
      # compiled is a hit for the next one.
      #
      # The wrapper is guarded on a secret, not set unconditionally: a fork's
      # pull request never receives repository secrets, and sccache with an
      # endpoint but no credentials fails every compile.
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: marula-ci-sccache
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      # A revoked key or an R2 outage must not brick a release build: the skip
      # stops the startup storage check from aborting the server, and the ignore
      # turns a failed read mid-compile into a local compile with a warning.
      SCCACHE_SKIP_CACHE_CHECK: "1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # One prefix per platform and architecture, and one namespace per ref type.
      #
      # A pull request from a branch in this repository does receive the R2
      # secret, and sccache trusts whatever it finds under a key: an object one
      # build writes is compiled into the next without a content check. The
      # `publish` job signs what a tag build produces, so a pull request writes
      # `-preview` and can never author an object the tag leg compiles. The
      # trade is that a tag starts cold the first time, which is what a release
      # build already was.
      SCCACHE_S3_KEY_PREFIX: sccache/release-${{ matrix.os }}-${{ matrix.arch }}-${{ github.ref_type == 'tag' && 'release' || 'preview' }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-installer-${{ matrix.os }}-${{ matrix.arch }}
        # `RUSTC_WRAPPER` sits under rust-cache's built-in `RUST` env prefix, so
        # a non-empty value keys the cache apart from a run without the wrapper.
        # A wrapper does not change compiler output, so it does not belong in the
        # key. `env-vars` cannot express that — it appends to the built-in prefix
        # list rather than replacing it — so the wrapper is blanked for this step
        # only, because the action hashes a prefix only when its value is
        # non-empty.
        env:
          RUSTC_WRAPPER: ""

      # Pinned to the same version ci.yml uses. The action has no default
      # version: without it, the cached binary floats independently of the
      # action pin.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.19.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The bucket credential is scoped to the steps that compile, not to the
      # job: this job also imports the platform's signing certificate and runs
      # `tauri bundle`, and neither needs a cache credential in its environment.
      - name: Build the CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: cargo build --release -p marula-core-cli

      - name: Build the installer front-end
        run: pnpm --dir apps/installer build

      # Tauri links the platform's own webview. macOS has WebKit in the OS, which
      # is why this step is Linux-only: without these packages the build fails in
      # `webkit2gtk-sys`, and the error names a C header rather than the missing
      # package.
      - name: Install Tauri's Linux dependencies
        if: matrix.os == 'linux'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
            libjavascriptcoregtk-4.1-dev librsvg2-dev libssl-dev
            libayatana-appindicator3-dev patchelf

      - name: Build the installer app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: sccache stats
        if: always()
        # Diagnostic only: a missing or unhappy sccache must not turn a green
        # release build red after the fact. The action's own post step reports
        # the same numbers at the end of the job; this puts them next to the
        # builds they describe.
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # `${SCCACHE_PATH}` is what the action exports; a bare `sccache` is not
        # guaranteed to be on PATH.
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats

      # ── signing gate: fail closed on a tag, notice everywhere else ──────
      - name: Signing prerequisites
        id: signing
        shell: bash
        run: |
          set -u
          required=()
          case "${RUNNER_OS}" in
            macOS)
              required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
              ;;
            Windows)
              required=(WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD)
              ;;
            *)
              required=()
              ;;
          esac

          if [ "${TAGGED}" != "true" ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a tagged release, so this leg bundles unsigned. A tag bundles with whatever posture its certificates allow."
            exit 0
          fi

          # A tag no longer stops for a missing certificate. Without one, the leg
          # bundles unsigned: `tauri bundle --no-sign` skips its signing block and
          # nothing later signs the bundle. The certificate's own provenance is
          # not inspected, so a set certificate may be self-signed or CA-issued.
          # The leg says which posture it produced so the release note can repeat
          # it, and `sign=true` on a dispatch keeps the strict gate for a
          # rehearsal.
          strict=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.sign }}" = "true" ]; then
            strict=true
          fi

          missing=()
          if [ "${#required[@]}" -gt 0 ]; then
            for name in "${required[@]}"; do
              if [ -z "${!name:-}" ]; then
                missing+=("$name")
              fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$strict" = "true" ]; then
              printf '::error::sign=true and these signing secrets are missing: %s\n' "${missing[*]}"
              printf 'The strict gate refuses to rehearse a signed release without them.\n'
              exit 1
            fi
            echo "sign=false" >> "$GITHUB_OUTPUT"
            printf '::warning::No %s signing certificate in this run (missing: %s). Bundling unsigned; the release note must state this posture.\n' "${RUNNER_OS}" "${missing[*]}"
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          echo "signing prerequisites are present for ${RUNNER_OS}"

      # Every leg states the posture it produced, in the run summary where the
      # person cutting the release reads it. The release note repeats this line
      # for each platform, and a run that silently shipped unsigned would be the
      # one failure this step exists to prevent.
      - name: State the signing posture
        shell: bash
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            macOS)
              if [ "${SIGN}" = "true" ]; then POSTURE="signed and notarised"; else POSTURE="unsigned"; fi
              ;;
            Windows)
              if [ "${SIGN}" = "true" ]; then POSTURE="signed (certificate imported from WINDOWS_CERTIFICATE)"; else POSTURE="unsigned"; fi
              ;;
            *)
              POSTURE="not applicable (no platform signature)"
              ;;
          esac
          echo "- ${RUNNER_OS} ${{ matrix.arch }}: ${POSTURE}" >> "$GITHUB_STEP_SUMMARY"

      # macOS: import the Developer ID certificate into a throwaway keychain.
      # The keychain password is generated here; it protects a temporary file
      # on an ephemeral runner and is not a secret anyone has to keep.
      - name: Import the macOS signing certificate
        if: matrix.os == 'macos' && steps.signing.outputs.sign == 'true'
        shell: bash
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 20)
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      # Windows: import the .pfx and hand Tauri its thumbprint. Tauri signs with
      # a certificate in the store; the certificate itself never becomes a file
      # in the repository or an artifact.
      - name: Import the Windows signing certificate
        id: wincert
        if: matrix.os == 'windows' && steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Output "imported a signing certificate into Cert:\CurrentUser\My"

      # `tauri bundle` packages the binary `cargo build` just produced. The
      # CLI is invoked through the file pnpm installed, with the working
      # directory set to `installer/`, because the CLI resolves
      # `installer/tauri.conf.json` (and, on top of it, the platform-specific
      # `tauri.<os>.conf.json` that names this platform's bundle targets) from
      # the directory it runs in.
      - name: Bundle the installer
        shell: bash
        working-directory: installer
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: |
          set -euo pipefail
          ARGS=(bundle --ci)
          if [ "${SIGN}" != "true" ]; then
            ARGS+=(--no-sign)
          fi
          case "${RUNNER_OS}" in
            Windows)
              if [ -n "${THUMBPRINT:-}" ]; then
                TS=""
                if [ -n "${WINDOWS_TIMESTAMP_URL:-}" ]; then
                  TS=$(printf ',"timestampUrl":"%s"' "${WINDOWS_TIMESTAMP_URL}")
                fi
                CONFIG=$(printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256"%s}}}' \
                  "${THUMBPRINT}" "${TS}")
                ARGS+=(--config "$CONFIG")
              fi
              ;;
            Linux)
              # The .deb is the Linux bundle (see tauri.conf.json: the base
              # config names `deb` and no other target needs a tool the runner
              # does not have).
              ;;
          esac
          CLI=../node_modules/@tauri-apps/cli/tauri.js
          if [ ! -f "$CLI" ]; then
            echo "::error::$CLI is not here; pnpm did not install @tauri-apps/cli. Run 'pnpm install --frozen-lockfile' first."
            exit 1
          fi
          node "$CLI" "${ARGS[@]}"

      - name: Fetch the image digests
        # Present only on a run that published images (a tag, or a manual run
        # that asked for them). The archive carries them in its own manifest,
        # because a platform archive is downloaded and installed on its own.
        if: ${{ needs.images.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: marula-images
          path: ${{ runner.temp }}/image-digests

      - name: Assemble the release directory
        shell: bash
        run: |
          # The digests are an array: a Windows path must not be split or have
          # its backslashes eaten.
          images_args=()
          digests="${{ runner.temp }}/image-digests/images.json"
          if [ -f "$digests" ]; then
            images_args=(--images "$digests")
            echo "the archive's manifest will name the published image digests"
          fi
          node scripts/release/assemble.mjs \
            --version "$VERSION" \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --commit "$GITHUB_SHA" \
            --out dist/release \
            ${images_args[@]+"${images_args[@]}"}

      # A green link is not a working binary. OpenSSL is statically linked on
      # Windows, so there is no DLL to find — but a bundle that only compiled is
      # still a bundle that fails on the user's machine, and `--version` is the
      # cheapest test that can tell the difference.
      - name: The binary starts
        shell: bash
        run: |
          # A glob rather than `ls`: the name has no newlines today, and parsing
          # `ls` output is how a path with a space becomes a mystery.
          SUFFIX="${{ matrix.os }}-${{ matrix.arch }}"
          DIR=""
          for candidate in "dist/release/marula-"*"-$SUFFIX"; do
            DIR="$candidate"
            break
          done
          if [ -z "$DIR" ]; then
            echo "::error::no assembled release directory for ${{ matrix.os }}-${{ matrix.arch }}"
            exit 1
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then BIN="$DIR/marula.exe"; else BIN="$DIR/marula"; fi
          "$BIN" --version


      # The assembler computes the checksums; the CLI independently recomputes
      # one of them. Two implementations agreeing is the cheapest proof that
      # `marula artifact verify` will accept what a user downloads.
      - name: The release binary agrees with the assembler's checksums
        shell: bash
        run: |
          set -euo pipefail
          DIR="dist/release/marula-$VERSION-${{ matrix.os }}-${{ matrix.arch }}"
          BIN="$DIR/marula"
          [ -f "$BIN" ] || BIN="$DIR/marula.exe"
          FILE="$DIR/release.json"
          for path in "$BIN" "$FILE" "$DIR/SHA256SUMS"; do
            [ -f "$path" ] || { echo "::error::$path is missing from the assembled release"; exit 1; }
          done
          expected=$(awk -v name="release.json" '$2 == name { print $1; exit }' "$DIR/SHA256SUMS")
          actual=$("$BIN" artifact checksum "$FILE" | awk '{ print $1 }')
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::the assembler and the CLI disagree about release.json (assembler: '$expected', CLI: '$actual')"
            echo "If the CLI has no 'artifact checksum' subcommand yet, this step is the integration point that is missing."
            exit 1
          fi
          echo "both implementations agree: $actual"

      - name: Upload this platform's release
        uses: actions/upload-artifact@v7
        with:
          name: marula-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/release/marula-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}/
            dist/release/marula-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dist/release/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  # The air-gapped bundle. It builds every image the compose file references,
  # which is a full container build of the workspace per arch, so it runs on
  # the Linux legs only (the stack is a Linux-host story) and only when the
  # run is a release or someone asked for it.
  offline:
    name: Offline bundle — linux ${{ matrix.arch }}
    needs: [version, build]
    # The gate is stated rather than inherited. `build` succeeding is what makes
    # an offline bundle possible at all, and a skipped `images` job does not
    # skip this one — a build with a skipped need still runs.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.version.outputs.tagged == 'true' || github.event.inputs.offline == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # zstd ships with both Linux runner images (1.5.7 on ubuntu-24.04 and its
      # arm variant), so this installs nothing in the normal case. It used to run
      # apt unconditionally, which is how a mirror outage failed this leg on a
      # tag whose images had already published.
      - name: Ensure zstd
        uses: ./.github/actions/apt-install
        with:
          packages: zstd
          present: zstd

      # The assembled directory comes back from the build leg rather than
      # being rebuilt here: the offline bundle carries the same bytes the
      # online release ships.
      - name: Fetch the assembled release for this arch
        uses: actions/download-artifact@v8
        with:
          name: marula-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/release

      # The tree comes back through an artifact, and artifact transfer carries no
      # file modes: everything arrives 0644, the CLI and the two shell entry
      # points included. The published 0.6.1 air-gapped archive shows the result —
      # `marula` inside it at 0644 — and `install-offline.sh` refuses a bundle
      # whose CLI is not executable, so a bundle built from that tree could never
      # install. Unpacking the release's own archive puts back the modes the tree
      # was archived with, and that archive is what a downloader receives.
      - name: Unpack the assembled release for this arch
        run: |
          set -euo pipefail
          DIR="dist/release/marula-$VERSION-linux-${{ matrix.arch }}"
          if [ ! -f "$DIR.tar.gz" ]; then
            echo "::error::$DIR.tar.gz did not come back from the build leg"
            exit 1
          fi
          rm -rf "$DIR"
          tar -xzf "$DIR.tar.gz" -C dist/release
          (cd "$DIR" && sha256sum -c SHA256SUMS)
          test -x "$DIR/marula"

      # dhi.io refuses anonymous manifest requests from GitHub's addresses, and
      # an offline bundle has to carry the third-party images. The account is
      # free (Docker Hardened Images) and the two values are repository secrets.
      # `env` carries them into the `if` because the secrets context is not read
      # there, which is also what keeps a fork's PR from failing on the step.
      - name: Log in to Docker Hardened Images
        if: ${{ env.DHI_USER != '' }}
        env:
          DHI_USER: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Assemble the offline bundle
        run: |
          scripts/release/offline-bundle.sh \
            --version "$VERSION" \
            --os linux \
            --arch "${{ matrix.arch }}" \
            --release-dir "dist/release/marula-$VERSION-linux-${{ matrix.arch }}" \
            --out dist/release

      - name: Upload the offline bundle
        uses: actions/upload-artifact@v7
        with:
          name: marula-${{ needs.version.outputs.version }}-offline-linux-${{ matrix.arch }}
          path: dist/release/marula-${{ needs.version.outputs.version }}-offline-linux-${{ matrix.arch }}.tar.zst
          if-no-files-found: error
          retention-days: 14

  # One manifest, one combined checksum list, and a signature over the
  # per-platform lists. This is the only job that reads the release key, and it
  # fails closed: a tag without the key produces no signature, and an unsigned
  # checksum list is not something the bootstrap will accept.
  publish:
    name: Manifest and signatures
    needs: [version, build, offline, images]
    # `always()` plus explicit result checks, because `needs:` alone would skip
    # this job whenever a neighbour was skipped (a manual run that did not ask
    # for the offline bundle still gets a manifest and a signature, and a run
    # that is not a tag skips the images job).
    #
    # A FAILED images job is different from a skipped one: a tag then has no
    # digest map, and a manifest without digests describes a bundle that can only
    # be installed offline. That is a degraded release, so it is refused rather
    # than published quietly.
    if: ${{ always() && needs.build.result == 'success' && (needs.offline.result == 'success' || needs.offline.result == 'skipped') && (needs.images.result == 'success' || needs.images.result == 'skipped') && (needs.version.outputs.tagged == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true')) }}
    # The signing secret is an ENVIRONMENT secret, so this job declares the
    # environment that holds it. The environment carries required reviewers and a
    # tag-only deployment policy; without this line the secret resolves as empty
    # and the job fails closed, which is the right failure but a confusing one.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch every platform's artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: marula-*
          path: dist/release
          merge-multiple: true

      # The one-line entrances. Their asset names carry no version on purpose:
      # `releases/latest/download/install.sh` only resolves while the name never
      # changes. Each shipped copy is pinned to its own release, so a script
      # fetched from `releases/download/vX.Y.Z/` installs vX.Y.Z and cannot
      # disagree with the URL that served it; `latest` resolves through
      # GitHub's `/latest/download/` redirect to the newest release's own copy,
      # which names that release. `--version` and `MARULA_VERSION` (and
      # `-Version` on PowerShell) still override the pin.
      - name: Stage the one-line installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The pin is written into a sed script, so the value has to be a
          # plain semver: no `|` delimiter, no `&`, no quote in it, and no
          # newline, which grep would not catch because it matches per line
          # and sed would read as a second command.
          case "$VERSION" in
            '' | *[!0-9A-Za-z.+-]*)
              echo "::error::release version '$VERSION' contains a character a release version does not use"
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::release version is '$VERSION', which is not a plain semver, so the installers cannot be pinned to it"
            exit 1
          fi

          install -m 0755 scripts/release/bootstrap-install.sh dist/release/install.sh
          install -m 0644 scripts/release/bootstrap-install.ps1 dist/release/install.ps1

          # The repository copies keep `latest`: they belong to no release. Only
          # the staged copies name one. `|` is the sed delimiter because a
          # semver cannot contain it, and the version was checked above.
          sed -i.bak "s|VERSION=\"\${MARULA_VERSION:-latest}\"|VERSION=\"\${MARULA_VERSION:-$VERSION}\"|" dist/release/install.sh
          sed -i.bak "s|else { 'latest' }|else { '$VERSION' }|" dist/release/install.ps1
          rm -f dist/release/install.sh.bak dist/release/install.ps1.bak
          test -x dist/release/install.sh
          test -s dist/release/install.ps1

          # A sed that matched nothing still exits 0, so the result is checked
          # rather than the exit status: the version is in, the bare default is
          # gone, and each file still parses.
          grep -Fq "VERSION=\"\${MARULA_VERSION:-$VERSION}\"" dist/release/install.sh \
            || { echo "::error::the staged install.sh does not carry the pinned version $VERSION"; exit 1; }
          if grep -Fq "VERSION=\"\${MARULA_VERSION:-latest}\"" dist/release/install.sh; then
            echo "::error::the staged install.sh still resolves 'latest', so a versioned URL would install a different release than it names"
            exit 1
          fi
          grep -Fq "else { '$VERSION' }" dist/release/install.ps1 \
            || { echo "::error::the staged install.ps1 does not carry the pinned version $VERSION"; exit 1; }
          if grep -Fq "else { 'latest' }" dist/release/install.ps1; then
            echo "::error::the staged install.ps1 still resolves 'latest', so a versioned URL would install a different release than it names"
            exit 1
          fi
          dash -n dist/release/install.sh
          # The staged PowerShell file is parsed by PowerShell itself, the same
          # way the scripts job parses the source. A runner without pwsh fails
          # here rather than skipping the check.
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::pwsh is not on this runner, so the staged install.ps1 cannot be parsed. Add PowerShell to the runner image or move this check to a job that has it."
            exit 1
          fi
          # shellcheck disable=SC2016 # single quotes are the point: $_ and
          # $errors belong to PowerShell, not to this shell.
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "dist/release/install.ps1").Path, [ref]$null, [ref]$errors) | Out-Null; if ($errors -and $errors.Count -gt 0) { $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }; Write-Host "install.ps1 parses"'

          printf 'staged install.sh (%s bytes) and install.ps1 (%s bytes), pinned to %s\n' \
            "$(wc -c < dist/release/install.sh)" "$(wc -c < dist/release/install.ps1)" "$VERSION"

      - name: Write the manifest and the combined checksum list
        run: |
          set -euo pipefail
          # The digests ride in the manifest the checksum list covers and the
          # release key signs, so they have to be merged before this step writes
          # either. An images job publishes them here as dist/release/images.json.
          images_args=()
          if [ -f dist/release/images.json ]; then
            images_args=(--images dist/release/images.json)
            echo "the manifest will name the published image digests"
          else
            echo "::notice::no dist/release/images.json in this run, so the manifest names no images and a bundle built from it cannot pull published ones"
          fi
          node scripts/release/assemble.mjs --manifest \
            --version "${{ needs.version.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --out dist/release \
            ${images_args[@]+"${images_args[@]}"}

      - name: Drop the digests file once the manifest carries it
        run: |
          # images.json is an input to the manifest, not an asset. Its content is
          # now in release.json, which SHA256SUMS covers and the release key
          # signs; leaving the file here would publish a second, unsigned copy.
          rm -f dist/release/images.json

      - name: Sign the checksum lists with the release key
        env:
          MARULA_CHECKSUM_SIGNING_KEY: ${{ secrets.MARULA_CHECKSUM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MARULA_CHECKSUM_SIGNING_KEY}" ]; then
            echo "::error::MARULA_CHECKSUM_SIGNING_KEY is missing. A release whose checksums are not signed cannot be verified, so nothing is published."
            exit 1
          fi
          ANCHOR="$GITHUB_WORKSPACE/release-keys/allowed_signers"
          if ! grep -Eq '^[[:space:]]*[^#[:space:]]' "$ANCHOR" 2>/dev/null; then
            echo "::error::release-keys/allowed_signers carries no release key, so the signature this job produces could not be verified by anyone. Add the maintainer's public key line first; RELEASING.md names the command. Nothing is published until then."
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/release-key"
          printf '%s\n' "$MARULA_CHECKSUM_SIGNING_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          cd dist/release
          # The manifest is signed on its own, not only through the checksum
          # list: `marula update` verifies a signature over release.json's bytes,
          # so a release whose manifest had no .sig could be installed and never
          # updated.
          for target in SHA256SUMS-* SHA256SUMS release.json; do
            case "$target" in
              *.sig) continue ;;
            esac
            [ -f "$target" ] || { echo "::error::$target is missing, so it cannot be signed"; exit 1; }
            ssh-keygen -Y sign -f "$KEY" -n file "$target"
            ssh-keygen -Y verify \
              -f "$ANCHOR" \
              -I releases@getmarula.com -n file -s "$target.sig" < "$target" >/dev/null
            echo "signed and re-verified $target.sig"
          done

      - name: Verify the signed list the way a user would
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum -c SHA256SUMS
          ssh-keygen -Y verify -f "$GITHUB_WORKSPACE/release-keys/allowed_signers" \
            -I releases@getmarula.com -n file -s SHA256SUMS.sig < SHA256SUMS
          ssh-keygen -Y verify -f "$GITHUB_WORKSPACE/release-keys/allowed_signers" \
            -I releases@getmarula.com -n file -s release.json.sig < release.json

      - name: Summarise what is on this run
        run: |
          {
            echo "## Marula ${{ needs.version.outputs.version }}"
            echo
            echo "| file | bytes |"
            echo "| --- | --- |"
            find dist/release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tar.zst' -o -name '*.sig' -o -name 'SHA256SUMS*' -o -name 'release.json' \) \
              -exec ls -l {} \; | awk '{ printf "| %s | %s |\n", $9, $5 }' | sort
            echo
            echo "The attach job puts these files on the release page, creating it"
            echo "as a draft when it does not exist yet. Writing the notes from the"
            echo "changelog and pressing publish stay with the maintainer."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release set
        uses: actions/upload-artifact@v7
        with:
          name: marula-${{ needs.version.outputs.version }}-release
          path: dist/release
          if-no-files-found: error
          retention-days: 30

  # The files exist as a workflow artifact by now; this job puts them where a
  # user looks for them. It attaches files and nothing else: the changelog
  # section and the platform signing posture are a person's words, so a release
  # page that does not exist yet becomes a DRAFT with a note saying what it
  # needs, never a published page with placeholder prose.
  attach:
    name: Attach the assets to the release
    needs: [version, publish]
    if: ${{ needs.version.outputs.tagged == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The one job that writes to the repository: uploading release assets.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the release set
        uses: actions/download-artifact@v8
        with:
          name: marula-${{ needs.version.outputs.version }}-release
          path: dist/release

      - name: Attach the files to the release page
        run: |
          set -euo pipefail
          # A failed lookup is not a missing release: an auth or network error
          # must fail the step, because `gh release create` would then fail on
          # an existing release and stop before anything is uploaded.
          view_error=""
          if ! view_error=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.tag_name' 2>&1 >/dev/null); then
            case "$view_error" in
              *"HTTP 404"*)
                gh release create "$TAG" --verify-tag --draft \
                  --title "Marula Core ${VERSION}" \
                  --notes "Draft created by the release workflow. Paste the CHANGELOG section here, state the platform signing posture for each platform, then publish. The files are attached already."
                echo "::warning::Created $TAG as a draft with the assets attached. Add the CHANGELOG section and publish it."
                ;;
              *)
                printf '::error::could not read the release for %s: %s\n' "$TAG" "$view_error"
                exit 1
                ;;
            esac
          fi
          # Files only: `dist/release` also holds one unpacked directory per
          # platform, and those are the archive's content, not an asset.
          assets=()
          while IFS= read -r file; do assets+=("$file"); done < <(find dist/release -maxdepth 1 -type f | sort)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no files to attach in dist/release"; exit 1; }
          # --clobber makes a re-run idempotent: same files, same names, no
          # duplicate assets, and the checksum list still covers them.
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "attached ${#assets[@]} file(s) to $TAG"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort

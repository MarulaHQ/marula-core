name: Release desktop

# Desktop client artifacts (W61-2, extended by ADR 0031).
#
# macOS ships the embedded app (ADR 0005): Postgres, core-api and the Next
# standalone tree inside the bundle. Linux and Windows ship the connected
# client: the same shell, pointed at an instance at first run, with no embedded
# database. That is a scope decision, not a missing step, and the platform
# configs say so in the bundle description.
#
# Unproven while F89 blocks CI: no job here has run. The first run must be a
# manual dispatch on a branch, not a tag.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Desktop — ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: linux
            arch: x64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runner: windows-2025
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-${{ matrix.os }}-${{ matrix.arch }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri's Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      # macOS assembles the embedded app: the script stages the Next standalone
      # tree into desktop/resources/web and writes the .app by hand, because the
      # Tauri CLI's bundler does not carry that resource tree.
      - name: Build the embedded macOS app
        if: matrix.os == 'macos'
        env:
          MARULA_DESKTOP_APP_DIR: dist
        run: bash scripts/build-desktop.sh

      # Linux and Windows are the connected client. The CLI reads
      # desktop/tauri.<os>.conf.json on top of the base config, which is what
      # names this platform's bundle targets. Nothing is staged because there is
      # no embedded tree in these builds.
      - name: Build the connected client
        if: matrix.os != 'macos'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          ARGS=(build --ci)
          if [ "${RUNNER_OS}" = "Windows" ] && [ -n "${WINDOWS_CERTIFICATE:-}" ]; then
            ARGS+=(--config '{"bundle":{"windows":{"certificateThumbprint":"'"${WINDOWS_CERTIFICATE}"'"}}}')
          fi
          node ../node_modules/@tauri-apps/cli/tauri.js "${ARGS[@]}"

      - name: Package the macOS app
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          OUT="Marula-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent "dist/Marula.app" "$OUT"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Collect the Linux and Windows bundles
        if: matrix.os != 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SUFFIX="${{ matrix.os }}-${{ matrix.arch }}"
          for pattern in \
            "target/release/bundle/deb/*.deb" \
            "target/release/bundle/appimage/*.AppImage" \
            "target/release/bundle/nsis/*-setup.exe" \
            "target/release/bundle/msi/*.msi"; do
            for file in $pattern; do
              [ -e "$file" ] || continue
              cp "$file" "dist/$(basename "$file" .deb)-${SUFFIX}.$(basename "$file" | sed 's/.*\.//')"
            done
          done
          test -n "$(ls -A dist)" || { echo "::error::the build produced no bundle"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/Marula.app
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

# install-e2e — install a published release the way a person does.
#
# The installer's registry mode had no end-to-end test. The plan and the wizard
# are covered by unit tests, and nothing ever pulled the published images, ran
# the bundle's own script and asked `marula doctor` whether the result works.
# That gap is where "the command finished" and "the install works" drifted apart.
#
# Two triggers, both deliberate:
#
#   * `release: published` runs it against the release that just went out. A
#     release page whose artifacts cannot install is not a release.
#   * `workflow_dispatch` re-runs it against any published version, so a broken
#     release can be re-checked after the registry or a base image is fixed
#     without cutting another tag.
#
# What it downloads is what a self-hoster downloads: the platform archive and its
# one-line checksum, from the release page, over the network. Nothing is taken
# from the workflow's own artifacts, because a test that installs a different
# artifact than the product ships proves nothing.
#
# Three jobs, because a release has three front doors. `install` pulls the
# published digests and installs the way a connected host does. `offline` installs
# the air-gapped archive, whose images travel inside it, and asserts that the
# install already has every image it needs — the readable half of "installs with
# the network off", since a runner cannot be disconnected without killing the job.
# That job's own comment says exactly what it asserts and what it leaves alone.
# `one-line` starts where a reader starts: the URL in the README, run as printed.
# The other two unpack an archive first, so neither would notice a redirect that
# serves the wrong script or a URL that stopped existing.
#
# `upgrade` is the fourth: it installs the previous release, then installs this one
# over it with the same `--dir`, because the installer is also the upgrade path and
# nothing checked that a second run replaces the first rather than refusing.

name: Install E2E

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to install, without the leading v (e.g. 0.6.0)"
        type: string
        required: true
      runner:
        description: "Runner label to install on"
        type: string
        default: ubuntu-24.04
      from:
        description: "Release to upgrade from, without the leading v. Default: the newest published release older than the target, with a Linux archive"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.event.inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  install:
    name: Install ${{ github.event.inputs.version || github.event.release.tag_name }} on Linux
    # `published` also fires for a prerelease, and a suffixed version is not what
    # this gate is about: the stable release page is.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a release version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Download the published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${VERSION}" \
            --repo "$GH_REPO" \
            --dir dist \
            --pattern "marula-${VERSION}-linux-x64.tar.gz" \
            --pattern "SHA256SUMS-linux-x64" \
            --pattern "SHA256SUMS-linux-x64.sig"

      - name: Verify the checksum list's signature
        shell: bash
        run: |
          set -euo pipefail
          # The checksum proves integrity over the same TLS channel the archive
          # came down. The signature is what proves the release key produced the
          # list, and the trust anchor is the one in this checkout.
          ssh-keygen -Y verify \
            -f release-keys/allowed_signers \
            -I releases@getmarula.com \
            -n file \
            -s dist/SHA256SUMS-linux-x64.sig \
            < dist/SHA256SUMS-linux-x64

      - name: Verify the archive against the published checksum
        shell: bash
        run: |
          set -euo pipefail
          # The one-line list is shaped for `sha256sum -c`, and it names the
          # archive exactly as the release page does.
          (cd dist && sha256sum -c "SHA256SUMS-linux-x64")

      - name: Unpack it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "dist/marula-${VERSION}-linux-x64.tar.gz" -C dist
          test -x "dist/marula-${VERSION}-linux-x64/install.sh"

      - name: Make room for the stack
        shell: bash
        run: |
          set -euo pipefail
          # The image has about 14 GB free, and the leg installs the split shape:
          # four application images plus Postgres, Valkey and the rest, with the
          # layer unpacking on top. The toolchains below are the runner's, not
          # ours, and nothing in this job uses them.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # The install pulls the hardened images from dhi.io, and dhi.io refuses
      # anonymous manifest requests from GitHub's addresses: the first release
      # attempt failed here with `unauthorized: Unauthorized`. The credentials are
      # the free Docker Hardened Images account, held as repository secrets.
      #
      # This makes the leg test the installer rather than the registry's opinion
      # of a CI address. Whether a *user's* host needs the same login is a
      # separate question, and an open one: #112.
      - name: Log in to Docker Hardened Images
        if: ${{ env.DHI_USER != '' }}
        env:
          DHI_USER: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Install from the published digests, then the compose path
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/install-e2e.sh \
            "dist/marula-${VERSION}-linux-x64" \
            "${RUNNER_TEMP}/marula-install"

      - name: What was running, when it fails
        if: failure()
        shell: bash
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          for name in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$name")"
            docker logs --tail 60 "$name" 2>&1 || true
            echo "::endgroup::"
          done

  # The air-gapped leg. It downloads the archive that carries its own images,
  # verifies it against the combined checksum list, unpacks it and installs from
  # it, then looks for evidence that the install tried to reach a registry —
  # which the wave's wording ("installs with the network off") means in practice
  # on a machine that still has one. `scripts/install-e2e.sh --offline` is where
  # the three readings are taken and where the limits of each are written down.
  #
  # The list it checks is the combined `SHA256SUMS`, not `SHA256SUMS-linux-x64`:
  # the per-platform list is written from the one online archive, so the
  # air-gapped archive appears only in the combined list that `publish` writes
  # over every asset it publishes.
  offline:
    name: Air-gapped install ${{ github.event.inputs.version || github.event.release.tag_name }} on Linux
    if: ${{ !github.event.release.prerelease }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Repeated rather than shared with the job above: an output would need a
      # third job to produce it, and this check is eight lines that fail the
      # same way in both places.
      - name: Resolve the version
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a release version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Download the air-gapped archive and the combined checksum list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${VERSION}" \
            --repo "$GH_REPO" \
            --dir dist \
            --pattern "marula-${VERSION}-offline-linux-x64.tar.zst" \
            --pattern "SHA256SUMS" \
            --pattern "SHA256SUMS.sig"

      - name: Verify the checksum list's signature
        shell: bash
        run: |
          set -euo pipefail
          # Same key, same anchor, different list: this is the file that names
          # the archive below, so it is the one whose signature has to hold.
          ssh-keygen -Y verify \
            -f release-keys/allowed_signers \
            -I releases@getmarula.com \
            -n file \
            -s dist/SHA256SUMS.sig \
            < dist/SHA256SUMS

      - name: Verify the archive against the combined checksum list
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The combined list describes the whole release page, so it names files
          # this job never downloaded; `sha256sum -c` over all of it would fail on
          # them, and `--ignore-missing` would pass without checking the one line
          # that matters. Take the archive's own line and insist it is the only
          # one, so a list that lost it fails loudly instead of checking nothing.
          line="marula-${VERSION}-offline-linux-x64.tar.zst"
          awk -v name="$line" '$2 == name' dist/SHA256SUMS >dist/offline.sum
          cat dist/offline.sum
          test "$(wc -l <dist/offline.sum)" -eq 1 || {
            echo "::error::$line is not listed exactly once in the combined SHA256SUMS"
            exit 1
          }
          (cd dist && sha256sum -c offline.sum)

      - name: Unpack it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || sudo apt-get install -y zstd
          tar --zstd -xf "dist/marula-${VERSION}-offline-linux-x64.tar.zst" -C dist
          bundle="dist/marula-${VERSION}-offline-linux-x64"
          test -x "$bundle/install-offline.sh"
          # The archive wraps the release directory and carries the images beside
          # it. Checking only for `install-offline.sh` would let a bundle that
          # lost `images.tar` reach the install and fail there instead.
          test -f "$bundle/images.tar"
          test -f "$bundle/images.list"
          test -d "$bundle/marula-${VERSION}-linux-x64"

      - name: Make room for the stack
        shell: bash
        run: |
          set -euo pipefail
          # The image has about 14 GB free, and this leg installs the same split
          # shape as the online one: four application images plus Postgres, Valkey
          # and the rest, unpacked from `images.tar` rather than pulled. The
          # toolchains below are the runner's, not ours.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Neither the load nor the start needs dhi.io: `images.tar` carries every
      # image and `install-offline.sh` inspects each one before it hands over to
      # the installer. The login stays anyway. It cannot make this leg pass,
      # because the script fails the job if the daemon records any pull at all.
      # And where the online job turns a registry refusal into "the install
      # failed", this one turns a missing image into a successful pull that the
      # assertion then names — the clearer of the two diagnoses.
      - name: Log in to Docker Hardened Images
        if: ${{ env.DHI_USER != '' }}
        env:
          DHI_USER: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Install from the images the archive carries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/install-e2e.sh --offline \
            "dist/marula-${VERSION}-offline-linux-x64" \
            "${RUNNER_TEMP}/marula-offline"

      - name: What was running, when it fails
        if: failure()
        shell: bash
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          for name in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$name")"
            docker logs --tail 60 "$name" 2>&1 || true
            echo "::endgroup::"
          done

  # The front door. Everything above starts from an unpacked archive; a reader
  # starts from a URL. This leg runs the published one-liner exactly as the page
  # shows it, then asks the stack it installed whether it works.
  #
  # Which URL is deliberate: on a release it is `/install/latest/linux`, because
  # the thing that just shipped is what `latest` must resolve to. On a dispatch it
  # is the versioned URL, so re-checking an older release does not test whatever
  # happens to be newest. Both are the same redirect chain and the same script.
  one-line:
    name: One-line install ${{ github.event.inputs.version || github.event.release.tag_name }} on Linux
    if: ${{ !github.event.release.prerelease }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a release version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Make room for the stack
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Log in to Docker Hardened Images
        if: ${{ env.DHI_USER != '' }}
        env:
          DHI_USER: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Run the advertised one-liner
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            url='https://getmarula.com/install/latest/linux'
          else
            url="https://getmarula.com/install/v${VERSION}/linux"
          fi
          scripts/one-line-e2e.sh "$url" "${RUNNER_TEMP}/marula-one-line" "$VERSION"

      - name: What was running, when it fails
        if: failure()
        shell: bash
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          for name in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$name")"
            docker logs --tail 60 "$name" 2>&1 || true
            echo "::endgroup::"
          done
  # The upgrade path. The installer is what a user runs to move versions, so this
  # leg installs one release, installs the next over the same directory, and
  # checks that the running image actually changed — an installer that left the
  # old container alone would still answer /readyz.
  upgrade:
    name: Upgrade ${{ inputs.from && format('v{0}', inputs.from) || 'the previous release' }} to ${{ github.event.inputs.version || github.event.release.tag_name }} on Linux
    if: ${{ !github.event.release.prerelease }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the two versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RAW_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
          RAW_FROM: ${{ inputs.from }}
        shell: bash
        run: |
          set -euo pipefail
          to="${RAW_VERSION#v}"
          if ! printf '%s' "$to" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$to' is not a release version"
            exit 1
          fi
          # Compare dotted versions as numbers. `sort -V` is GNU-only, and the
          # repository also publishes 0.10.0-style versions where a string
          # comparison would order "0.9.0" after "0.10.0".
          version_lt() {
            local -a a b
            local i
            IFS=. read -r -a a <<<"$1"
            IFS=. read -r -a b <<<"$2"
            for i in 0 1 2; do
              if (( 10#${a[i]} < 10#${b[i]} )); then return 0; fi
              if (( 10#${a[i]} > 10#${b[i]} )); then return 1; fi
            done
            return 1
          }

          if [ -n "${RAW_FROM:-}" ]; then
            from="${RAW_FROM#v}"
            if ! printf '%s' "$from" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$from' is not a release version"
              exit 1
            fi
            # A named release is held to the same rules as a discovered one. A
            # draft or a prerelease is not a predecessor anyone installs, and a
            # release with no Linux archive would fail in the download step with
            # a message about a missing file rather than about a wrong pair.
            if ! meta=$(gh api "repos/${GH_REPO}/releases/tags/v${from}" \
              --jq '[.draft, .prerelease, ([.assets[].name] | join(","))] | @tsv'); then
              echo "::error::could not read release v${from}: $meta"
              exit 1
            fi
            IFS=$'\t' read -r is_draft is_prerelease named_assets <<<"$meta"
            if [ "$is_draft" = "true" ] || [ "$is_prerelease" = "true" ]; then
              echo "::error::v${from} is a draft or a prerelease: this leg tests an upgrade between published releases"
              exit 1
            fi
            case ",${named_assets}," in
              *",marula-${from}-linux-x64.tar.gz,"*) ;;
              *)
                echo "::error::v${from} carries no marula-${from}-linux-x64.tar.gz asset"
                exit 1
                ;;
            esac
          else
            # The highest published release strictly older than the target that
            # carries a Linux archive: 0.5.0 never published, and an earlier tag
            # with no assets is not something anyone can install.
            #
            # `--paginate` walks the whole history and returns each release with
            # its assets, so a page limit cannot hide the predecessor and a
            # failed lookup cannot read as "this release has no archive".
            # Drafts, prereleases and the `desktop-v*` releases are filtered
            # here; a prerelease sitting between the target and its stable
            # predecessor is stepped over rather than selected and refused.
            if ! releases=$(gh api --paginate \
              "repos/${GH_REPO}/releases?per_page=100" \
              --jq '.[] | select((.draft | not) and (.prerelease | not)) | [.tag_name, ([.assets[].name] | join(","))] | @tsv'); then
              echo "::error::could not list the published releases: $releases"
              exit 1
            fi
            from=""
            while IFS=$'\t' read -r tag asset_list; do
              [ -n "$tag" ] || continue
              candidate="${tag#v}"
              # A server release, not a desktop one and not a codename.
              [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              # Strictly older: the list's order is by creation time, not
              # version, so a patch cut after a newer release must not be
              # mistaken for one above the target.
              version_lt "$candidate" "$to" || continue
              case ",${asset_list}," in
                *",marula-${candidate}-linux-x64.tar.gz,"*) ;;
                *) continue ;;
              esac
              if [ -z "$from" ] || version_lt "$from" "$candidate"; then
                from="$candidate"
              fi
            done <<<"$releases"
            if [ -z "$from" ]; then
              echo "::notice::no published release older than v${to} carries a Linux archive, so there is no upgrade pair to test"
              echo "skip=1" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! printf '%s' "$from" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$from' is not a release version"
            exit 1
          fi
          # A named `from` that is not older would run this leg as a downgrade or a
          # reinstall and still pass, which is not the thing it claims to test.
          if ! version_lt "$from" "$to"; then
            echo "::error::'v${from}' is not older than 'v${to}': this leg tests an upgrade"
            exit 1
          fi
          echo "from=$from" >>"$GITHUB_OUTPUT"
          echo "to=$to" >>"$GITHUB_OUTPUT"
          echo "upgrade pair: v${from} -> v${to}"

      - name: Fetch and verify both releases
        if: ${{ steps.versions.outputs.skip != '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        shell: bash
        run: |
          set -euo pipefail
          for v in "$FROM" "$TO"; do
            mkdir -p "dist/$v"
            gh release download "v${v}" --repo "$GH_REPO" --dir "dist/$v" \
              --pattern "marula-${v}-linux-x64.tar.gz" \
              --pattern "SHA256SUMS-linux-x64" \
              --pattern "SHA256SUMS-linux-x64.sig"
            ssh-keygen -Y verify \
              -f release-keys/allowed_signers \
              -I releases@getmarula.com \
              -n file \
              -s "dist/$v/SHA256SUMS-linux-x64.sig" \
              < "dist/$v/SHA256SUMS-linux-x64"
            (cd "dist/$v" && sha256sum -c "SHA256SUMS-linux-x64")
            tar -xzf "dist/$v/marula-${v}-linux-x64.tar.gz" -C "dist/$v"
          done

      - name: Make room for the stack
        if: ${{ steps.versions.outputs.skip != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Log in to Docker Hardened Images
        if: ${{ steps.versions.outputs.skip != '1' && env.DHI_USER != '' }}
        env:
          DHI_USER: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Install the older release, then upgrade over it
        if: ${{ steps.versions.outputs.skip != '1' }}
        env:
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/upgrade-e2e.sh \
            "dist/${FROM}/marula-${FROM}-linux-x64" \
            "dist/${TO}/marula-${TO}-linux-x64" \
            "${RUNNER_TEMP}/marula-upgrade"

      - name: What was running, when it fails
        if: failure()
        shell: bash
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          for name in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$name")"
            docker logs --tail 60 "$name" 2>&1 || true
            echo "::endgroup::"
          done

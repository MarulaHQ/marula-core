name: Docs release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify the website docs lock
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEBSITE_DISPATCH_TOKEN:-}" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not set; skipping docs dispatch" >&2
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${WEBSITE_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MarulaHQ/marula-hq/dispatches \
            -d "{\"event_type\":\"docs-release\",\"client_payload\":{\"product\":\"psa\",\"version\":\"${VERSION}\",\"sha\":\"${SHA}\"}}"

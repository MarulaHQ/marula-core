# Release images — the four application images a registry install pulls.
#
# Purpose: build `marula-core-api`, `marula-worker`, `marula-migrate` and
# `marula-web` for both architectures, push them to GHCR by version tag, read
# each digest back, and hand the digests to the manifest step as one
# `images.json`. A bundle whose manifest carries those digests is what lets
# `--images registry` install without a person copying four values out of a
# signed document.
#
# One runner per image AND architecture, each on its own native machine:
# `ubuntu-24.04` for amd64 and `ubuntu-24.04-arm` for arm64. The two legs push
# `<version>-<arch>` tags, and a `publish` leg per service joins them with
# `buildx imagetools create`. Nothing is emulated. The previous shape built both
# architectures in one job under QEMU, and the emulated Rust compile ran past the
# 90-minute job limit while the web image finished in four minutes.
# `scripts/release/images.mjs --matrix` plans the legs, so the runner pairing
# lives in one place instead of in this file and cannot drift.
#
# `scripts/release/images.mjs` does the building, tagging and digest reading, so
# this file holds no image logic.
#
# What this file deliberately does NOT do: write the release manifest, sign
# anything, or attach artifacts to a GitHub Release. The digests land as a
# workflow artifact named `marula-images`, which the release workflow's
# `marula-*` download picks up as `dist/release/images.json`; the manifest step
# merges them before it writes `SHA256SUMS`, and the release key signs that list.
#
# Run it by hand first. `workflow_dispatch` exists so the first push can be
# proved on one release before a tagged run depends on it:
#
#   gh workflow run release-images.yml -f version=0.3.1
#
# GHCR packages created by a token push are PRIVATE, even in a public
# repository. After the first run, set all four packages to public in the
# package settings, or a self-hoster's pull fails with `unauthorized` and no
# clue why. The run summary repeats this.

name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag (semver, no leading v)"
        type: string
        required: true
      platforms:
        description: "Architectures to build"
        type: string
        default: "linux/amd64,linux/arm64"
  workflow_call:
    inputs:
      version:
        description: "Release version to tag (semver, no leading v)"
        type: string
        required: true
      platforms:
        description: "Architectures to build"
        type: string
        default: "linux/amd64,linux/arm64"

# Least privilege at the top, then `packages: write` only where it is pushed.
permissions: {}

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

env:
  # GHCR refuses upper case, so this stays lower case even though the org's
  # display name is not. `images.mjs` defaults to the same value; it is set here
  # so a fork can point at its own org with one edit.
  IMAGE_BASE: ghcr.io/marulahq

jobs:
  # The legs and their runners come from `images.mjs --matrix`, which refuses an
  # architecture it has no native runner for. Planning here rather than in a
  # matrix literal keeps the runner pairing next to the self-test that proves it.
  plan:
    name: Plan the build legs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Plan one leg per service and architecture
        id: matrix
        run: |
          echo "matrix=$(node scripts/release/images.mjs --matrix --platforms "${{ inputs.platforms }}")" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.service }} (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No QEMU: the runner's own architecture is the one being built. The
      # script refuses a second platform here, so a leg cannot silently return
      # to emulation.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds and pushes this architecture's tag. `--tag-suffix` makes the
      # leg's tag, and no digest is recorded: the installer pins the joined
      # manifest, which `publish` mints below.
      - name: Build the ${{ matrix.arch }} leg
        run: |
          node scripts/release/images.mjs \
            --version "${{ inputs.version }}" \
            --image-base "$IMAGE_BASE" \
            --platform "${{ matrix.platform }}" \
            --tag-suffix "${{ matrix.arch }}" \
            --service "${{ matrix.service }}"

  # Joins the legs into the multi-arch manifest an installer pulls, then reads
  # that manifest's digest back. A missing leg fails here, where the service is
  # named, rather than in an install that cannot pin it.
  publish:
    name: Publish ${{ matrix.service }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, worker, migrate, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the legs and record the digest
        run: |
          node scripts/release/images.mjs \
            --version "${{ inputs.version }}" \
            --image-base "$IMAGE_BASE" \
            --platforms "${{ inputs.platforms }}" \
            --service "${{ matrix.service }}" \
            --publish \
            --digests "images-${{ matrix.service }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.service }}
          path: images-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect the digests
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: images-*
          path: digests
          merge-multiple: true

      # This is the file the release workflow looks for. A partial set fails
      # here, where the list of what is missing is on screen, rather than in an
      # install that cannot pin one service.
      - name: Join the leg outputs into one map
        run: |
          node scripts/release/images.mjs --merge digests --digests images.json
          cat images.json

      - uses: actions/upload-artifact@v7
        with:
          name: marula-images
          path: images.json
          if-no-files-found: error
          retention-days: 30

      - name: Say what to do with the packages
        run: |
          {
            echo "### Images published for ${{ inputs.version }}"
            echo
            echo '```'
            cat images.json
            echo '```'
            echo
            echo "GHCR packages created by a token push are private. Open the"
            echo "package settings for all four and set visibility to public, or"
            echo "an install that pulls them fails with \`unauthorized\`."
          } >> "$GITHUB_STEP_SUMMARY"

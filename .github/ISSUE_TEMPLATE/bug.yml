name: Bug report
description: Something in Marula Core is broken or behaves unexpectedly
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **redact client and tenant data** — names, emails,
        phone numbers, ticket contents — before pasting logs or screenshots.

        **Security vulnerabilities go to [SECURITY.md](https://github.com/MarulaHQ/marula-core/blob/main/SECURITY.md), never a public issue.**

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag, image tag, or commit SHA you are running.
      placeholder: v0.3.1 — or 3f2a1b9
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Self-hosted — Docker / Compose
        - Self-hosted — Kubernetes / Helm
        - Built from source
        - Other (say which below)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the exact steps. A numbered list that a stranger can follow is worth ten paragraphs.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors (redacted)
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed tenant data from everything pasted above
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md)
          required: true

[workspace]
resolver = "2"
members = [
    "desktop",
    "installer",
    "crates/core-api",
    "crates/core-billing",
    "crates/core-db",
    "crates/core-decision",
    # Perf program test infra (Wave 13 lane 8): reproducible seed generator,
    # ticket-list p95 measurement, HTTP load runner, CI perf smoke.
    "crates/perf-harness",
    "crates/core-documents",
    "crates/core-domain",
    "crates/core-events",
    "crates/core-kb",
    "crates/core-mail",
    # Wave 32 lane 7: the distance/duration provider seam (RoutingProvider
    # trait + registry + NONE-mode heuristic + OSRM/ORS + the out-of-tree
    # HTTP contract adapter). Public support crate, Apache-2.0, consumed by
    # core-api and by first-party/relay provider packs.
    "crates/core-routing",
    "crates/core-otel",
    "crates/core-projects",
    "crates/core-reports",
    "crates/core-store",
    "crates/mcp-server",
    "crates/worker",
    "crates/plugin-host",
    "crates/marula-core-cli",
    # Wave 9 adapters lane: first-party Apache-2.0 connector crates
    # (public-API-only edge adapters; separate license from the AGPL core).
    # All first-party extensions live under plugins/ (ADR 0013): connectors
    # are HTTP adapters, wasm/ holds the Extism plugins.
    "plugins/connectors/qbo-export-sync",
    "plugins/connectors/xero-export-sync",
    # DMS sync-connector lane (2026-09-10): external documentation-system
    # adapter (Hudu exports + generic REST), public-API-only.
    "plugins/connectors/dms-sync",
    # CI feeder lane (Wave 12 lane 8, ADR 0003 CI7): configuration-item
    # feeder adapters (NinjaOne) writing through ConfigSourceLink over the
    # public feed-upsert seam, public-API-only.
    "plugins/connectors/ci-feeders",
    # Adapters tranche 2 (Wave 12 lane 9): shared live-REST transport
    # primitives (vendor auth, native pagination, org→client mapping)
    # + the M365 Graph live connector.
    "plugins/connectors/adapters-core",
    "plugins/connectors/m365-graph",
    "plugins/connectors/app-bridges",
    # Wave 22 lane 3 (ecosystem/SDK review): UniFi inventory connector
    # + the 3CX agentic call-control adapter riding the VoIP seam.
    "plugins/connectors/unifi",
    "plugins/connectors/threecx",
    # Wave 32 lane 7 (p32-dispatch-routing): first-party Mapbox routing
    # provider (ADR 0013 standard set) behind the core-routing seam.
    "plugins/connectors/mapbox",
    # Wave 47 lane A11 (p47-cloudflare-plugin): reference Cloudflare DNS &
    # edge posture connector (ADR 0013 standard set) behind the custom-domain
    # DNS-record-management seam.
    "plugins/connectors/cloudflare",
]

# Shipped server binaries (core-api, worker, marula-core-cli) build with this
# profile and land in the deploy/ images, so anything left in the artifact is
# paid for on every pull. Release defaults keep the symbol table. Measured on
# one tree with thin LTO on both sides: core-api goes from 111,211,608 bytes to
# 91,348,656, so the symbols alone are 19.9 MB of a shipped artifact (17.9%).
# Thin LTO rides along for cross-crate codegen; its own size effect is not
# measured here, only that benefit.
#
# Two things are deliberately left alone. opt-level stays at the default 3,
# because core-api is a hot request path and `s`/`z` need a run through the
# harness in docs/perf.md before the saving can be called free. panic stays
# `unwind`, because `abort` would break catch_unwind in the tower/tokio stack.
# Neither belongs in a change that is otherwise a build-flag edit.
#
# Backtraces from these images resolve to addresses, not names. That is the
# trade `profile.desktop` already makes below, for the same reason.
[profile.release]
strip = "symbols"
lto = "thin"

# Profiling keeps the symbols. docs/perf.md measures release-built core-api, and
# a flamegraph without function names answers nothing, so the workflow that
# needs them gets a profile that differs from release by exactly that one key:
# same codegen, same LTO, names intact. Profile with it; measure budgets on
# release, as docs/perf.md does.
[profile.profiling]
inherits = "release"
strip = "none"

# Desktop lane (2026-09-13, ADR 0005): lighter release profile for the
# double-clickable Marula test app. opt-level=2 + thin LTO instead of
# the default release settings keeps link times and .app size down —
# desktop startup latency and incremental rebuilds matter more than the
# last few percent of throughput that fat LTO buys a server binary.
[profile.desktop]
inherits = "release"
opt-level = 2
lto = "thin"
strip = "symbols"

# DX6 disk guardrail (2026-09-16): parallel lanes build dev/test artifacts into
# ONE shared target dir, so every duplicate artifact generation carried a full
# set of debug binaries (~2.5GB per core-api cycle — 46GB of deps/ across a
# single day). Dev/test builds now carry line tables only (backtraces and
# breakpoints still work, variable inspection is degraded) and dependence on
# debuginfo is capped at 1 for dependencies. Release/desktop profiles are
# untouched. Reclaims the bulk of the per-cycle cost measured on the
# p15-core-gate-green test loop.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# DX6d (2026-09-17): test binaries don't need any debuginfo by default —
# each of the ~97 integration test binaries carries the full core-api link
# (~126MB each before this). Panic backtraces still resolve frames by
# address (--release-style); to debug a test in lldb/rust-gdb temporarily
# override with `RUSTFLAGS="-C debuginfo=1" cargo test` or flip this to
# "line-tables-only". Runtime is unaffected; only symbolication fidelity.
[profile.test]
debug = false

[profile.test.package."*"]
debug = false

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MarulaHQ/marula-core"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
axum = { version = "0.8" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }
redis = { version = "0.27", features = ["tokio-comp"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
# NOTE: `reqwest-blocking-client`, not `reqwest-client` — the SDK's default
# batch processors export via futures_executor::block_on on their own
# threads, where the ASYNC reqwest client panics ("no reactor running").
# The blocking client is the documented pairing for BatchSpanProcessor /
# PeriodicReader (open-telemetry-rust#2673, #3125).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
# 0.34 is the release that upgraded to OpenTelemetry 0.33, so this line and the
# four above move together: a lone 0.34 pulls a second otel copy (0.33) beside
# the SDK the tracer provider comes from (0.32) and the layer stops accepting it.
tracing-opentelemetry = "0.34"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
argon2 = "0.6"
# 11 still needs the backend named explicitly (its default features carry
# `use_pem` only). `rust_crypto` keeps the pure-Rust path the 10.x migration
# chose; `aws_lc_rs` would add a C toolchain to every build.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.11"
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
hmac = "0.13"
subtle = "2"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde_urlencoded = "0.7"
totp-rs = { version = "6", default-features = false, features = ["otpauth"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "0.5"
aes-gcm = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
url = "2"
regex = "1"
data-encoding = "2"
async-trait = "0.1"
base64 = "0.22"
proptest = "1"
object_store = { version = "0.12", default-features = false, features = ["aws"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
# ADR 0023 Decision 1: the plugin sandbox engine, exact-pinned. An engine bump is
# an amendment to the ADR, not a `cargo update`: 48.0.7 is the newest release
# whose MSRV (1.95) this repository's toolchain satisfies — 49 needs 1.96 and 50
# needs 1.97, and neither builds here.
wasmtime = "=48.0.7"

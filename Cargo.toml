[workspace]
resolver = "2"
members = [
    "crates/core-api",
    "crates/core-billing",
    "crates/core-db",
    "crates/core-documents",
    "crates/core-domain",
    "crates/core-events",
    "crates/core-kb",
    "crates/core-mail",
    "crates/core-otel",
    "crates/core-projects",
    "crates/core-reports",
    "crates/core-store",
    "crates/mcp-server",
    "crates/realtime",
    "crates/worker",
    "crates/plugin-host",
    "crates/meridian-cli",
    # Wave 9 adapters lane: first-party Apache-2.0 connector crates
    # (public-API-only edge adapters; separate license from the AGPL core).
    "connectors/qbo-export-sync",
    "connectors/xero-export-sync",
    # DMS sync-connector lane (2026-09-10): external documentation-system
    # adapter (IT Glue / Hudu exports + generic REST), public-API-only.
    "connectors/dms-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Marlin-Hofmeyer/meridian"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }
redis = { version = "0.27", features = ["tokio-comp"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
# NOTE: `reqwest-blocking-client`, not `reqwest-client` — the SDK's default
# batch processors export via futures_executor::block_on on their own
# threads, where the ASYNC reqwest client panics ("no reactor running").
# The blocking client is the documented pairing for BatchSpanProcessor /
# PeriodicReader (open-telemetry-rust#2673, #3125).
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
argon2 = "0.5"
jsonwebtoken = "9"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde_urlencoded = "0.7"
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "0.5"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
data-encoding = "2"
async-trait = "0.1"
base64 = "0.22"
proptest = "1"
object_store = { version = "0.12", default-features = false, features = ["aws"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

[package]
name = "plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-domain = { path = "../core-domain" }
core-db = { path = "../core-db" }
# The artifact store seam (`lifecycle`): module bytes are addressed through the
# same ObjectStore trait attachments and quarantine already use, so a plugin
# module is one more content-addressed object and not a second storage system.
core-store = { path = "../core-store" }
bytes = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ed25519-dalek = { workspace = true }
sqlx = { workspace = true }
wasmtime = { workspace = true }
# NO `reqwest` here, and that is a security property rather than an oversight:
# this crate is linked into BOTH the parent and the worker binary, so a client
# here would be a client in the process that runs untrusted wasm. The transport
# lives in core-api (`plugin_http`), behind `egress::HttpEgress`.
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# WAT fixtures for the sandbox tests: the pool and the limit tests need a module
# that loops forever, one that grows memory without bound and one that calls an
# import the namespace does not declare. A WAT string compiled in the test is
# cheaper than three checked-in binaries nobody can read.
wat = "1"

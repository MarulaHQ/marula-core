[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-api = { path = "../core-api" }
core-db = { path = "../core-db" }
core-domain = { path = "../core-domain" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
http = "1"


[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dev-dependencies]
tower = { workspace = true }
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest"] }

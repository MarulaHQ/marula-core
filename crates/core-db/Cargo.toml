[package]
name = "core-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-domain = { path = "../core-domain", features = ["sqlx"] }
sqlx = { workspace = true }
# One bounded retry, when a pool cannot open its first connection: see
# `connect_with`. Bounded so a host that swallows packets cannot turn a
# diagnosable refusal into a hang.
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Dev-tool surface (`demo` module, the private build tracker DX1): demo org seeding seals
# webhook/alert-source secrets at rest and argon2-hashes the demo login
# password — the same schemes the production write paths use.
aes-gcm = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
# Demo attachments write real bytes into the same object store core-api
# reads from, so a prospect who clicks "download" in the demo gets a file
# rather than a 500. Only the `LocalFsStore` adapter is used here.
core-store = { path = "../core-store" }

[dev-dependencies]
aes-gcm = { workspace = true }
core-kb = { path = "../core-kb" }
tokio = { workspace = true }
chrono-tz = { workspace = true }
testcontainers = { version = "0.23", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }

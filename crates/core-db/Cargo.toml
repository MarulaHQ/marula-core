[package]
name = "core-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-domain = { path = "../core-domain", features = ["sqlx"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Dev-tool surface (`demo` module, TASKLIST DX1): demo org seeding seals
# webhook/alert-source secrets at rest and argon2-hashes the demo login
# password — the same schemes the production write paths use.
aes-gcm = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
aes-gcm = { workspace = true }
core-kb = { path = "../core-kb" }
tokio = { workspace = true }
chrono-tz = { workspace = true }
testcontainers = { version = "0.23", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }

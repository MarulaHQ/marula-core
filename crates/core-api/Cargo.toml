[package]
default-run = "core-api"
name = "core-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio = { workspace = true }
async-trait = { workspace = true }
testcontainers = { version = "0.28", features = ["reusable-containers"] }
# Signing an artifact in the entitlement-adoption unit tests:
# `verify_artifact` is pure and takes a trust set, so the tests mint a real
# ed25519 signature rather than asserting against a mock there is no seam for.
ed25519-dalek = { workspace = true }
hex = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
serial_test = "3"
# The CI feeder gate drives the REAL feeder adapters over the wire
# (public API contract) against this router — test-only edge; the
# connector never imports the core.
ci-feeders = { path = "../../plugins/connectors/ci-feeders" }
app-bridges = { path = "../../plugins/connectors/app-bridges" }


[[bin]]
name = "core-api"
path = "src/main.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[dependencies]
async-trait = { workspace = true }
core-db = { path = "../core-db" }
core-decision = { path = "../core-decision" }
core-domain = { path = "../core-domain", features = ["openapi"] }
plugin-host = { path = "../plugin-host" }
app-bridges = { path = "../../plugins/connectors/app-bridges" }
# Wave 47 lane A8: the vendor-agnostic DNS-record-management contract
# (`adapters-core::dns`). Core's custom-domain verification consumes the seam's
# manual-instructions generator and token matcher; it never requires a
# provider plugin.
adapters-core = { path = "../../plugins/connectors/adapters-core" }
# Wave 47 lane A8: resolves `_marula-verify.<domain>` TXT through the SYSTEM
# resolver (system-config + tokio features), the generic verification path.
hickory-resolver = "0.26"
core-billing = { path = "../core-billing" }
core-documents = { path = "../core-documents" }
core-kb = { path = "../core-kb" }
core-projects = { path = "../core-projects" }
core-reports = { path = "../core-reports", features = ["openapi"] }
core-events = { path = "../core-events" }
core-mail = { path = "../core-mail" }
# Wave 32 lane 7: the routing provider seam + the first-party Mapbox
# provider (ADR 0013 standard set).
core-routing = { path = "../core-routing" }
mapbox-routing = { path = "../../plugins/connectors/mapbox" }
core-otel = { path = "../core-otel" }
core-store = { path = "../core-store" }
# Wave 49 lane R4 (all-in-one mode): one core-api process can host the
# worker loops for a demo/tiny install. The edge is acyclic — the worker
# crate does not depend on core-api (it reaches the API's internal surface
# over HTTP, never as a crate).
worker = { path = "../worker" }
subtle = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
# QR + Code128 SVG rendering for label previews/prints (lane 5,
# p32-labels-scanning): pure-Rust encoders, svg feature only for qrcode,
# no image codecs either way — the web draws the returned SVG as an image.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
barcoders = { version = "2", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
totp-rs = { workspace = true }
webauthn-rs = { workspace = true }
aes-gcm = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
data-encoding = { workspace = true }
base32 = "0.5"
base64 = "0.22"
bytes = { workspace = true }

# The `openapi` cfg is set by SDK-generation feature unification (handlers
# annotate `cfg_attr(feature = "openapi", ...)`) — declared here so
# unexpected_cfgs stops flagging the established pattern.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("openapi"))'] }
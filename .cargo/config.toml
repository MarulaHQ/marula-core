# Shared build cache across main + all agent worktrees (disk guardrails DX6).
# TRACKED: `git ls-files .cargo/config.toml` lists it (a lane's .kilo/setup-script
# rewrites its copy when it drifts), so a change here reaches every lane and
# every developer — not a machine-local file, whatever earlier revisions said.
# ONE dir for every checkout means one checkout's artifacts can satisfy another
# checkout's build: cargo records dep-info paths relative to the workspace root,
# so a peer's stale rlib passes this tree's freshness check and gets linked. The
# provenance guard closes that — `python3 scripts/lane-target-guard.py check
# --profile release --fix` before a release build (scripts/e2e-stack.sh already
# does), `mark` after. Evidence and the release-profile trap:
# internal/design/qa-p47-lane-env-hygiene/REVIEW.md.

# ---------------------------------------------------------------------------
# Build throughput (Wave 52 lane P13). Evidence: internal/design/qa-p52-build-throughput/.
#
# This file keeps only settings that cannot be missing, and adds one key. A TOML
# config has no `if`, so an unconditional `linker` or `rustc-wrapper` would turn
# a tool a fresh machine does not have into a build that cannot start. Instead
# `include` loads an overlay written by `scripts/p13-build-env.sh` from what THIS
# host actually has, and `optional = true` means no overlay is not an error: with
# the file absent, cargo reads this file alone and behaves exactly as it did
# before.
#
#   scripts/p13-build-env.sh info      what this machine can accelerate with
#   scripts/p13-build-env.sh enable    write the overlay for the tools present
#   scripts/p13-build-env.sh disable   delete it; stock behaviour, byte for byte
#
# The overlay carries, only when the tool is present:
#   * ld64.lld (macOS) / lld / mold (Linux) as the linker, through
#     `target.'cfg(...)'.rustflags` — link time;
#   * sccache as `build.rustc-wrapper` — recompile time, including after a
#     branch switch, which is the case `incremental = false` below gives up.
# sccache is local disk, beside the shared target dir, and nothing here points
# it at a remote. See the guard's docstring for why that matters.
#
# Cargo before 1.94 does not know the key and ignores it (the same silent
# "unused config key" path this file already records for `cargo-incremental`
# below), so an old toolchain builds and only loses the speedup. The overlay
# content is derived from the host alone, so every worktree on one machine
# writes byte-identical fingerprints and no lane invalidates another's
# artifacts in the shared target dir.
include = [{ path = "p13-fast.local.toml", optional = true }]
# ^ Relative to THIS file's directory, which is how cargo resolves include
# paths: the overlay lives beside this file in .cargo/. The previous spelling
# (".cargo/p13-fast.local.toml") resolved to .cargo/.cargo/..., never existed,
# and `optional = true` turned that into silence — so the linker/sccache
# overlay has never actually loaded since it was written (proved 2026-10-27
# against cargo 1.95 with the two spellings side by side).

[build]
# NO `target-dir` here, on purpose.
#
# Cargo ranks the including config above the included one, so a key written
# here cannot be overridden by the machine-local overlay below. That left one
# file carrying two contradictory jobs: this tracked file decides what CI and
# every fresh clone do, and it used to name one machine's absolute checkout
# path (`/Users/<name>/...`), which made every other clone and every runner
# fail before the first compile with `failed to create directory ...
# Permission denied`.
#
# So the key lives where the decision belongs:
#   - absent (CI, a fresh clone): cargo's default `target/`, which is also the
#     path `Swatinem/rust-cache` caches without any configuration — no wasted
#     runner minutes on a cache it cannot find;
#   - present (a developer machine that wants ONE cache across every worktree):
#     written into `.cargo/p13-fast.local.toml` by
#         scripts/p13-build-env.sh enable --share-target
#     which points it at the main checkout's `.kilo/target-shared`.
#
# One consequence worth knowing: a shared dir means a sibling worktree's
# artifact can satisfy this tree's build (cargo records dep-info paths relative
# to the workspace root). That is the 2026-10-22 stale-rmeta class, and
# `scripts/lane-target-guard.py` is the answer to it — run its `check` before a
# release build, as `scripts/e2e-stack.sh` already does.

# DX6b disk guardrail (2026-09-17): cargo has no GC for incremental sessions —
# every re-run of a test cycle left another full session behind (132 sessions,
# 12GB, mostly rewritten each run). Incremental buys nothing for one-shot test
# binary builds, so it is disabled workspace-wide; ordinary `cargo check`
# turnarounds are unaffected (they were already hitting .rmeta reuse).
# 2026-09-24 fix: `cargo-incremental` was not a real cargo key (silently
# ignored, so incremental stayed ON and the caches kept regrowing). The
# correct `build.incremental` key is used below.
#
# Kept off by P13. The disk argument has not changed. sccache may cover the
# case incremental was carrying — the second build after a small edit — but
# that is UNMEASURED on the reference host: `sccache` and `cargo-nextest` are
# not installed there, and the linker leg measured slower (64.1s stock against
# 77.3s with ld64.lld on a cold three-crate build). The overlay is therefore
# opt-in and promises nothing: enable it where the tool exists, then measure
# before believing it. A developer on a private target dir can still opt in to
# incremental with CARGO_INCREMENTAL=1 for one command.
incremental = false

[env]
# Point macOS SDK resolution at CommandLineTools so `tauri-build` / `swift-rs`
# inside `marula-desktop`'s build script never fails when full Xcode.app has a
# pending license prompt (`xcrun --sdk macosx --show-sdk-path` exit 69).
DEVELOPER_DIR = { value = "/Library/Developer/CommandLineTools", force = false }
